name: 'Setup dde'
description: 'Install the whatwedo dde CLI on a GitHub Actions runner'
author: 'sbaerlocher'

branding:
  icon: 'box'
  color: 'orange'

inputs:
  version:
    description: 'dde version to install (e.g. v2.0.0-beta.2) or "latest". Pin an exact tag in CI — "latest" follows pre-releases, so breaking dde changes propagate immediately.'
    required: false
    default: 'latest'
  install-mkcert:
    description: 'Install mkcert (and libnss3-tools on Linux) so dde can issue local TLS certs'
    required: false
    default: 'true'
  system-install:
    description: 'Run `dde system:install` after installing the binary. Requires Docker; dde escalates internally (passwordless sudo) for steps that need root.'
    required: false
    default: 'false'
  github-token:
    description: 'Token used to query the GitHub API (avoids unauthenticated rate limits when resolving "latest")'
    required: false
    default: ${{ github.token }}
  repository:
    description: 'GitHub repository slug to download dde releases from. Override for forks or staging mirrors.'
    required: false
    default: 'whatwedo/dde'

outputs:
  version:
    description: 'Resolved version that was installed (e.g. v2.0.0-alpha.5)'
    value: ${{ steps.resolve.outputs.version }}
  binary-path:
    description: 'Absolute path to the installed dde binary'
    value: ${{ steps.install.outputs.binary-path }}

runs:
  using: 'composite'
  steps:
    - name: Detect platform
      id: platform
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          *)
            echo "::error::dde does not ship a binary for $RUNNER_OS"
            exit 1
            ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *)
            echo "::error::dde does not ship a binary for $RUNNER_ARCH"
            exit 1
            ;;
        esac
        echo "asset=dde-${os}-${arch}" >> "$GITHUB_OUTPUT"

    - name: Resolve version
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repository }}
        REQUESTED: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ "$REQUESTED" = "latest" ]; then
          # Use /releases (not /releases/latest) so this works while the
          # project only ships pre-releases — /releases/latest excludes
          # pre-releases and would 404. /releases is sorted by `created_at`
          # descending; we filter out drafts and take the first non-draft
          # release. Pre-releases ARE included by design (whatwedo/dde is
          # currently alpha). Pin `version` to an exact tag if you need a
          # stronger contract than "newest non-draft tag".
          auth_args=()
          if [ -n "${GH_TOKEN:-}" ]; then
            auth_args=(-H "Authorization: Bearer $GH_TOKEN")
          fi
          version=$(curl -fsSL \
            "${auth_args[@]}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases?per_page=10" \
            | jq -r '[.[] | select(.draft == false)][0].tag_name // empty')
        else
          case "$REQUESTED" in
            v*) version="$REQUESTED" ;;
            *)  version="v$REQUESTED" ;;
          esac
        fi
        if [ -z "$version" ]; then
          echo "::error::Could not resolve dde version (input: $REQUESTED, repo: $REPO)"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Resolved dde version: $version"

    - name: Install dde binary
      id: install
      shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
        ASSET: ${{ steps.platform.outputs.asset }}
        REPO: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        dl="$RUNNER_TEMP/dde-download"
        bin_dir="$RUNNER_TEMP/dde-bin"
        mkdir -p "$dl" "$bin_dir"

        base="https://github.com/${REPO}/releases/download/${VERSION}"
        echo "Downloading $base/$ASSET"
        curl -fsSL --retry 3 "$base/$ASSET" -o "$dl/$ASSET"
        curl -fsSL --retry 3 "$base/checksums.txt" -o "$dl/checksums.txt"

        # GoReleaser writes "<sha>  <filename>" (two spaces). Match any
        # whitespace run so we don't break if the format ever switches to a
        # tab. Extract the line first, fail with a clear message if missing,
        # then pipe to shasum so the verification error path stays clean.
        echo "Verifying SHA256 for $ASSET"
        if ! grep -E "[[:space:]]+${ASSET}\$" "$dl/checksums.txt" > "$dl/expected.sum"; then
          echo "::error::Asset '${ASSET}' not listed in checksums.txt for ${VERSION}"
          echo "checksums.txt contents:" && cat "$dl/checksums.txt"
          exit 1
        fi
        ( cd "$dl" && shasum -a 256 -c expected.sum )

        install -m 0755 "$dl/$ASSET" "$bin_dir/dde"
        echo "$bin_dir" >> "$GITHUB_PATH"
        echo "binary-path=$bin_dir/dde" >> "$GITHUB_OUTPUT"

        "$bin_dir/dde" --version

    - name: Install mkcert
      if: inputs.install-mkcert == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v mkcert >/dev/null 2>&1; then
          echo "mkcert already installed: $(mkcert -version 2>&1 || true)"
          exit 0
        fi
        case "$RUNNER_OS" in
          Linux)
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mkcert libnss3-tools
            ;;
          macOS)
            brew install mkcert nss
            ;;
        esac
        mkcert -version

    # `dde system:install` writes a systemd-resolved drop-in to
    # /etc/systemd/resolved.conf.d/ and restarts systemd-resolved. On
    # GitHub-hosted Linux runners dde does not escalate for either step:
    # the mkdir hits `Permission denied`, and once that's fixed the
    # restart hits `Interactive authentication required.` from polkit.
    # Pre-create the drop-in directory world-writable so dde's mkdir is
    # a no-op, and install a polkit rule that grants the runner user
    # manage-units on systemd-resolved.service so the unprivileged
    # restart succeeds.
    #
    # Linux-only (resolved.conf.d / polkit are Linux constructs) and only
    # when system-install is requested. Drop this step once dde escalates
    # for these paths the same way it does for dnsmasq.
    - name: Pre-authorize dde DNS resolver setup (Linux)
      if: runner.os == 'Linux' && inputs.system-install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Narrowly scoped: only the drop-in directory is opened up, not
        # /etc/systemd itself. dde writes into this dir; the dir's mode
        # is 0777 but ephemeral hosted runners are single-user, so this
        # is bounded blast radius and avoids `chmod o+w /etc/systemd`.
        sudo install -d -m 0777 /etc/systemd/resolved.conf.d
        sudo install -d -m 0755 /etc/polkit-1/rules.d
        # `$(id -un)` is preferred over `$USER` here: `set -u` would
        # abort on an unset `$USER`, and an empty `$USER` would silently
        # bake `subject.user === ""` into the rule (it would never
        # match, and `dde system:install` would still fail at the
        # restart with the very polkit error this step exists to
        # prevent). `id -un` always resolves the effective user.
        sudo tee /etc/polkit-1/rules.d/49-dde-systemd-resolved.rules \
          >/dev/null <<EOF
        polkit.addRule(function(action, subject) {
          if (action.id === "org.freedesktop.systemd1.manage-units" &&
              action.lookup("unit") === "systemd-resolved.service" &&
              subject.user === "$(id -un)") {
            return polkit.Result.YES;
          }
        });
        EOF

    - name: Run dde system:install
      if: inputs.system-install == 'true'
      shell: bash
      env:
        BINARY: ${{ steps.install.outputs.binary-path }}
      run: |
        set -euo pipefail
        # Run as the runner user, not under sudo. dde escalates internally
        # for the steps that need root (mkcert CA, DNS resolver), and that
        # path relies on passwordless sudo, which GitHub-hosted runners
        # provide. Wrapping the whole command in `sudo` would leave dde's
        # state files (~/.dde/data/...) root-owned, breaking the
        # subsequent unprivileged `dde project:*` calls.
        "$BINARY" system:install

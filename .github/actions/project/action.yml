name: 'dde project'
description: 'Install dde and run a `dde project:<command>` (default: up). Designed for E2E pipelines and ad-hoc lifecycle steps.'
author: 'sbaerlocher'

branding:
  icon: 'play'
  color: 'orange'

inputs:
  command:
    description: 'dde project subcommand to run (up, down, stop, update, ...). Determines whether `system-install`, `pre-pull-images` and `wait-url` apply.'
    required: false
    default: 'up'
  version:
    description: 'dde version to install (e.g. v2.0.0-beta.2) or "latest". Pin an exact tag in CI — "latest" follows pre-releases, so breaking dde changes propagate immediately.'
    required: false
    default: 'latest'
  working-directory:
    description: 'Directory containing .dde/config.yml. Defaults to the repository root.'
    required: false
    default: '.'
  install-mkcert:
    description: 'Install mkcert (and libnss3-tools on Linux) — required for TLS certs'
    required: false
    default: 'true'
  system-install:
    description: 'Run `dde system:install` to set up the host (Traefik, mkcert CA, dnsmasq). Only applied when `command: up`; ignored otherwise.'
    required: false
    default: 'true'
  pre-pull-images:
    description: >-
      Pre-pull all compose images (every profile) before `project:up`.
      dde's dev-layer build probes each image with a 30-second timeout;
      on a cold image cache — every fresh CI runner — pulling a larger
      image inside that probe exceeds the limit and fails the up. Only
      applied when `command: up`; ignored otherwise.
    required: false
    default: 'true'
  wait-url:
    description: 'If set, polls this URL until it returns 2xx/3xx (or wait-timeout expires). TLS errors are ignored. Only applied when `command: up`; ignored otherwise.'
    required: false
    default: ''
  wait-timeout:
    description: 'Maximum seconds to wait for wait-url to respond'
    required: false
    default: '180'
  github-token:
    description: 'Token used to query the GitHub API when resolving "latest"'
    required: false
    default: ${{ github.token }}
  repository:
    description: 'GitHub repository slug to download dde releases from'
    required: false
    default: 'whatwedo/dde'

outputs:
  version:
    description: 'Resolved dde version that was installed'
    value: ${{ steps.setup.outputs.version }}
  binary-path:
    description: 'Absolute path to the installed dde binary'
    value: ${{ steps.setup.outputs.binary-path }}

runs:
  using: 'composite'
  steps:
    # Validate `command` before anything with side effects (downloading the
    # dde binary, running system:install, ...). An empty command is almost
    # always a typo or a forgotten with-block — fail fast with no I/O.
    - name: Validate inputs
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        if [ -z "$COMMAND" ]; then
          echo "::error::'command' input must not be empty."
          exit 1
        fi

    # `uses: ./...` from inside a composite action resolves against the
    # caller's GITHUB_WORKSPACE, NOT against this action's own repo — see
    # https://github.com/actions/runner/issues/2185. Reference setup-dde via
    # the full repo path with a date tag so the action keeps working when
    # consumed from any repository. Renovate keeps this ref in sync with new
    # rolling-release tags via the github-actions manager.
    #
    # `system-install` is only meaningful before `project:up`; for any other
    # command (down/restart/update/...), force it to 'false' so we don't
    # re-provision the host on every lifecycle step.
    - name: Setup dde
      id: setup
      uses: sbaerlocher/.github/.github/actions/setup-dde@2026-08-10
      with:
        version: ${{ inputs.version }}
        install-mkcert: ${{ inputs.install-mkcert }}
        system-install: ${{ inputs.command == 'up' && inputs.system-install || 'false' }}
        github-token: ${{ inputs.github-token }}
        repository: ${{ inputs.repository }}

    # dde's dev-layer build probes every compose image (all profiles, even
    # inactive ones) with a 30s `docker run … exit 0` timeout. On a cold
    # image cache pulling a larger image (grafana, loki, ...) inside that
    # probe exceeds the timeout and fails project:up before the stack
    # starts. Pre-pull all pinned images so the probe only ever runs
    # already-present ones. Best-effort by design: every failure path
    # exits 0 — a missing directory or compose file is re-checked with a
    # friendly ::error:: in the next step, and a pull failure surfaces
    # with proper context during project:up.
    - name: Pre-pull compose images
      if: inputs.command == 'up' && inputs.pre-pull-images == 'true'
      shell: bash
      env:
        WD: ${{ inputs.working-directory }}
      run: |
        set -uo pipefail
        cd "$WD" 2>/dev/null || exit 0
        docker compose config --quiet >/dev/null 2>&1 || exit 0
        docker compose --profile '*' pull --ignore-buildable --quiet || true

    # cd is done inside the script (not via working-directory:) so that a
    # missing/typo'd working-directory produces our friendly ::error::
    # instead of the runner's generic ENOENT before the script runs.
    - name: Run dde project command
      shell: bash
      env:
        BINARY: ${{ steps.setup.outputs.binary-path }}
        WD: ${{ inputs.working-directory }}
        COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        if [ ! -d "$WD" ]; then
          echo "::error::working-directory '$WD' does not exist."
          exit 1
        fi
        cd "$WD"
        if [ ! -f .dde/config.yml ]; then
          echo "::error::No .dde/config.yml found in $(pwd). Set 'working-directory' to the project root."
          exit 1
        fi
        "$BINARY" "project:$COMMAND"

    # wait-url polling only makes sense after `up` brought services online.
    # Skip silently for any other command so callers can pass wait-url
    # unconditionally without producing misleading log noise.
    - name: Wait for URL
      if: inputs.command == 'up' && inputs.wait-url != ''
      shell: bash
      env:
        URL: ${{ inputs.wait-url }}
        TIMEOUT: ${{ inputs.wait-timeout }}
      run: |
        # `-e` is intentionally omitted: the loop below tolerates curl
        # failures (DNS, TCP refused, timeout) and exits explicitly when the
        # deadline is reached or a 2xx/3xx is observed.
        set -uo pipefail
        if ! [[ "$TIMEOUT" =~ ^[0-9]+$ ]] || [ "$TIMEOUT" -le 0 ]; then
          echo "::error::wait-timeout must be a positive integer (got: '$TIMEOUT')"
          exit 1
        fi
        deadline=$(( $(date +%s) + TIMEOUT ))
        echo "Polling $URL until 2xx/3xx (timeout: ${TIMEOUT}s, ignoring TLS errors)"
        attempt=0
        status=""
        while [ "$(date +%s)" -lt "$deadline" ]; do
          attempt=$((attempt + 1))
          status=$(curl -ksS -o /dev/null -w '%{http_code}' --max-time 5 "$URL" 2>/dev/null || true)
          case "$status" in
            2*|3*)
              echo "Got HTTP $status after $attempt attempt(s) — ready"
              exit 0
              ;;
          esac
          sleep 2
        done
        echo "::error::Timed out after ${TIMEOUT}s waiting for $URL (last status: ${status:-no-response}, attempts: $attempt)"
        exit 1

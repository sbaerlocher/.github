name: Continuous Integration - Terraform

on:
  workflow_call:
    inputs:
      terraform-version:
        type: string
        default: '1.14.3'
      working-directory:
        type: string
        default: '.'
        description: 'Directory containing Terraform configuration'
      enable-tflint:
        type: boolean
        default: false
      enable-sarif-upload:
        type: boolean
        default: false
        description: 'Upload SARIF results to GitHub Security tab (requires public repo or GitHub Advanced Security)'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_CLI_ARGS: '-no-color'

jobs:
  validation:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      validation_result: ${{ steps.validation.outputs.result }}

    steps:
      - name: Repository Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Terraform Toolchain Setup
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Terraform Validation
        id: validation
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "::group::Terraform Validation"
          echo "Validating Terraform configuration in: ${{ inputs.working-directory }}"

          # Initialize Terraform without backend for validation
          terraform init -backend=false

          # Validate configuration
          if terraform validate; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "::notice::Terraform configuration is valid"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
            echo "::error::Terraform validation failed"
            exit 1
          fi

          # Check formatting
          if ! terraform fmt -check=true -diff=true; then
            echo "::error::Terraform formatting issues detected - run 'terraform fmt' to fix"
            exit 1
          fi

          echo "::endgroup::"

  lint:
    name: Lint
    if: ${{ inputs.enable-tflint }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2
        with:
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          tflint_version: 'v0.62.0'

      - name: TFLint Init
        working-directory: ${{ inputs.working-directory }}
        run: tflint --init

      - name: TFLint Run
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Running TFLint in: ${{ inputs.working-directory }}"
          tflint --format compact
          echo "TFLint passed"

  trivy:
    name: Vulnerability Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: ${{ inputs.working-directory }}
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Trivy JSON Results
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: ${{ inputs.working-directory }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy Results (Artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-results
          path: trivy-results.json
          retention-days: 30

      - name: Trivy SARIF Results
        if: ${{ inputs.enable-sarif-upload }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: ${{ inputs.working-directory }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy SARIF to GitHub Security
        if: ${{ inputs.enable-sarif-upload }}
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

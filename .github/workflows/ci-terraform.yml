name: Continuous Integration - Terraform

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: 'ubuntu-latest'
        description: >-
          Single runner label for all jobs in this workflow (e.g.
          `ubuntu-latest`, `self-hosted`). Runner groups and multi-label
          selectors are not supported.
      terraform-version:
        type: string
        default: '1.14.3'
      working-directory:
        type: string
        default: '.'
        description: 'Directory containing Terraform configuration'
      enable-tflint:
        type: boolean
        default: false
      enable-sarif-upload:
        type: boolean
        default: false
        description: 'Upload SARIF results to GitHub Security tab (requires public repo or GitHub Advanced Security)'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_CLI_ARGS: '-no-color'

jobs:
  # One job, not three. `validation`, `lint` and `trivy` each ran on their own
  # runner, and Actions bills every job rounded up to a full minute — three
  # billed minutes for work that finishes in well under one. `needs: validation`
  # on the other two was fail-fast only (see the comments this replaces), never
  # an ordering requirement, so nothing here depended on separate jobs.
  #
  # The job keeps the name `Validate`: consumers list
  # `<caller-job> / Validate` in their rulesets. `Vulnerability Scanning`
  # disappears as a check — see CHANGELOG.md for the migration.
  #
  # Independence is preserved by `continue-on-error` on every check step, so a
  # failing `terraform validate` no longer hides the tflint and Trivy findings
  # after it; the enforce step at the end turns any recorded failure back into
  # a red job. The one deliberate exception is the fmt check, which stays
  # gated on the validate outcome — see its comment.
  validation:
    name: Validate
    runs-on: ${{ inputs.runner }}
    # `upload-sarif` needs security-events: write and a called workflow cannot
    # obtain a permission it does not declare — without this the step 403s for
    # any caller setting enable-sarif-upload. Job-level so the grant covers the
    # SARIF step only. Still capped by the caller: a consumer whose trigger
    # workflow withholds it will keep 403ing.
    permissions:
      contents: read
      security-events: write
    env:
      # `terraform init` above populates .terraform/modules/ with upstream
      # module sources. The pre-merge trivy job checked out fresh and never ran
      # init, so it saw only this repo's files. One value rather than a literal
      # per scan: three copies are what let one of them go missing.
      TRIVY_SKIP_DIRS: '**/.terraform'
    # Sum of the three former budgets (15 + 10 + 10), not the largest: the
    # steps now run serially under one cap. Trivy pulls its vulnerability DB
    # over the network and is the step whose duration is not bounded by repo
    # size, so a tighter cap would turn a slow registry into a job timeout —
    # which also kills the always() enforce step, the one that says which
    # check was in flight.
    timeout-minutes: 35

    steps:
      - name: Repository Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Terraform Toolchain Setup
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Terraform Validation
        id: validation
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          echo "::group::Terraform Validation"
          echo "Validating Terraform configuration in: $WORKING_DIRECTORY"

          # Initialize Terraform without backend for validation
          terraform init -backend=false

          # Validate configuration
          if terraform validate; then
            echo "::notice::Terraform configuration is valid"
          else
            echo "::error::Terraform validation failed"
            exit 1
          fi

          echo "::endgroup::"

      # Split out of the step above, which reached its `terraform fmt` only
      # when `terraform validate` succeeded — the failure branch exited first.
      # That order is deliberate and kept: `fmt -check` on a configuration
      # HCL cannot parse reports the parse error again rather than a
      # formatting finding.
      - name: Terraform Format Check
        id: fmt
        if: steps.validation.outcome != 'failure'
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "::group::Terraform Format Check"
          if ! terraform fmt -check=true -diff=true; then
            echo "::error::Terraform formatting issues detected - run 'terraform fmt' to fix"
            exit 1
          fi
          echo "::endgroup::"

      # Former `lint` job. Its job-level `if: inputs.enable-tflint` is now a
      # step-level `if`, and its `needs: validation` fail-fast is the outcome
      # test — same semantics, no second runner.
      - name: Setup TFLint
        id: tflint-setup
        if: steps.validation.outcome != 'failure' && inputs.enable-tflint
        continue-on-error: true
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          tflint_version: 'v0.64.0'

      - name: TFLint Init
        id: tflint-init
        if: >-
          steps.validation.outcome != 'failure'
          && steps.tflint-setup.outcome != 'failure'
          && inputs.enable-tflint
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: tflint --init

      - name: TFLint Run
        id: tflint
        if: >-
          steps.validation.outcome != 'failure'
          && steps.tflint-setup.outcome == 'success'
          && steps.tflint-init.outcome == 'success'
          && inputs.enable-tflint
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          echo "Running TFLint in: $WORKING_DIRECTORY"
          tflint --format compact
          echo "TFLint passed"

      # Former `trivy` job. It ran with `exit-code: '0'`, so it never failed
      # the run and its `needs: validation` only saved a runner; the scan is
      # therefore not gated on the validate outcome — a config Trivy can still
      # parse is worth scanning even when `terraform validate` is unhappy, and
      # the artifact upload below is what consumers read.
      - name: Run Trivy Scanner
        id: trivy-table
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: ${{ inputs.working-directory }}
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      - name: Trivy JSON Results
        id: trivy-json
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: ${{ inputs.working-directory }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}
          exit-code: '0'

      # Best-effort reporting, deliberately outside the enforce list: a failed
      # artifact upload should not fail a run whose scans all passed. Gated on
      # the scan that writes the file so it cannot fail on a missing path.
      - name: Upload Trivy Results (Artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.trivy-json.outcome == 'success'
        continue-on-error: true
        with:
          name: trivy-results
          path: trivy-results.json
          retention-days: 30

      - name: Trivy SARIF Results
        id: trivy-sarif
        if: ${{ inputs.enable-sarif-upload }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: ${{ inputs.working-directory }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          skip-dirs: ${{ env.TRIVY_SKIP_DIRS }}

      - name: Upload Trivy SARIF to GitHub Security
        id: sarif-upload
        if: ${{ inputs.enable-sarif-upload && steps.trivy-sarif.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      # `continue-on-error` above keeps a failing check from masking the ones
      # after it, which also means the job would end green on its own. This
      # step is what turns any recorded failure back into a red job.
      #
      # Every check step is enforced, Trivy included. `exit-code: '0'` keeps
      # findings from failing the run — that is the pre-merge behaviour — but
      # the action still exits non-zero on an execution error (DB download,
      # rate limiting, a bad scan-ref), and that has to reach the gate rather
      # than disappear into `continue-on-error`. The artifact upload is the one
      # deliberate exclusion; see its comment above.
      - name: Enforce validation results
        if: always()
        env:
          VALIDATION_RESULT: ${{ steps.validation.outcome || 'skipped' }}
          FMT_RESULT: ${{ steps.fmt.outcome || 'skipped' }}
          TFLINT_INIT_RESULT: ${{ steps.tflint-init.outcome || 'skipped' }}
          TFLINT_SETUP_RESULT: ${{ steps.tflint-setup.outcome || 'skipped' }}
          TFLINT_RESULT: ${{ steps.tflint.outcome || 'skipped' }}
          TRIVY_TABLE_RESULT: ${{ steps.trivy-table.outcome || 'skipped' }}
          TRIVY_JSON_RESULT: ${{ steps.trivy-json.outcome || 'skipped' }}
          TRIVY_SARIF_RESULT: ${{ steps.trivy-sarif.outcome || 'skipped' }}
          SARIF_UPLOAD_RESULT: ${{ steps.sarif-upload.outcome || 'skipped' }}
        run: |
          set -euo pipefail
          FAILED=0
          for pair in \
            "Terraform Validation:${VALIDATION_RESULT}" \
            "Terraform Format Check:${FMT_RESULT}" \
            "TFLint Init:${TFLINT_INIT_RESULT}" \
            "Setup TFLint:${TFLINT_SETUP_RESULT}" \
            "TFLint Run:${TFLINT_RESULT}" \
            "Trivy scan:${TRIVY_TABLE_RESULT}" \
            "Trivy JSON scan:${TRIVY_JSON_RESULT}" \
            "Trivy SARIF scan:${TRIVY_SARIF_RESULT}" \
            "SARIF upload:${SARIF_UPLOAD_RESULT}"; do
            name="${pair%:*}"
            result="${pair##*:}"
            if [ "$result" = "failure" ]; then
              echo "::error::${name} failed"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "${FAILED} validation(s) failed"
            exit 1
          fi

          echo "All enabled validations passed"

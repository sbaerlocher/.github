---
name: Continuous Integration - JavaScript

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: 'ubuntu-latest'
        description: >-
          Single runner label for all jobs in this workflow (e.g.
          `ubuntu-latest`, `self-hosted`). Runner groups and multi-label
          selectors are not supported.
      package-manager:
        type: string
        default: 'pnpm'
        description: 'Package manager to use (npm, pnpm, yarn, bun)'
      node-version:
        type: string
        default: ''
        description: 'Node.js version to use (overrides node-version-file when set)'
      primary:
        type: boolean
        default: true
        description: 'Run security scans and dependency review (set false for non-primary matrix jobs)'
      node-version-file:
        type: string
        default: '.nvmrc'
        description: 'Node version file path (used when node-version is not set)'
      working-directory:
        type: string
        default: '.'
        description: 'Working directory'
      enable-typecheck:
        type: boolean
        default: true
        description: 'Enable TypeScript type checking'
      enable-format-check:
        type: boolean
        default: true
        description: 'Enable format checking'
      enable-lint:
        type: boolean
        default: true
        description: 'Enable linting'
      enable-build:
        type: boolean
        default: true
        description: 'Enable build'
      enable-tests:
        type: boolean
        default: true
        description: 'Enable unit tests'
      enable-coverage:
        type: boolean
        default: true
        description: 'Enable test coverage'
      enable-codecov:
        type: boolean
        default: false
        description: 'Upload coverage to Codecov'
      enable-bundle-size-check:
        type: boolean
        default: false
        description: 'Enable bundle size checking'
      enable-security-scans:
        type: boolean
        default: true
        description: 'Enable security scans (audit, trivy)'
      enable-dependency-review:
        type: boolean
        default: true
        description: 'Run dependency review on PRs'
      enable-sarif-upload:
        type: boolean
        default: false
        description: 'Upload SARIF results to GitHub Security tab (requires public repo)'
      max-bundle-size-kb:
        type: number
        default: 1024
        description: 'Maximum bundle size in KB'
      test-command:
        type: string
        default: 'test'
        description: 'Test command to run (without package manager prefix)'
      coverage-files:
        type: string
        default: './coverage/lcov.info'
        description: 'Coverage files to upload'
      audit-level:
        type: string
        default: 'moderate'
        description: 'Audit severity level (low, moderate, high, critical)'
      artifact-name-prefix:
        type: string
        required: false
        default: ''
        description: 'Prefix for artifact names to avoid conflicts'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).
      allowed-dependency-licenses:
        type: string
        required: false
        default: >-
          pkg:golang/tailscale.com,
          pkg:golang/gvisor.dev/gvisor,
          pkg:golang/go.opentelemetry.io/otel,
          pkg:golang/go.opentelemetry.io/otel/metric,
          pkg:golang/go.opentelemetry.io/otel/trace,
          pkg:golang/go.opentelemetry.io/otel/log,
          pkg:golang/go.opentelemetry.io/otel/sdk,
          pkg:golang/go.opentelemetry.io/otel/sdk/metric,
          pkg:golang/go.opentelemetry.io/otel/sdk/log,
          pkg:golang/go.opentelemetry.io/otel/exporters/otlp/otlptrace,
          pkg:golang/go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp,
          pkg:golang/go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc,
          pkg:golang/go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetrichttp,
          pkg:golang/go.opentelemetry.io/otel/exporters/otlp/otlpmetric/otlpmetricgrpc
        description: |
          Comma-separated purls exempt from the dependency-review license
          check. GitHub's license detection reports multi-license repos as
          LicenseRef-bad-* (tailscale.com: BSD-3-Clause, gvisor: Apache-2.0
          with MIT/BSD-3-Clause parts, opentelemetry-go: Apache-2.0 with an
          appended BSD-3-Clause notice in every module). Exempting by purl
          keeps LicenseRef-bad-* itself disallowed, so other misdetections
          still fail. Override to extend; keep the default entries.
    outputs:
      coverage:
        description: 'Test coverage percentage'
        value: ${{ jobs.quality-and-test.outputs.coverage }}
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  quality-and-test:
    name: Test & Lint
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Get cache directory
        id: cache-dir
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
              ;;
            bun)
              echo "dir=$HOME/.bun/install/cache" >> "$GITHUB_OUTPUT"
              ;;
            yarn)
              echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
              ;;
            npm)
              echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          key: ${{ runner.os }}-${{ inputs.package-manager }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock', '**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.package-manager }}-

      - name: Cache Turborepo
        if: hashFiles('turbo.json') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package-lock.json', 'yarn.lock', 'bun.lock', 'bun.lockb') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package-lock.json', 'yarn.lock', 'bun.lock', 'bun.lockb') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            bun)
              bun install --frozen-lockfile
              ;;
            yarn)
              yarn install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
          esac

      - name: Type check
        if: inputs.enable-typecheck
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm typecheck
              ;;
            bun)
              bun run typecheck
              ;;
            yarn)
              yarn typecheck
              ;;
            npm)
              npm run typecheck
              ;;
          esac

      - name: Format check
        if: inputs.enable-format-check
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm format:check
              ;;
            bun)
              bun run format:check
              ;;
            yarn)
              yarn format:check
              ;;
            npm)
              npm run format:check
              ;;
          esac

      - name: Lint
        if: inputs.enable-lint
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm lint
              ;;
            bun)
              bun run lint
              ;;
            yarn)
              yarn lint
              ;;
            npm)
              npm run lint
              ;;
          esac

      - name: Build
        if: inputs.enable-build
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm build
              ;;
            bun)
              bun run build
              ;;
            yarn)
              yarn build
              ;;
            npm)
              npm run build
              ;;
          esac

      # TEST_COMMAND is deliberately unquoted below: the input carries a script
      # name plus optional arguments (e.g. `test -- --shard=1/2`), so it must
      # word-split. Going through `env:` makes the value data rather than source
      # text, so it is IFS-split and globbed but never parsed as shell — quotes
      # and escapes inside it are no longer honoured (see CHANGELOG 2026-08-03).
      - name: Run tests without coverage
        if: inputs.enable-tests && !inputs.enable-coverage
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          # shellcheck disable=SC2086 # test-command may carry arguments
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm $TEST_COMMAND
              ;;
            bun)
              bun run $TEST_COMMAND
              ;;
            yarn)
              yarn $TEST_COMMAND
              ;;
            npm)
              npm run $TEST_COMMAND
              ;;
          esac

      - name: Run tests with coverage
        if: inputs.enable-tests && inputs.enable-coverage
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm test:coverage
              ;;
            bun)
              bun run test:coverage
              ;;
            yarn)
              yarn test:coverage
              ;;
            npm)
              npm run test:coverage
              ;;
          esac

      - name: Extract coverage percentage
        if: inputs.enable-coverage
        id: coverage
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f coverage/lcov.info ]; then
            COVERAGE=$(cat coverage/lcov.info | grep -E '^LF:|^LH:' | \
              awk '{sum+=$2} END {if (NR>0) printf "%.2f%%", (sum/NR)*100; else print "N/A"}')
            echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
            echo "Test coverage: $COVERAGE"
          else
            echo "coverage=N/A" >> "$GITHUB_OUTPUT"
            echo "::warning::No coverage file found"
          fi

      - name: Upload coverage to Codecov
        if: inputs.enable-codecov && inputs.enable-coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ inputs.coverage-files }}
          fail_ci_if_error: false

      - name: Upload coverage artifact
        if: inputs.enable-coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name-prefix }}coverage-report
          path: ${{ inputs.working-directory }}/coverage
          retention-days: 30

      - name: Check bundle sizes
        if: inputs.enable-bundle-size-check
        working-directory: ${{ inputs.working-directory }}
        env:
          MAX_SIZE_KB: ${{ inputs.max-bundle-size-kb }}
        run: |
          FAILED=0

          for dir in src/*/; do
            if [[ -f "${dir}dist/index.js" ]]; then
              SIZE=$(stat -c%s "${dir}dist/index.js" 2>/dev/null || stat -f%z "${dir}dist/index.js")
              SIZE_KB=$((SIZE / 1024))
              WORKER=$(basename "$dir")

              if [[ $SIZE_KB -gt $MAX_SIZE_KB ]]; then
                echo "::error::${WORKER}: ${SIZE_KB}KB exceeds ${MAX_SIZE_KB}KB limit"
                FAILED=1
              else
                echo "✓ ${WORKER}: ${SIZE_KB}KB"
              fi
            fi
          done

          if [[ $FAILED -eq 1 ]]; then
            exit 1
          fi

  # One job, not a three-leg matrix. Each leg gated every step on its own
  # `matrix.scanner` value, so the legs shared no work — they shared a job body
  # and paid three runner starts for it, and billing rounds every start up to a
  # full minute. The scanners now run as sequential steps.
  #
  # `fail-fast: false` is preserved by `continue-on-error` on each scanner plus
  # the enforce step at the end: one failing scanner no longer hides the others,
  # and the job still goes red. Same pattern as security-secrets.yml.
  security-scan:
    name: Security
    runs-on: ${{ inputs.runner }}
    # Job-level grant: SARIF upload (enable-sarif-upload) needs
    # security-events: write on push events.
    permissions:
      actions: read
      contents: read
      security-events: write
    needs: [quality-and-test]
    if: >-
      inputs.primary && inputs.enable-security-scans
      && (needs.quality-and-test.result == 'success'
          || needs.quality-and-test.result == 'skipped')
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Audit-only setup. In the matrix these carried
      # `if: matrix.scanner == 'dependency-audit'`, so the Trivy legs never ran
      # them; folded into one job they run first, and a hard failure here would
      # skip the Trivy scans entirely. `continue-on-error` keeps that coverage
      # independent — the enforce step still turns a failure red.
      - name: Get cache directory
        id: cache-dir
        continue-on-error: true
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
              ;;
            yarn)
              echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
              ;;
            npm)
              echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
              ;;
            bun)
              echo "dir=$HOME/.bun/install/cache" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Cache dependencies
        id: audit-cache
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          key: ${{ runner.os }}-${{ inputs.package-manager }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock', '**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.package-manager }}-

      - name: Install dependencies for audit
        id: audit-install
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            yarn)
              yarn install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
            bun)
              bun install --frozen-lockfile
              ;;
          esac

      - name: Run dependency audit
        id: dependency-audit
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: |
          echo "Running dependency audit..."
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm audit --audit-level="$AUDIT_LEVEL" || echo "::warning::Vulnerabilities found"
              ;;
            yarn)
              yarn audit --level "$AUDIT_LEVEL" || echo "::warning::Vulnerabilities found"
              ;;
            npm)
              npm audit --audit-level="$AUDIT_LEVEL" || echo "::warning::Vulnerabilities found"
              ;;
            bun)
              bun audit --audit-level="$AUDIT_LEVEL" || echo "::warning::Vulnerabilities found"
              ;;
            *)
              # Reporting success for a scan that never ran is worse than
              # failing: the caller reads green and ships.
              echo "::error::unsupported package-manager for the dependency audit: $PACKAGE_MANAGER"
              exit 1
              ;;
          esac

      - name: Run Trivy Filesystem Scanner
        id: trivy-fs
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: ${{ inputs.working-directory }}
          scanners: 'vuln,secret,misconfig'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Run Trivy Dependency Scanner
        id: trivy-deps
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: ${{ inputs.working-directory }}
          scanners: 'vuln'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload SARIF file
        if: inputs.enable-sarif-upload && steps.trivy-fs.outcome == 'success'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
        continue-on-error: true

      # `continue-on-error` above keeps one failing scanner from hiding the
      # others, which also means the job would end green on its own — this step
      # turns any recorded failure back into a red job. It is what the matrix's
      # `fail-fast: false` used to give for free.
      - name: Enforce security scan results
        if: always()
        env:
          CACHE_DIR_RESULT: ${{ steps.cache-dir.outcome || 'skipped' }}
          AUDIT_INSTALL_RESULT: ${{ steps.audit-install.outcome || 'skipped' }}
          DEPENDENCY_AUDIT_RESULT: ${{ steps.dependency-audit.outcome || 'skipped' }}
          TRIVY_FS_RESULT: ${{ steps.trivy-fs.outcome || 'skipped' }}
          TRIVY_DEPS_RESULT: ${{ steps.trivy-deps.outcome || 'skipped' }}
        run: |
          set -euo pipefail
          FAILED=0
          RAN=0
          for pair in \
            "Get cache directory:${CACHE_DIR_RESULT}" \
            "Install dependencies for audit:${AUDIT_INSTALL_RESULT}" \
            "Dependency audit:${DEPENDENCY_AUDIT_RESULT}" \
            "Trivy filesystem scan:${TRIVY_FS_RESULT}" \
            "Trivy dependency scan:${TRIVY_DEPS_RESULT}"; do
            name="${pair%:*}"
            result="${pair##*:}"
            if [ "$result" = "failure" ]; then
              echo "::error::${name} failed"
              FAILED=$((FAILED + 1))
            elif [ "$result" = "success" ]; then
              RAN=$((RAN + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "${FAILED} security scan(s) failed"
            exit 1
          fi

          # Every outcome reads `skipped` when an earlier hard failure aborted
          # the job, so a bare success line here would assert a result nothing
          # produced.
          if [ "$RAN" -eq 0 ]; then
            echo "::warning::no security scan ran"
            exit 0
          fi

          echo "${RAN} security scan(s) passed"

  dependency-review:
    name: Review Dependencies
    runs-on: ${{ inputs.runner }}
    if: inputs.primary && inputs.enable-dependency-review && github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-2-Clause-Views, BSD-3-Clause, ISC, MIT, 0BSD, LGPL-2.1+, MPL-2.0, BlueOak-1.0.0, CC-BY-4.0, CC0-1.0, OFL-1.1, LicenseRef-scancode-google-patent-license-golang, BSD-3-Clause AND LicenseRef-scancode-google-patent-license-golang, BSD-2-Clause AND BSD-2-Clause-Views
          allow-dependencies-licenses: ${{ inputs.allowed-dependency-licenses }}

  summary:
    name: Create Summary
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    needs: [quality-and-test, security-scan, dependency-review]
    if: always() && !cancelled()
    steps:
      - name: Generate Summary
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          QUALITY_RESULT: ${{ needs.quality-and-test.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          COVERAGE: ${{ needs.quality-and-test.outputs.coverage }}
        # Every value arrives via `env:` and both heredoc delimiters are quoted,
        # so nothing in the template bodies is expanded by the shell. The
        # dynamic lines are emitted with `printf` between the heredocs.
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          {
            cat << 'EOF'
          # CI — JavaScript/TypeScript

          EOF
            printf '**Timestamp:** %s\n**Repository:** %s @ %s\n\n' \
              "$TIMESTAMP" "$REPOSITORY" "$REF_NAME"
            cat << 'EOF'
          | Job | Status |
          | --- | --- |
          EOF
            printf '| Quality & Tests | %s |\n' "$QUALITY_RESULT"
            printf '| Security Scan | %s |\n' "$SECURITY_RESULT"
            printf '| Dependency Review | %s |\n\n' "$DEPENDENCY_RESULT"
            printf '**Coverage:** %s\n' "$COVERAGE"
            printf '**Package Manager:** %s\n' "$PACKAGE_MANAGER"
            printf '**Working Directory:** %s\n' "$WORKING_DIRECTORY"
          } >> "$GITHUB_STEP_SUMMARY"

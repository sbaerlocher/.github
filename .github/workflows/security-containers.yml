---
name: Security - Containers

on:
  workflow_call:
    inputs:
      image-ref:
        type: string
        required: true
        description: 'Container image reference to scan (e.g., ghcr.io/user/repo:tag)'
      enable-trivy-scan:
        type: boolean
        default: true
        description: 'Enable Trivy vulnerability scanning'
      enable-grype-scan:
        type: boolean
        default: false
        description: 'Enable Grype vulnerability scanning (alternative)'
      enable-sarif-upload:
        type: boolean
        default: false
        description: 'Upload SARIF to GitHub Security tab (requires public repo)'
      severity-level:
        type: string
        default: 'HIGH,CRITICAL'
        description: 'Severity levels to report (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)'
      scan-timeout:
        type: number
        default: 15
        description: 'Scan timeout in minutes'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  contents: read
  security-events: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  trivy-image:
    name: Scan with Trivy
    if: inputs.enable-trivy-scan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.scan-timeout }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image-ref }}
          format: 'table'
          severity: ${{ inputs.severity-level }}
          exit-code: '0'

      - name: Run Trivy SARIF scan
        if: inputs.enable-sarif-upload
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image-ref }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: ${{ inputs.severity-level }}

      - name: Upload Trivy SARIF
        if: inputs.enable-sarif-upload
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          sarif_file: 'trivy-image.sarif'
          category: 'trivy-image'
        continue-on-error: true

      - name: Run Trivy JSON scan
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image-ref }}
          format: 'json'
          output: 'trivy-image.json'
          severity: ${{ inputs.severity-level }}
        continue-on-error: true

      - name: Upload Trivy Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-results
          path: trivy-image.json
          retention-days: 30
          if-no-files-found: ignore

  grype-image:
    name: Scan with Grype
    if: inputs.enable-grype-scan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.scan-timeout }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: grype
        with:
          image: ${{ inputs.image-ref }}
          fail-build: false
          severity-cutoff: medium

      - name: Upload Grype Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-image-results
          path: ${{ steps.grype.outputs.sarif }}
          retention-days: 30
          if-no-files-found: ignore

  image-analysis:
    name: Analyze Images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Analyze image layers
        run: |
          echo "Analyzing image: ${{ inputs.image-ref }}"

          # Pull image (if accessible)
          if docker pull "${{ inputs.image-ref }}" 2>/dev/null; then
            echo "✓ Image pulled successfully"

            # Show image size
            SIZE=$(docker image inspect "${{ inputs.image-ref }}" --format='{{.Size}}' | numfmt --to=iec-i --suffix=B)
            echo "Image size: $SIZE"

            # Show layer count
            LAYERS=$(docker image inspect "${{ inputs.image-ref }}" --format='{{len .RootFS.Layers}}')
            echo "Layer count: $LAYERS"

            # Show base image (if detectable)
            BASE=$(docker image inspect "${{ inputs.image-ref }}" --format='{{index .Config.Labels "org.opencontainers.image.base.name"}}' 2>/dev/null || echo "Unknown")
            echo "Base image: $BASE"
          else
            echo "::warning::Unable to pull image for analysis"
          fi

  security-report:
    name: Create Report
    runs-on: ubuntu-latest
    needs: [trivy-image, grype-image, image-analysis]
    if: always() && !cancelled()
    steps:
      - name: Generate Security Report
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # Security — Container Image

          **Timestamp:** $TIMESTAMP
          **Image:** \`${{ inputs.image-ref }}\`
          **Repository:** ${{ github.repository }} @ ${{ github.ref_name }}

          | Scanner | Status |
          | --- | --- |
          | Trivy | ${{ needs.trivy-image.result }} |
          | Grype | ${{ needs.grype-image.result }} |
          | Image Analysis | ${{ needs.image-analysis.result }} |
          EOF

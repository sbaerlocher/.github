---
name: Security - Containers

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: 'ubuntu-latest'
        description: >-
          Single runner label for all jobs in this workflow (e.g.
          `ubuntu-latest`, `self-hosted`). Runner groups and multi-label
          selectors are not supported.
      image-ref:
        type: string
        required: true
        description: 'Container image reference to scan (e.g., ghcr.io/user/repo:tag)'
      enable-trivy-scan:
        type: boolean
        default: true
        description: 'Enable Trivy vulnerability scanning'
      enable-grype-scan:
        type: boolean
        default: false
        description: 'Enable Grype vulnerability scanning (alternative)'
      enable-sarif-upload:
        type: boolean
        default: false
        description: 'Upload SARIF to GitHub Security tab (requires public repo)'
      severity-level:
        type: string
        default: 'HIGH,CRITICAL'
        description: 'Severity levels to report (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)'
      fail-on-findings:
        type: boolean
        required: false
        default: false
        description: 'Fail workflow on security findings'
      scan-timeout:
        type: number
        default: 15
        description: 'Scan timeout in minutes'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  contents: read
  security-events: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  # trivy + grype + image-analysis + report shared the same permissions and
  # differed only by enable-* guards, so they merge into one sequential-step
  # job (one runner). Each scanner is a step behind its original `if:`; the
  # report is the final always()-step reading step outcomes.
  container-scan:
    name: Scan Container Image
    runs-on: ${{ inputs.runner }}
    # Upper bound for the merged trivy + grype + analysis steps. Fixed rather
    # than derived from scan-timeout: GitHub-expression arithmetic isn't
    # portable across linters, and a timeout is only a ceiling. 40 covers
    # 2×15 scans + analysis; bump if a caller raises scan-timeout past ~15.
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --- Trivy ---
      - name: Run Trivy vulnerability scanner
        id: trivy-image
        if: inputs.enable-trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image-ref }}
          format: 'table'
          severity: ${{ inputs.severity-level }}
          # Coupled to the input, matching security-config.yml. The alternative
          # — parsing trivy-image.json in the enforce step — needs jq, a schema
          # assumption and a "file missing" branch that is itself indistinguish-
          # able from "the scanner never ran". Letting the scanner decide keeps
          # one source of truth for what counts as a finding at this severity.
          exit-code: ${{ inputs.fail-on-findings && '1' || '0' }}

      - name: Run Trivy SARIF scan
        id: trivy-sarif
        if: inputs.enable-trivy-scan && inputs.enable-sarif-upload
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image-ref }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: ${{ inputs.severity-level }}

      - name: Upload Trivy SARIF
        id: trivy-sarif-upload
        if: inputs.enable-trivy-scan && inputs.enable-sarif-upload
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: 'trivy-image.sarif'
          category: 'trivy-image'
        continue-on-error: true

      - name: Run Trivy JSON scan
        id: trivy-json
        if: always() && inputs.enable-trivy-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image-ref }}
          format: 'json'
          output: 'trivy-image.json'
          severity: ${{ inputs.severity-level }}
        continue-on-error: true

      - name: Upload Trivy Results
        if: always() && inputs.enable-trivy-scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-results
          path: trivy-image.json
          retention-days: 30
          if-no-files-found: ignore

      # --- Grype ---
      - name: Run Grype vulnerability scanner
        id: grype-image
        if: inputs.enable-grype-scan
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ inputs.image-ref }}
          # Same reasoning as trivy's exit-code above: the scanner is the one
          # thing that knows whether a finding sits at/above the cutoff.
          fail-build: ${{ inputs.fail-on-findings }}
          severity-cutoff: medium

      - name: Upload Grype Results
        if: always() && inputs.enable-grype-scan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-image-results
          path: ${{ steps.grype-image.outputs.sarif }}
          retention-days: 30
          if-no-files-found: ignore

      # --- Image analysis (always runs, like the old unconditional job) ---
      - name: Analyze image layers
        id: image-analysis
        continue-on-error: true
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          echo "Analyzing image: $IMAGE_REF"

          # Pull image (if accessible)
          if docker pull "$IMAGE_REF" 2>/dev/null; then
            echo "✓ Image pulled successfully"

            # Show image size
            SIZE=$(docker image inspect "$IMAGE_REF" --format='{{.Size}}' | numfmt --to=iec-i --suffix=B)
            echo "Image size: $SIZE"

            # Show layer count
            LAYERS=$(docker image inspect "$IMAGE_REF" --format='{{len .RootFS.Layers}}')
            echo "Layer count: $LAYERS"

            # Show base image (if detectable)
            BASE=$(docker image inspect "$IMAGE_REF" --format='{{index .Config.Labels "org.opencontainers.image.base.name"}}' 2>/dev/null || echo "Unknown")
            echo "Base image: $BASE"
          else
            echo "::warning::Unable to pull image for analysis"
          fi

      # Report folded from the old security-report job.
      - name: Generate Security Report
        if: always()
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          TRIVY_OUTCOME: ${{ steps.trivy-image.outcome }}
          GRYPE_OUTCOME: ${{ steps.grype-image.outcome }}
          ANALYSIS_OUTCOME: ${{ steps.image-analysis.outcome }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          # Values arrive via env: and are substituted by printf, not by the
          # shell parsing the body — a value containing $(...) is written
          # literally instead of being executed by the runner. The backticks in
          # the format strings are literal Markdown, hence single quotes.
          {
            printf '# Security — Container Image\n\n'
            printf '**Timestamp:** %s\n' "$TIMESTAMP"
            # shellcheck disable=SC2016  # backticks are literal Markdown here
            printf '**Image:** `%s`\n' "$IMAGE_REF"
            printf '**Repository:** %s @ %s\n\n' "$REPOSITORY" "$REF_NAME"
            printf '| Scanner | Status |\n| --- | --- |\n'
            printf '| Trivy | %s |\n' "$TRIVY_OUTCOME"
            printf '| Grype | %s |\n' "$GRYPE_OUTCOME"
            printf '| Image Analysis | %s |\n' "$ANALYSIS_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error on the six steps above only lets the later sequential
      # steps run; it must not swallow the result. Without this step the job is
      # green whatever happens — a scanner that could not download its DB, an
      # unresolvable image-ref and a CRITICAL CVE all end the same way.
      #
      # Two failure classes, deliberately collapsed onto one rule:
      #
      #   Execution errors (DB download, rate limit, unresolvable image-ref)
      #   always fail. A scanner that could not run is not a passed scan, so
      #   this half ignores fail-on-findings.
      #
      #   Findings only fail when fail-on-findings is true. They are routed
      #   through the scanners themselves — trivy's `exit-code` and grype's
      #   `fail-build` are keyed off the input — rather than re-derived here by
      #   parsing trivy-image.json. That keeps one definition of "a finding at
      #   this severity" instead of a second, drifting one in bash, and needs
      #   neither jq nor a missing-file branch. The cost is that both classes
      #   arrive as the same `outcome: failure`; that is acceptable because the
      #   two only coincide when fail-on-findings is true, where both have to
      #   fail anyway. With fail-on-findings false the scanners exit 0 on
      #   findings, so any failure reaching here is an execution error by
      #   construction.
      #
      # `Upload Trivy Results` / `Upload Grype Results` are deliberately absent:
      # they are best-effort reporting, and a failed artifact upload should not
      # fail a run whose scans all passed — the same carve-out the artifact
      # upload in ci-terraform.yml argues. Neither sets continue-on-error, so a
      # regression there is still visible as a red step.
      - name: Enforce container scan results
        if: always()
        env:
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
          TRIVY_OUTCOME: ${{ steps.trivy-image.outcome }}
          TRIVY_SARIF_OUTCOME: ${{ steps.trivy-sarif.outcome }}
          TRIVY_SARIF_UPLOAD_OUTCOME: ${{ steps.trivy-sarif-upload.outcome }}
          TRIVY_JSON_OUTCOME: ${{ steps.trivy-json.outcome }}
          GRYPE_OUTCOME: ${{ steps.grype-image.outcome }}
          ANALYSIS_OUTCOME: ${{ steps.image-analysis.outcome }}
        run: |
          set -euo pipefail
          fail=0

          # A step that never ran reports `skipped`, which is not a failure —
          # only `failure` is. Each label names what a red entry means, so the
          # log says why the job is red without opening the step above.
          check() {
            if [ "$2" = "failure" ]; then
              echo "::error::$1"
              fail=1
            fi
          }

          if [ "$FAIL_ON_FINDINGS" = "true" ]; then
            check "Trivy image scan failed, or found vulnerabilities at/above the severity threshold" "$TRIVY_OUTCOME"
            check "Grype image scan failed, or found vulnerabilities at/above the severity cutoff" "$GRYPE_OUTCOME"
          else
            check "Trivy image scan could not run (findings are not gated: fail-on-findings is false)" "$TRIVY_OUTCOME"
            check "Grype image scan could not run (findings are not gated: fail-on-findings is false)" "$GRYPE_OUTCOME"
          fi

          # These four never gate on findings in either mode — they produce
          # SARIF/JSON output and image metadata, so a failure is always an
          # execution error and fails regardless of fail-on-findings.
          check "Trivy SARIF scan could not run" "$TRIVY_SARIF_OUTCOME"
          check "Trivy SARIF upload to the Security tab failed" "$TRIVY_SARIF_UPLOAD_OUTCOME"
          check "Trivy JSON scan could not run" "$TRIVY_JSON_OUTCOME"
          check "Image layer analysis could not run" "$ANALYSIS_OUTCOME"

          exit "$fail"

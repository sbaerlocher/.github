name: Pull Request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
  security-events: write
  actions: read

jobs:
  # Runs the same `just` recipes contributors run locally (CONTRIBUTING.md),
  # so there is one lint definition rather than a CI copy that drifts from it.
  #
  # ubuntu-latest ships jq, shellcheck and Docker, but not yamllint or just —
  # both are installed below. With shellcheck present, `just actionlint` takes
  # its local-binary path only when actionlint is too; it is not, so the recipe
  # falls through to the rhysd/actionlint container, which bundles both. Either
  # way the embedded shell checks run rather than being silently skipped.
  #
  # Node is pinned rather than taken from the image default because `just lint`
  # now runs `fmt-check`, which fetches prettier via `npx`. The image's Node
  # major changes without notice; the formatting gate should not.
  local-checks:
    name: Local Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job: unlike merge.yml, nothing here pushes or tags.
          persist-credentials: false

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install yamllint
        run: pip install yamllint

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Run lint
        run: just lint

      - name: Run tests
        run: just test

  claude-review:
    name: Claude Code Review
    uses: ./.github/workflows/ai-claude-review.yml
    secrets: inherit

  code-scan:
    name: Code Scanning
    uses: ./.github/workflows/security-code.yml
    with:
      languages: '["actions"]'
    secrets: inherit

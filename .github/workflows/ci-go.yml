---
name: Continuous Integration - Go

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: 'ubuntu-latest'
        description: >-
          Single runner label for all jobs in this workflow (e.g.
          `ubuntu-latest`, `self-hosted`). Runner groups and multi-label
          selectors are not supported.
      go-version:
        type: string
        required: false
        default: '1.25'
        description: 'Go version to use'
      enable-integration-tests:
        type: boolean
        required: false
        default: false
        description: 'Run integration tests if tests/integration exists'
      enable-codecov:
        type: boolean
        required: false
        default: false
        description: 'Upload coverage to Codecov'
      enable-codeql:
        type: boolean
        required: false
        default: true
        description: 'Run CodeQL analysis'
      enable-dependency-review:
        type: boolean
        required: false
        default: true
        description: 'Run dependency review on PRs'
      enable-security-scans:
        type: boolean
        required: false
        default: true
        description: 'Run security scans (gosec, govulncheck, trivy)'
      enable-sarif-upload:
        type: boolean
        required: false
        default: false
        description: 'Upload SARIF results to GitHub Security tab (requires public repo)'
      binary-path:
        type: string
        required: false
        default: './cmd'
        description: 'Path to main binary entrypoint (e.g. ./cmd/app)'
      enable-postgres:
        type: boolean
        required: false
        default: false
        description: 'Enable PostgreSQL service for tests'
      postgres-db:
        type: string
        required: false
        default: 'test_db'
        description: 'PostgreSQL database name'
      postgres-user:
        type: string
        required: false
        default: 'test_user'
        description: 'PostgreSQL user'
      postgres-password:
        type: string
        required: false
        default: 'test_password'
        description: 'PostgreSQL password'
      test-env-vars:
        type: string
        required: false
        default: ''
        description: 'Additional environment variables for tests (JSON format)'
      artifact-name-prefix:
        type: string
        required: false
        default: ''
        description: 'Prefix for artifact names to avoid conflicts'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).
    outputs:
      coverage:
        description: 'Test coverage percentage'
        value: ${{ jobs.test-and-lint.outputs.coverage }}
      version:
        description: 'Version extracted from git ref or sha'
        value: ${{ jobs.setup.outputs.version }}
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  setup:
    name: Setup
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-run-tests: ${{ steps.should-run.outputs.tests }}
      should-run-security: ${{ steps.should-run.outputs.security }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine what should run
        id: should-run
        run: |
          echo "tests=true" >> "$GITHUB_OUTPUT"
          echo "security=true" >> "$GITHUB_OUTPUT"

      - name: Get version
        id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$REF" =~ ^refs/tags/v.* ]]; then
            VERSION="$REF_NAME"
          else
            VERSION="$SHA"
            VERSION="${VERSION:0:8}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

  test-and-lint:
    name: Test & Lint
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    needs: setup
    if: needs.setup.outputs.should-run-tests == 'true'
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}

    # `services:` takes no `if:`, so the service is gated on its image: an
    # empty `image:` makes the runner skip the container, which is the
    # documented way to declare a conditional service. Gating `ports:` instead
    # does not work — an empty entry becomes a bare `-p` on the `docker create`
    # line and fails the job — and leaving the mapping unconditional while the
    # container runs would expose a Postgres seeded from the `postgres-*`
    # defaults on localhost:5432 for every Go CI run in the org, including
    # callers that never asked for one.
    #
    # Renovate's built-in github-actions manager does read service images, but
    # skips any value containing `$` ("contains-variable"), so the marker below
    # hands this one to the custom manager in the root `renovate.json`, which
    # captures tag and digest and keeps the pin updated. That manager's
    # `pinDigests` rule is scoped by `matchFileNames` to this file — a
    # `renovate-expression` marker in another workflow needs that file added
    # there, or its digest silently never gets pinned.
    services:
      postgres:
        # renovate-expression: datasource=docker depName=postgres versioning=docker
        image: ${{ inputs.enable-postgres && 'postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2' || '' }}
        env:
          POSTGRES_DB: ${{ inputs.postgres-db }}
          POSTGRES_USER: ${{ inputs.postgres-user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "::error::The following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          # renovate: datasource=github-releases depName=dominikh/go-tools
          version: '2026.2.1'
          install-go: false

      - name: Set test environment variables
        env:
          ENABLE_POSTGRES: ${{ inputs.enable-postgres }}
          POSTGRES_USER: ${{ inputs.postgres-user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
          POSTGRES_DB: ${{ inputs.postgres-db }}
          TEST_ENV_VARS: ${{ inputs.test-env-vars }}
        run: |
          set -euo pipefail
          if [ "$ENABLE_POSTGRES" = "true" ]; then
            # $GITHUB_ENV is line-based: a line break inside a value would inject
            # additional environment entries for every following step. CR is
            # rejected alongside LF — the runner reads the file on the .NET side,
            # whose line readers treat a lone CR as a terminator too, and a stray
            # CR corrupts DATABASE_URL either way.
            for value in "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB"; do
              if [ "$value" != "${value//[$'\n\r']/}" ]; then
                echo "Error: multi-line postgres-user, postgres-password or postgres-db values are not supported" >&2
                exit 1
              fi
            done
            printf 'DATABASE_URL=postgres://%s:%s@localhost:5432/%s?sslmode=disable\n' \
              "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB" >> "$GITHUB_ENV"
          fi

          if [ -n "${TEST_ENV_VARS:-}" ]; then
            # $GITHUB_ENV is line-based: a line break inside a key or value would
            # inject additional environment entries for every following step. The
            # runner splits on LF and CRLF only, so `\n` covers both terminators;
            # `\r` is rejected as defence in depth, so the guard does not depend on
            # that parsing detail staying as it is.
            if ! printf '%s' "$TEST_ENV_VARS" \
              | jq -e 'to_entries | any(.[]; (.key, (.value | tostring)) | test("[\n\r]")) | not' >/dev/null; then
              printf 'Error: test-env-vars keys or values must not contain a CR or LF byte\n' >&2
              exit 1
            fi
            printf '%s' "$TEST_ENV_VARS" \
              | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
          fi

      - name: Run tests with coverage
        env:
          GO_ENV: test
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run integration tests
        if: inputs.enable-integration-tests && hashFiles('tests/integration/**') != ''
        run: |
          go test -v -tags=integration -timeout=10m ./tests/integration/...

      - name: Generate coverage report
        id: coverage
        run: |
          go tool cover -html=coverage.out -o coverage.html
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "Test coverage: $COVERAGE"

      - name: Upload coverage to Codecov
        if: inputs.enable-codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name-prefix }}coverage-report
          path: coverage.html
          retention-days: 30

      - name: Build and test binary
        if: inputs.binary-path != ''
        env:
          BINARY_PATH: ${{ inputs.binary-path }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          mkdir -p bin
          BINARY_NAME=$(basename "$BINARY_PATH")
          go build -ldflags="-s -w -X main.version=$VERSION" -o "bin/${BINARY_NAME}" "$BINARY_PATH"

          if [ ! -f "bin/${BINARY_NAME}" ]; then
            echo "::error::Binary was not created"
            exit 1
          fi

          if [ ! -x "bin/${BINARY_NAME}" ]; then
            echo "::error::Binary is not executable"
            exit 1
          fi

          echo "Testing --version flag..."
          if ! "./bin/${BINARY_NAME}" --version; then
            echo "::warning::Binary --version command failed (not critical)"
          fi

          echo "Testing --help flag..."
          if ! "./bin/${BINARY_NAME}" --help; then
            echo "::warning::Binary --help command failed (not critical)"
          fi

          echo "Binary tests passed successfully"

  security-scan:
    name: Scan Security (${{ matrix.scanner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    # Job-level grant: SARIF upload (enable-sarif-upload) needs
    # security-events: write on push events.
    permissions:
      actions: read
      contents: read
      security-events: write
    needs: [setup, test-and-lint]
    if: >-
      always() &&
      inputs.enable-security-scans &&
      needs.setup.outputs.should-run-security == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    strategy:
      matrix:
        scanner: [gosec, govulncheck, trivy-fs]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.scanner == 'gosec' || matrix.scanner == 'govulncheck'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true
          cache: true

      - name: Run gosec Security Scanner
        if: matrix.scanner == 'gosec'
        env:
          # renovate: datasource=github-releases depName=securego/gosec
          GOSEC_VERSION: 'v2.29.0'
        run: |
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          gosec -no-fail -fmt sarif -out gosec.sarif ./...

      - name: Run govulncheck
        if: matrix.scanner == 'govulncheck'
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: 'v1.7.0'
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          # govulncheck exits 3 on findings; under the runner's `bash -eo pipefail`
          # the pipe would abort before we summarise, so disable -e for the run.
          set +e
          govulncheck -json ./... | tee govulncheck.json
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            # A tool failure produces no findings to summarise, so say why the
            # leg is red here — this exit is above the summary block below, and
            # `tee` only captured stdout, leaving the diagnosis in the log alone.
            echo "::error::govulncheck failed (exit $rc)"
            printf '### govulncheck\n\ngovulncheck itself failed (exit %s); see the job log.\n' \
              "$rc" >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          # Gate only on call-reachable findings. A finding whose top trace frame
          # carries a `function` is reachable in source mode; import-only /
          # module-level findings (a module pulled in transitively but never
          # called, e.g. deprecated packages with no fixed version) are reported
          # as notices, not failures.
          reachable=$(jq -rc 'select(.finding.trace[0].function != null) | .finding.osv' govulncheck.json | sort -u)
          all_osv=$(jq -rc '.finding.osv // empty' govulncheck.json | sort -u)
          imported=$(comm -23 <(printf '%s\n' "$all_osv") <(printf '%s\n' "$reachable") | sed '/^$/d')
          if [ -n "$imported" ]; then
            echo "::notice::Non-reachable (import-only) findings, not gating:"
            echo "$imported"
          fi
          # Mirror the findings into the job summary. The log is the only place
          # they appeared until now, and it is gone once retention expires or
          # unreadable without job-log access - which is exactly when a failed
          # gate needs diagnosing. The raw govulncheck.json is uploaded as an
          # artifact by the following step.
          {
            echo "### govulncheck"
            echo
            if [ -n "$reachable" ]; then
              echo "**Reachable (gating):**"
              echo
              printf '%s\n' "$reachable" | sed 's/^/- /'
              echo
            else
              echo "No reachable vulnerabilities."
              echo
            fi
            if [ -n "$imported" ]; then
              echo "**Import-only (not gating):**"
              echo
              printf '%s\n' "$imported" | sed 's/^/- /'
              echo
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$reachable" ]; then
            echo "::warning::Reachable vulnerabilities detected by govulncheck"
            echo "$reachable"
            exit 1
          fi
          echo "::notice::No reachable vulnerabilities found by govulncheck"

      - name: Upload govulncheck report
        if: always() && matrix.scanner == 'govulncheck'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name-prefix }}govulncheck-report
          path: govulncheck.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Run Trivy filesystem scanner
        if: matrix.scanner == 'trivy-fs'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload SARIF file
        if: inputs.enable-sarif-upload && (matrix.scanner == 'gosec' || matrix.scanner == 'trivy-fs')
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ matrix.scanner }}.sarif
          category: ${{ matrix.scanner }}
        continue-on-error: true

  codeql-analysis:
    name: Analyze Code
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    # Job-level grant: the workflow-level default is contents: read, but
    # uploading CodeQL results needs security-events: write on push events
    # (public-repo pull_request uploads succeed with a read token).
    permissions:
      actions: read
      contents: read
      security-events: write
    needs: [setup, test-and-lint]
    if: >-
      always() &&
      inputs.enable-codeql &&
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')

    env:
      # Let Go fetch the toolchain pinned in go.mod instead of failing when the
      # Go on PATH is older (GOTOOLCHAIN defaults to local). Applies to the
      # extractor, autobuild and analyze steps alike.
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Must run before codeql-action/init: the Go extractor is configured at
      # init time and otherwise picks up the Go bundled with the CodeQL
      # release, which can be older than the version go.mod requires.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:go'

  dependency-review:
    name: Dependency Review
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    if: inputs.enable-dependency-review && github.event_name == 'pull_request' && github.event.repository.visibility == 'public'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, 0BSD, MPL-2.0, CC-BY-4.0, CC0-1.0, OFL-1.1, LicenseRef-scancode-google-patent-license-golang, BSD-3-Clause AND LicenseRef-scancode-google-patent-license-golang

---
name: Continuous Integration - Go

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        required: false
        default: '1.25'
        description: 'Go version to use'
      enable-integration-tests:
        type: boolean
        required: false
        default: false
        description: 'Run integration tests if tests/integration exists'
      enable-codecov:
        type: boolean
        required: false
        default: false
        description: 'Upload coverage to Codecov'
      enable-codeql:
        type: boolean
        required: false
        default: true
        description: 'Run CodeQL analysis'
      enable-dependency-review:
        type: boolean
        required: false
        default: true
        description: 'Run dependency review on PRs'
      enable-security-scans:
        type: boolean
        required: false
        default: true
        description: 'Run security scans (gosec, govulncheck, trivy)'
      enable-sarif-upload:
        type: boolean
        required: false
        default: false
        description: 'Upload SARIF results to GitHub Security tab (requires public repo)'
      binary-path:
        type: string
        required: false
        default: './cmd'
        description: 'Path to main binary entrypoint (e.g. ./cmd/app)'
      pre-build-commands:
        type: string
        required: false
        default: ''
        description: 'Commands to run before build (e.g. code generation)'
      enable-postgres:
        type: boolean
        required: false
        default: false
        description: 'Enable PostgreSQL service for tests'
      postgres-db:
        type: string
        required: false
        default: 'test_db'
        description: 'PostgreSQL database name'
      postgres-user:
        type: string
        required: false
        default: 'test_user'
        description: 'PostgreSQL user'
      postgres-password:
        type: string
        required: false
        default: 'test_password'
        description: 'PostgreSQL password'
      test-env-vars:
        type: string
        required: false
        default: ''
        description: 'Additional environment variables for tests (JSON format)'
      artifact-name-prefix:
        type: string
        required: false
        default: ''
        description: 'Prefix for artifact names to avoid conflicts'
    outputs:
      coverage:
        description: 'Test coverage percentage'
        value: ${{ jobs.test-and-lint.outputs.coverage || jobs.test-and-lint-postgres.outputs.coverage }}
      version:
        description: 'Version extracted from git ref or sha'
        value: ${{ jobs.setup.outputs.version }}
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-run-tests: ${{ steps.should-run.outputs.tests }}
      should-run-security: ${{ steps.should-run.outputs.security }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine what should run
        id: should-run
        run: |
          echo "tests=true" >> "$GITHUB_OUTPUT"
          echo "security=true" >> "$GITHUB_OUTPUT"

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v.* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.sha }}"
            VERSION="${VERSION:0:8}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.should-run-tests == 'true' && !inputs.enable-postgres
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run pre-build commands
        if: inputs.pre-build-commands != ''
        run: ${{ inputs.pre-build-commands }}

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "::error::The following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          # renovate: datasource=github-releases depName=dominikh/go-tools
          version: '2025.1.1'
          install-go: false

      - name: Set test environment variables
        if: inputs.test-env-vars != ''
        run: |
          echo '${{ inputs.test-env-vars }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - name: Run tests with coverage
        env:
          GO_ENV: test
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run integration tests
        if: inputs.enable-integration-tests && hashFiles('tests/integration/**') != ''
        run: |
          go test -v -tags=integration -timeout=10m ./tests/integration/...

      - name: Generate coverage report
        id: coverage
        run: |
          go tool cover -html=coverage.out -o coverage.html
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "Test coverage: $COVERAGE"

      - name: Upload coverage to Codecov
        if: inputs.enable-codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: ./coverage.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name-prefix }}coverage-report
          path: coverage.html
          retention-days: 30

      - name: Build and test binary
        if: inputs.binary-path != ''
        run: |
          mkdir -p bin
          BINARY_NAME=$(basename ${{ inputs.binary-path }})
          go build -ldflags="-s -w -X main.version=${{ needs.setup.outputs.version }}" -o bin/${BINARY_NAME} ${{ inputs.binary-path }}

          if [ ! -f bin/${BINARY_NAME} ]; then
            echo "::error::Binary was not created"
            exit 1
          fi

          if [ ! -x bin/${BINARY_NAME} ]; then
            echo "::error::Binary is not executable"
            exit 1
          fi

          echo "Testing --version flag..."
          if ! ./bin/${BINARY_NAME} --version; then
            echo "::warning::Binary --version command failed (not critical)"
          fi

          echo "Testing --help flag..."
          if ! ./bin/${BINARY_NAME} --help; then
            echo "::warning::Binary --help command failed (not critical)"
          fi

          echo "Binary tests passed successfully"

  test-and-lint-postgres:
    name: Test & Lint (PostgreSQL)
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.should-run-tests == 'true' && inputs.enable-postgres
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}

    services:
      postgres:
        image: postgres:18-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
        env:
          POSTGRES_DB: ${{ inputs.postgres-db }}
          POSTGRES_USER: ${{ inputs.postgres-user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres-password }}
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run pre-build commands
        if: inputs.pre-build-commands != ''
        run: ${{ inputs.pre-build-commands }}

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "::error::The following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          # renovate: datasource=github-releases depName=dominikh/go-tools
          version: '2025.1.1'
          install-go: false

      - name: Set test environment variables
        run: |
          echo "DATABASE_URL=postgres://${{ inputs.postgres-user }}:${{ inputs.postgres-password }}@localhost:5432/${{ inputs.postgres-db }}?sslmode=disable" >> $GITHUB_ENV

          if [[ -n "${{ inputs.test-env-vars }}" ]]; then
            echo '${{ inputs.test-env-vars }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV
          fi

      - name: Run tests with coverage
        env:
          GO_ENV: test
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run integration tests
        if: inputs.enable-integration-tests && hashFiles('tests/integration/**') != ''
        run: |
          go test -v -tags=integration -timeout=10m ./tests/integration/...

      - name: Generate coverage report
        id: coverage
        run: |
          go tool cover -html=coverage.out -o coverage.html
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "Test coverage: $COVERAGE"

      - name: Upload coverage to Codecov
        if: inputs.enable-codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: ./coverage.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name-prefix }}coverage-report
          path: coverage.html
          retention-days: 30

      - name: Build and test binary
        if: inputs.binary-path != ''
        run: |
          mkdir -p bin
          BINARY_NAME=$(basename ${{ inputs.binary-path }})
          go build -ldflags="-s -w -X main.version=${{ needs.setup.outputs.version }}" -o bin/${BINARY_NAME} ${{ inputs.binary-path }}

          if [ ! -f bin/${BINARY_NAME} ]; then
            echo "::error::Binary was not created"
            exit 1
          fi

          if [ ! -x bin/${BINARY_NAME} ]; then
            echo "::error::Binary is not executable"
            exit 1
          fi

          echo "Testing --version flag..."
          if ! ./bin/${BINARY_NAME} --version; then
            echo "::warning::Binary --version command failed (not critical)"
          fi

          echo "Testing --help flag..."
          if ! ./bin/${BINARY_NAME} --help; then
            echo "::warning::Binary --help command failed (not critical)"
          fi

          echo "Binary tests passed successfully"

  security-scan:
    name: Scan Security (${{ matrix.scanner }})
    runs-on: ubuntu-latest
    needs: [setup, test-and-lint, test-and-lint-postgres]
    if: >-
      always() &&
      inputs.enable-security-scans &&
      needs.setup.outputs.should-run-security == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    strategy:
      matrix:
        scanner: [gosec, govulncheck, trivy-fs]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        if: matrix.scanner == 'gosec' || matrix.scanner == 'govulncheck'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run gosec Security Scanner
        if: matrix.scanner == 'gosec'
        env:
          # renovate: datasource=github-releases depName=securego/gosec
          GOSEC_VERSION: 'v2.22.10'
        run: |
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          gosec -no-fail -fmt sarif -out gosec.sarif ./...

      - name: Run govulncheck
        if: matrix.scanner == 'govulncheck'
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: 'v1.1.4'
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck -json ./... | tee govulncheck.json
          # govulncheck always emits JSON (progress + findings); use exit code instead.
          if grep -q '"finding"' govulncheck.json; then
            echo "::warning::Vulnerabilities detected by govulncheck"
            jq -r '.finding // empty | .osv' govulncheck.json | sort -u | head -10
          else
            echo "::notice::No vulnerabilities found by govulncheck"
          fi

      - name: Run Trivy filesystem scanner
        if: matrix.scanner == 'trivy-fs'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload SARIF file
        if: inputs.enable-sarif-upload && (matrix.scanner == 'gosec' || matrix.scanner == 'trivy-fs')
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: ${{ matrix.scanner }}.sarif
          category: ${{ matrix.scanner }}
        continue-on-error: true

  codeql-analysis:
    name: Analyze Code
    runs-on: ubuntu-latest
    needs: [setup, test-and-lint, test-and-lint-postgres]
    if: >-
      always() &&
      inputs.enable-codeql &&
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          category: '/language:go'

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: inputs.enable-dependency-review && github.event_name == 'pull_request' && github.event.repository.visibility == 'public'

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, 0BSD, MPL-2.0, CC-BY-4.0, CC0-1.0, LicenseRef-scancode-google-patent-license-golang, BSD-3-Clause AND LicenseRef-scancode-google-patent-license-golang

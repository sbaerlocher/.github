---
name: Security - Secrets

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: 'ubuntu-latest'
        description: >-
          Single runner label for all jobs in this workflow (e.g.
          `ubuntu-latest`, `self-hosted`). Runner groups and multi-label
          selectors are not supported. Must be a Linux runner — the TruffleHog
          action shells out to `apt-get` and a Docker image.
      working-directory:
        type: string
        default: '.'
        description: 'Working directory for scans'
      enable-gitleaks:
        type: boolean
        default: true
        description: 'Enable Gitleaks secret scanning'
      enable-trufflehog:
        type: boolean
        default: true
        description: 'Enable TruffleHog git history scanning'
      enable-pattern-detection:
        type: boolean
        default: true
        description: |
          Enable the key-pattern checks: AWS access keys in
          `*.tf`/`*.yml`/`*.yaml`/`*.json` and private-key content in
          `*.pem`/`*.key`. Both fail the job on a hit. This is not a
          general-purpose secret scanner — gitleaks and TruffleHog cover that.
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  gitleaks:
    name: Scan with Gitleaks
    if: inputs.enable-gitleaks
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    # Scoped per-job (REVIEW.md least-privilege): only gitleaks needs the
    # pulls API. gitleaks-action enumerates PR commits via that API on
    # pull_request events; without pull-requests:read it fails with HTTP 403
    # "Resource not accessible by integration". Job-level permissions replace
    # the workflow-level block, so contents/actions are re-declared here.
    # Note: as a reusable, this is capped by the caller — a consumer whose
    # trigger workflow restricts permissions to contents/actions still 403s.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # trufflehog + pattern-detection + report merged into one sequential job:
  # all run with only contents:read, so no least-privilege loss. gitleaks
  # stays separate because it needs pull-requests:read (see above). Each scan
  # is a step guarded by its original enable-* input; report is the final
  # always()-step referencing step outcomes instead of needs.*.result.
  secret-scan:
    name: Scan Secrets
    runs-on: ${{ inputs.runner }}
    # needs gitleaks only so the report step can render its result; the scans
    # in this job do not depend on gitleaks output.
    needs: [gitleaks]
    if: always() && !cancelled()
    permissions:
      contents: read
      actions: read
    # Union of the merged jobs' timeouts (trufflehog 15 + pattern 10).
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog
        id: trufflehog
        if: inputs.enable-trufflehog
        continue-on-error: true
        uses: trufflesecurity/trufflehog@cc1fe982afc515d2991365ce8d4d0dd07170fcad # v3.97.2
        with:
          path: ${{ inputs.working-directory }}
          base: ${{ github.event.before || 'HEAD~1' }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: AWS Access Key Detection
        id: pattern-detection
        if: inputs.enable-pattern-detection
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Checking for AWS access key patterns..."
          if grep -r -E "AKIA[0-9A-Z]{16}" . \
            --include="*.tf" --include="*.yml" --include="*.yaml" --include="*.json"; then
            echo "::error::AWS access key pattern detected"
            exit 1
          fi
          echo "✓ No AWS access keys found"

      - name: Private Key Detection
        id: pattern-private-key
        if: inputs.enable-pattern-detection
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Checking for private key content..."
          if grep -r "BEGIN.*PRIVATE.*KEY" . \
            --include="*.pem" --include="*.key" --exclude-dir=".git"; then
            echo "::error::Private key content detected"
            exit 1
          fi
          echo "✓ No private keys found"

      # Report is the final step of secret-scan (folded from the old
      # security-report job). Gitleaks stays a separate job → needs.*.result;
      # trufflehog/pattern are steps → steps.*.outcome. The pattern cell is
      # failure if either key-pattern step failed, else skipped/success.
      - name: Generate Security Report
        if: always()
        env:
          PATTERN_OUTCOME: >-
            ${{
              (steps.pattern-detection.outcome == 'failure'
               || steps.pattern-private-key.outcome == 'failure') && 'failure'
              || steps.pattern-detection.outcome
            }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          TRUFFLEHOG_OUTCOME: ${{ steps.trufflehog.outcome }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          # Values arrive via env: and are substituted by printf, not by the
          # shell parsing the body — a value containing $(...) is written
          # literally instead of being executed by the runner.
          {
            printf '# Security — Secret Detection\n\n'
            printf '**Timestamp:** %s\n' "$TIMESTAMP"
            printf '**Repository:** %s @ %s\n\n' "$REPOSITORY" "$REF_NAME"
            printf '| Scanner | Status |\n| --- | --- |\n'
            printf '| Gitleaks | %s |\n' "$GITLEAKS_RESULT"
            printf '| TruffleHog | %s |\n' "$TRUFFLEHOG_OUTCOME"
            printf '| AWS & private key patterns | %s |\n' "$PATTERN_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error above only lets the later sequential steps run; it
      # must not swallow the gates. On origin/main trufflehog (verified hits)
      # and the AWS-key/private-key checks (exit 1) failed the workflow and
      # blocked merge. Re-raise that here so behaviour is unchanged.
      - name: Enforce secret-scan result
        if: always()
        env:
          ENABLE_TRUFFLEHOG: ${{ inputs.enable-trufflehog }}
          ENABLE_PATTERN_DETECTION: ${{ inputs.enable-pattern-detection }}
          TRUFFLEHOG_OUTCOME: ${{ steps.trufflehog.outcome }}
          PATTERN_DETECTION_OUTCOME: ${{ steps.pattern-detection.outcome }}
          PATTERN_PRIVATE_KEY_OUTCOME: ${{ steps.pattern-private-key.outcome }}
        run: |
          set -euo pipefail
          fail=0
          if [ "$ENABLE_TRUFFLEHOG" = "true" ] \
             && [ "$TRUFFLEHOG_OUTCOME" = "failure" ]; then
            echo "::error::TruffleHog found verified secrets"
            fail=1
          fi
          if [ "$ENABLE_PATTERN_DETECTION" = "true" ] && {
               [ "$PATTERN_DETECTION_OUTCOME" = "failure" ] \
               || [ "$PATTERN_PRIVATE_KEY_OUTCOME" = "failure" ]; }; then
            echo "::error::Secret pattern detected (AWS key or private key)"
            fail=1
          fi
          exit "$fail"

---
name: Security - Secrets

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: '.'
        description: 'Working directory for scans'
      enable-gitleaks:
        type: boolean
        default: true
        description: 'Enable Gitleaks secret scanning'
      enable-trufflehog:
        type: boolean
        default: true
        description: 'Enable TruffleHog git history scanning'
      enable-pattern-detection:
        type: boolean
        default: true
        description: 'Enable custom pattern detection'
      file-patterns:
        type: string
        default: '*.tf,*.yml,*.yaml,*.json,*.env.example'
        description: 'File patterns to scan (comma-separated)'

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  gitleaks:
    name: Scan with Gitleaks
    if: inputs.enable-gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog:
    name: Scan with TruffleHog
    if: inputs.enable-trufflehog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@041f07e9df901a1038a528e5525b0226d04dd5ea # v3.93.6
        with:
          path: ${{ inputs.working-directory }}
          base: ${{ github.event.before || 'HEAD~1' }}
          head: HEAD
          extra_args: --debug --only-verified

  pattern-detection:
    name: Detect Patterns
    if: inputs.enable-pattern-detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: AWS Access Key Detection
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Checking for AWS access key patterns..."
          if grep -r -E "AKIA[0-9A-Z]{16}" . \
            --include="*.tf" --include="*.yml" --include="*.yaml" --include="*.json"; then
            echo "::error::AWS access key pattern detected"
            exit 1
          fi
          echo "✓ No AWS access keys found"

      - name: Private Key Detection
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Checking for private key content..."
          if grep -r "BEGIN.*PRIVATE.*KEY" . \
            --include="*.pem" --include="*.key" --exclude-dir=".git"; then
            echo "::error::Private key content detected"
            exit 1
          fi
          echo "✓ No private keys found"

      - name: Generic Secret Patterns
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Checking for generic secret patterns..."
          FOUND_ISSUES=0

          # Check for hardcoded passwords (not in External Secrets)
          echo "→ Checking for hardcoded passwords..."
          if grep -r "password:" . \
            --include="*.yaml" --include="*.yml" \
            | grep -v "secretKeyRef\|valueFrom\|ExternalSecret\|# Example\|# Template"; then
            echo "::warning::Potential hardcoded passwords found"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          fi

          # Check for API keys
          echo "→ Checking for hardcoded API keys..."
          if grep -r "apiKey:\|api_key:" . \
            --include="*.yaml" --include="*.yml" \
            | grep -v "secretKeyRef\|valueFrom\|ExternalSecret\|# Example\|# Template"; then
            echo "::warning::Potential hardcoded API keys found"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          fi

          # Check for tokens
          echo "→ Checking for hardcoded tokens..."
          if grep -r "token:" . \
            --include="*.yaml" --include="*.yml" \
            | grep -v "secretKeyRef\|valueFrom\|ExternalSecret\|# Example\|# Template\|access_token\|description"; then
            echo "::warning::Potential hardcoded tokens found"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          fi

          if [ $FOUND_ISSUES -eq 0 ]; then
            echo "✓ No hardcoded secrets detected"
          else
            echo ""
            echo "ℹ️  Found $FOUND_ISSUES potential issues"
            echo "   Please verify these are using secure secret management"
          fi

  security-report:
    name: Create Report
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog, pattern-detection]
    if: always() && !cancelled()
    steps:
      - name: Generate Security Report
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # Secret Detection Report

          **Timestamp:** $TIMESTAMP

          ## Scan Results

          | Scanner | Status |
          |---------|--------|
          | Gitleaks | ${{ needs.gitleaks.result }} |
          | TruffleHog | ${{ needs.trufflehog.result }} |
          | Pattern Detection | ${{ needs.pattern-detection.result }} |

          ## Tools Used

          - **Gitleaks**: Fast secret detection in code
          - **TruffleHog**: Git history secret scanning (verified secrets only)
          - **Pattern Detection**: Custom regex patterns for secrets

          ## Security Best Practices

          - ✓ Use External Secrets Operator for Kubernetes
          - ✓ Use Bitwarden Secrets Manager for CI/CD
          - ✓ Never commit .env files or credentials
          - ✓ Use environment variables for sensitive data
          - ✓ Rotate secrets if accidentally committed

          ---
          *Secret detection completed - keep your secrets safe!*
          EOF

---
name: Security - Secrets

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: '.'
        description: 'Working directory for scans'
      enable-gitleaks:
        type: boolean
        default: true
        description: 'Enable Gitleaks secret scanning'
      enable-trufflehog:
        type: boolean
        default: true
        description: 'Enable TruffleHog git history scanning'
      enable-pattern-detection:
        type: boolean
        default: true
        description: 'Enable custom pattern detection'
      file-patterns:
        type: string
        default: '*.tf,*.yml,*.yaml,*.json,*.env.example'
        description: 'File patterns to scan (comma-separated)'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  gitleaks:
    name: Scan with Gitleaks
    if: inputs.enable-gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped per-job (REVIEW.md least-privilege): only gitleaks needs the
    # pulls API. gitleaks-action enumerates PR commits via that API on
    # pull_request events; without pull-requests:read it fails with HTTP 403
    # "Resource not accessible by integration". Job-level permissions replace
    # the workflow-level block, so contents/actions are re-declared here.
    # Note: as a reusable, this is capped by the caller — a consumer whose
    # trigger workflow restricts permissions to contents/actions still 403s.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog:
    name: Scan with TruffleHog
    if: inputs.enable-trufflehog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          path: ${{ inputs.working-directory }}
          base: ${{ github.event.before || 'HEAD~1' }}
          head: HEAD
          extra_args: --debug --only-verified

  pattern-detection:
    name: Detect Patterns
    if: inputs.enable-pattern-detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: AWS Access Key Detection
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Checking for AWS access key patterns..."
          if grep -r -E "AKIA[0-9A-Z]{16}" . \
            --include="*.tf" --include="*.yml" --include="*.yaml" --include="*.json"; then
            echo "::error::AWS access key pattern detected"
            exit 1
          fi
          echo "✓ No AWS access keys found"

      - name: Private Key Detection
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Checking for private key content..."
          if grep -r "BEGIN.*PRIVATE.*KEY" . \
            --include="*.pem" --include="*.key" --exclude-dir=".git"; then
            echo "::error::Private key content detected"
            exit 1
          fi
          echo "✓ No private keys found"

      - name: Generic Secret Patterns
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Checking for generic secret patterns..."
          FOUND_ISSUES=0

          # Check for hardcoded passwords (not in External Secrets)
          echo "→ Checking for hardcoded passwords..."
          if grep -r "password:" . \
            --include="*.yaml" --include="*.yml" \
            | grep -v "secretKeyRef\|valueFrom\|ExternalSecret\|# Example\|# Template"; then
            echo "::warning::Potential hardcoded passwords found"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          fi

          # Check for API keys
          echo "→ Checking for hardcoded API keys..."
          if grep -r "apiKey:\|api_key:" . \
            --include="*.yaml" --include="*.yml" \
            | grep -v "secretKeyRef\|valueFrom\|ExternalSecret\|# Example\|# Template"; then
            echo "::warning::Potential hardcoded API keys found"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          fi

          # Check for tokens
          echo "→ Checking for hardcoded tokens..."
          if grep -r "token:" . \
            --include="*.yaml" --include="*.yml" \
            | grep -v "secretKeyRef\|valueFrom\|ExternalSecret\|# Example\|# Template\|access_token\|description"; then
            echo "::warning::Potential hardcoded tokens found"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          fi

          if [ $FOUND_ISSUES -eq 0 ]; then
            echo "✓ No hardcoded secrets detected"
          else
            echo ""
            echo "ℹ️  Found $FOUND_ISSUES potential issues"
            echo "   Please verify these are using secure secret management"
          fi

  security-report:
    name: Create Report
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog, pattern-detection]
    if: always() && !cancelled()
    steps:
      - name: Generate Security Report
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # Security — Secret Detection

          **Timestamp:** $TIMESTAMP
          **Repository:** ${{ github.repository }} @ ${{ github.ref_name }}

          | Scanner | Status |
          | --- | --- |
          | Gitleaks | ${{ needs.gitleaks.result }} |
          | TruffleHog | ${{ needs.trufflehog.result }} |
          | Pattern Detection | ${{ needs.pattern-detection.result }} |
          EOF

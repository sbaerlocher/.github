---
name: Release - Docker

on:
  workflow_call:
    inputs:
      registry:
        type: string
        required: false
        default: 'ghcr.io'
        description: 'Container registry (e.g. ghcr.io, docker.io)'
      image-name:
        type: string
        required: true
        description: 'Image name (usually github.repository)'
      platforms:
        type: string
        required: false
        default: 'linux/amd64'
        description: 'Target platforms (comma-separated, e.g. linux/amd64,linux/arm64)'
      push:
        type: boolean
        required: false
        default: false
        description: 'Push image to registry'
      enable-trivy-scan:
        type: boolean
        required: false
        default: true
        description: 'Run Trivy security scan'
      enable-sarif-upload:
        type: boolean
        required: false
        default: false
        description: 'Upload SARIF to GitHub Security (requires public repo)'
      enable-container-tests:
        type: boolean
        required: false
        default: false
        description: 'Run container structure tests'
      context:
        type: string
        required: false
        default: '.'
        description: 'Build context directory'
      dockerfile:
        type: string
        required: false
        default: 'Dockerfile'
        description: 'Path to Dockerfile'
      build-args:
        type: string
        required: false
        default: ''
        description: 'Build arguments (one per line)'
      version:
        type: string
        required: false
        default: ''
        description: 'Version tag for the image'
      docker-metadata-tags:
        type: string
        required: false
        default: ''
        description: 'Custom tags for docker/metadata-action (one per line)'
      docker-metadata-labels:
        type: string
        required: false
        default: ''
        description: 'Custom labels for docker/metadata-action (one per line)'
      container-test-config:
        type: string
        required: false
        default: ''
        description: 'Path to container structure test config'
      cancel-in-progress:
        type: boolean
        required: false
        default: false
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).
    outputs:
      image-digest:
        description: 'Image digest'
        value: ${{ jobs.docker-build.outputs.image-digest }}
      image-tags:
        description: 'Generated image tags'
        value: ${{ jobs.docker-build.outputs.image-tags }}
    secrets:
      registry-username:
        required: false
      registry-password:
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  docker-build:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Container Registry
        if: inputs.push
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username || github.actor }}
          password: ${{ secrets.registry-password || secrets.GITHUB_TOKEN }}

      - name: Generate build metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.registry }}/${{ inputs.image-name }}
          tags: |
            ${{ inputs.docker-metadata-tags || 'type=sha,prefix=sha-,suffix=-{{date ''YYYYMMDD-HHmmss''}}' }}
          labels: ${{ inputs.docker-metadata-labels }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          load: ${{ !inputs.push && !contains(inputs.platforms, ',') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image functionality
        if: ${{ !inputs.push }}
        run: |
          TEST_IMAGE="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          echo "Testing image: $TEST_IMAGE"

          # Test help flag (non-critical)
          if docker run --rm "$TEST_IMAGE" --help 2>/dev/null; then
            echo "✅ --help flag works"
          else
            echo "⚠️  --help flag not supported or failed (non-critical)"
          fi

          # Test version flag (non-critical)
          if docker run --rm "$TEST_IMAGE" --version 2>/dev/null; then
            echo "✅ --version flag works"
          else
            echo "⚠️  --version flag not supported or failed (non-critical)"
          fi

      - name: Run container structure tests
        if: inputs.enable-container-tests && inputs.container-test-config != '' && hashFiles(inputs.container-test-config) != ''
        run: |
          TEST_IMAGE="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          CONFIG_PATH="${{ inputs.container-test-config }}"
          echo "Running structure tests on: $TEST_IMAGE"
          echo "Using config: $CONFIG_PATH"
          docker run --rm \
            -v "$PWD/$CONFIG_PATH:/test-config.yaml:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            gcr.io/gcp-runtimes/container-structure-test:latest \
            test --image="$TEST_IMAGE" --config=/test-config.yaml

      - name: Scan image for vulnerabilities
        if: inputs.enable-trivy-scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'HIGH,CRITICAL'
        continue-on-error: true

      - name: Upload Trivy SARIF
        if: inputs.enable-trivy-scan && inputs.enable-sarif-upload
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: 'trivy-image.sarif'
          category: 'trivy-image'
        continue-on-error: true

      - name: Image build summary
        if: always()
        run: |
          {
            echo "## Docker Build — ${{ inputs.registry }}/${{ inputs.image-name }}"
            echo ""
            echo "**Platforms:** ${{ inputs.platforms }}"
            echo "**Push:** ${{ inputs.push }}"
            echo "**Status:** ${{ steps.build.outcome }}"
            echo ""
            if [[ "${{ steps.build.outcome }}" == "success" ]]; then
              echo "**Tags:**"
              echo '```'
              echo "${{ steps.meta.outputs.tags }}"
              echo '```'
              if [[ "${{ inputs.push }}" == "true" ]]; then
                echo ""
                echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
              else
                echo ""
                echo "> Image built locally — not pushed to registry."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

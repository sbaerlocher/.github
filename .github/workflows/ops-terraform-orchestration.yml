---
name: Ops - Terraform Orchestration

on:
  workflow_call:
    inputs:
      project-name:
        type: string
        required: true
        description: 'Project identifier for deployment ID prefix'
      default-environment:
        type: string
        required: false
        default: 'nuvulus'
        description: 'Default environment for production deployments'
      terraform-patterns:
        type: string
        required: false
        default: '\.(tf|tfvars|hcl)$'
        description: 'Regex pattern for Terraform file detection'
      config-patterns:
        type: string
        required: false
        default: '^configs/.*\.(alloy|json|yml|yaml)$'
        description: 'Regex pattern for configuration file detection'
      cancel-in-progress:
        type: boolean
        required: false
        default: false
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).
    outputs:
      environment:
        description: 'Target deployment environment'
        value: ${{ jobs.orchestration.outputs.environment }}
      deployment_mode:
        description: 'Deployment mode (production/manual/validation)'
        value: ${{ jobs.orchestration.outputs.deployment_mode }}
      deployment_id:
        description: 'Unique deployment identifier'
        value: ${{ jobs.orchestration.outputs.deployment_id }}
      terraform_changed:
        description: 'Whether Terraform files changed'
        value: ${{ jobs.orchestration.outputs.terraform_changed }}
      configuration_changed:
        description: 'Whether configuration files changed'
        value: ${{ jobs.orchestration.outputs.configuration_changed }}
      should_deploy:
        description: 'Whether deployment should proceed'
        value: ${{ jobs.orchestration.outputs.should_deploy }}
      workspace:
        description: 'Terraform workspace name'
        value: ${{ jobs.orchestration.outputs.workspace }}

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  orchestration:
    name: Orchestrate Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.config.outputs.environment }}
      deployment_mode: ${{ steps.config.outputs.deployment_mode }}
      deployment_id: ${{ steps.config.outputs.deployment_id }}
      terraform_changed: ${{ steps.enhanced_changes.outputs.terraform }}
      configuration_changed: ${{ steps.enhanced_changes.outputs.configuration }}
      should_deploy: ${{ steps.config.outputs.should_deploy }}
      workspace: ${{ steps.config.outputs.workspace }}

    steps:
      - name: 'Repository Checkout'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Detect Infrastructure Changes'
        id: enhanced_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_DEPLOY: ${{ github.event.inputs.force_deploy }}
          FORCED_PUSH: ${{ github.event.forced }}
          TF_PATTERN: ${{ inputs.terraform-patterns }}
          CFG_PATTERN: ${{ inputs.config-patterns }}
        run: |
          set -euo pipefail

          terraform_changed="false"
          configuration_changed="false"

          diff_changed() {
            local pattern="$1"
            git diff --name-only HEAD~1 HEAD | grep -E -- "$pattern" >/dev/null
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              if [ "$FORCE_DEPLOY" = "true" ]; then
                terraform_changed="true"
                configuration_changed="true"
              else
                if diff_changed "$TF_PATTERN"; then terraform_changed="true"; fi
                if diff_changed "$CFG_PATTERN"; then configuration_changed="true"; fi
              fi
              ;;
            push)
              if [ "$FORCED_PUSH" = "true" ] || ! git rev-parse HEAD~1 >/dev/null 2>&1; then
                echo "Force push or no previous commit — assuming all changes"
                terraform_changed="true"
                configuration_changed="true"
              else
                if diff_changed "$TF_PATTERN"; then terraform_changed="true"; fi
                if diff_changed "$CFG_PATTERN"; then configuration_changed="true"; fi
              fi
              ;;
          esac

          echo "terraform=$terraform_changed" >> "$GITHUB_OUTPUT"
          echo "configuration=$configuration_changed" >> "$GITHUB_OUTPUT"
          echo "Detection: terraform=$terraform_changed configuration=$configuration_changed"

      - name: 'Pipeline Configuration'
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PROJECT_NAME: ${{ inputs.project-name }}
          DEFAULT_ENV: ${{ inputs.default-environment }}
          DISPATCH_ENV: ${{ github.event.inputs.environment }}
          TERRAFORM_CHANGED: ${{ steps.enhanced_changes.outputs.terraform }}
          CONFIGURATION_CHANGED: ${{ steps.enhanced_changes.outputs.configuration }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              if [ "$REF" = "refs/heads/main" ]; then
                ENVIRONMENT="$DEFAULT_ENV"
                DEPLOYMENT_MODE="production"
              else
                echo "::error::push event on non-main ref ($REF) is not deployable"
                exit 1
              fi
              ;;
            workflow_dispatch)
              ENVIRONMENT="${DISPATCH_ENV:-$DEFAULT_ENV}"
              DEPLOYMENT_MODE="manual"
              ;;
            *)
              echo "::error::unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

          WORKSPACE="$ENVIRONMENT"
          SHOULD_DEPLOY="false"

          if [ "$DEPLOYMENT_MODE" = "validation" ]; then
            SHOULD_DEPLOY="false"
          elif [ "$TERRAFORM_CHANGED" = "true" ] \
            || [ "$CONFIGURATION_CHANGED" = "true" ] \
            || [ "$DEPLOYMENT_MODE" = "production" ] \
            || [ "$DEPLOYMENT_MODE" = "manual" ]; then
            SHOULD_DEPLOY="true"
          fi

          DEPLOYMENT_ID="${PROJECT_NAME}-deploy-$(date +%Y%m%d-%H%M%S)-${SHA:0:8}"

          {
            echo "environment=$ENVIRONMENT"
            echo "deployment_mode=$DEPLOYMENT_MODE"
            echo "deployment_id=$DEPLOYMENT_ID"
            echo "should_deploy=$SHOULD_DEPLOY"
            echo "workspace=$WORKSPACE"
          } >> "$GITHUB_OUTPUT"

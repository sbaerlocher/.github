---
name: End-to-End - Docker Compose

on:
  workflow_call:
    inputs:
      # Docker Compose Configuration
      compose-file:
        type: string
        required: false
        default: 'docker-compose.yml'
        description: 'Docker Compose file path'
      compose-profile:
        type: string
        required: false
        default: 'e2e'
        description: 'Docker Compose profile for E2E tests'

      # Playwright Configuration
      node-version:
        type: string
        required: false
        default: '20'
        description: 'Node.js version for Playwright'
      package-manager:
        type: string
        required: false
        default: 'npm'
        description: 'Package manager (npm, pnpm, yarn, bun)'
      playwright-directory:
        type: string
        required: false
        default: './client'
        description: 'Directory containing Playwright tests'
      test-command:
        type: string
        required: false
        default: 'test:e2e'
        description: 'Playwright test command'
      playwright-browsers:
        type: string
        required: false
        default: 'chromium'
        description: 'Playwright browsers (chromium, firefox, webkit, all)'

      # Artifact Configuration
      upload-artifacts:
        type: boolean
        required: false
        default: true
        description: 'Upload test artifacts and logs'
      artifact-retention-days:
        type: number
        required: false
        default: 30
        description: 'Artifact retention days'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  e2e-docker:
    name: E2E (Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Docker Compose Setup
      - name: Start E2E stack
        run: |
          docker compose -f ${{ inputs.compose-file }} --profile ${{ inputs.compose-profile }} up -d --wait
          echo "✅ E2E stack started successfully"

      - name: Show running containers
        run: docker compose -f ${{ inputs.compose-file }} ps

      # Setup Node.js for Playwright
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.playwright-directory }}/package-lock.json

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Install Playwright dependencies
      - name: Install dependencies
        working-directory: ${{ inputs.playwright-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
          esac

      - name: Install Playwright browsers
        working-directory: ${{ inputs.playwright-directory }}
        run: |
          case "${{ inputs.playwright-browsers }}" in
            all) npx playwright install --with-deps ;;
            *) npx playwright install --with-deps ${{ inputs.playwright-browsers }} ;;
          esac

      # Run E2E Tests
      - name: Run Playwright tests
        working-directory: ${{ inputs.playwright-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm) pnpm ${{ inputs.test-command }} ;;
            bun) bun run ${{ inputs.test-command }} ;;
            yarn) yarn ${{ inputs.test-command }} ;;
            npm) npm run ${{ inputs.test-command }} ;;
          esac

      # Save container logs on failure
      - name: Save container logs
        if: failure() && inputs.upload-artifacts
        run: |
          docker compose -f ${{ inputs.compose-file }} logs > container-logs.txt
          echo "📋 Container logs saved"

      # Upload Artifacts
      - name: Upload Playwright report
        if: inputs.upload-artifacts && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: ${{ inputs.playwright-directory }}/playwright-report/
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore

      - name: Upload test results
        if: inputs.upload-artifacts && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: ${{ inputs.playwright-directory }}/test-results/
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore

      - name: Upload container logs
        if: failure() && inputs.upload-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-logs
          path: container-logs.txt
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore

      # Stop Docker Compose
      - name: Stop E2E stack
        if: always()
        run: |
          docker compose -f ${{ inputs.compose-file }} --profile ${{ inputs.compose-profile }} down
          echo "🛑 E2E stack stopped"

      # PR Comment
      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let comment = '## 🎭 E2E Test Results (Docker Compose)\n\n';
            comment += `**Profile**: \`${{ inputs.compose-profile }}\`\n\n`;

            // Use job status instead of counting files
            const jobStatus = '${{ job.status }}';

            if (jobStatus === 'success') {
              comment += '✅ All tests passed!\n';
            } else if (jobStatus === 'failure') {
              comment += '❌ Tests failed!\n\n';
              comment += `View the [Playwright report](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.\n`;
            } else {
              comment += `⚠️ Tests completed with status: ${jobStatus}\n\n`;
              comment += `View the [test results](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.\n`;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

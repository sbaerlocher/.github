---
name: Release - NPM

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: 'ubuntu-latest'
        description: >-
          Single runner label for all jobs in this workflow (e.g.
          `ubuntu-latest`, `self-hosted`). Runner groups and multi-label
          selectors are not supported.
      package-manager:
        type: string
        default: 'pnpm'
        description: 'Package manager to use (npm, pnpm, yarn, bun)'
      node-version-file:
        type: string
        default: '.nvmrc'
        description: 'Node version file path'
      working-directory:
        type: string
        default: '.'
        description: 'Working directory (for monorepos)'
      registry-url:
        type: string
        default: 'https://registry.npmjs.org'
        description: 'NPM registry URL'
      publish-command:
        type: string
        default: ''
        description: 'Custom publish command (optional, uses default if empty)'
      run-build:
        type: boolean
        default: true
        description: 'Run build before publishing'
      run-tests:
        type: boolean
        default: true
        description: 'Run tests before publishing'
      create-github-release:
        type: boolean
        default: true
        description: 'Create GitHub release'
      generate-changelog:
        type: boolean
        default: true
        description: 'Generate changelog from commits'
      enable-provenance:
        type: boolean
        default: true
        description: 'Enable NPM provenance (requires npm 9.5.0+)'
      enable-sbom:
        type: boolean
        default: false
        description: 'Generate and attach SBOM to release'
      dry-run:
        type: boolean
        default: false
        description: 'Perform dry-run (no actual publish)'
      cancel-in-progress:
        type: boolean
        required: false
        default: false
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).
    outputs:
      published-version:
        description: 'Published package version'
        value: ${{ jobs.publish.outputs.version }}
      release-url:
        description: 'GitHub release URL'
        value: ${{ jobs.github-release.outputs.release-url }}
    secrets:
      NPM_TOKEN:
        required: true
        description: 'NPM authentication token'

permissions:
  contents: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  pre-release-checks:
    name: Validate Package
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-publish: ${{ steps.check.outputs.should-publish }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: ${{ inputs.registry-url }}

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Get package version
        id: version
        working-directory: ${{ inputs.working-directory }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Check if version already published
        id: check
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION="${{ steps.version.outputs.version }}"

          echo "Checking if $PACKAGE_NAME@$VERSION is already published..."

          if npm view "$PACKAGE_NAME@$VERSION" version 2>/dev/null; then
            echo "::warning::Version $VERSION is already published to NPM"
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "✓ Version $VERSION not yet published"
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate package.json
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Validating package.json..."

          # Check required fields
          REQUIRED_FIELDS="name version"
          for field in $REQUIRED_FIELDS; do
            if ! node -p "require('./package.json').$field" 2>/dev/null; then
              echo "::error::Missing required field: $field"
              exit 1
            fi
          done

          # Check for publishConfig
          if node -p "require('./package.json').private" | grep -q "true"; then
            echo "::error::Package is marked as private in package.json"
            exit 1
          fi

          echo "✓ package.json validation passed"

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            bun)
              bun install --frozen-lockfile
              ;;
            yarn)
              yarn install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
          esac

      - name: Run tests
        if: inputs.run-tests
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm test
              ;;
            bun)
              bun test
              ;;
            yarn)
              yarn test
              ;;
            npm)
              npm test
              ;;
          esac

      - name: Run build
        if: inputs.run-build
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm build
              ;;
            bun)
              bun run build
              ;;
            yarn)
              yarn build
              ;;
            npm)
              npm run build
              ;;
          esac

  publish:
    name: Publish Package
    needs: [pre-release-checks]
    if: needs.pre-release-checks.outputs.should-publish == 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      id-token: write # Required for NPM provenance
      contents: read
    outputs:
      version: ${{ needs.pre-release-checks.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: ${{ inputs.registry-url }}

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            bun)
              bun install --frozen-lockfile
              ;;
            yarn)
              yarn install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
          esac

      - name: Build package
        if: inputs.run-build
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm build
              ;;
            bun)
              bun run build
              ;;
            yarn)
              yarn build
              ;;
            npm)
              npm run build
              ;;
          esac

      - name: Publish to NPM (Dry Run)
        if: inputs.dry-run
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CUSTOM_PUBLISH_CMD: ${{ inputs.publish-command }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          echo "🧪 Dry-run mode - not actually publishing"

          if [ -z "$CUSTOM_PUBLISH_CMD" ]; then
            # Use default publish command based on package manager
            case "$PACKAGE_MANAGER" in
              pnpm)
                pnpm publish --dry-run --no-git-checks
                ;;
              bun)
                bun publish --dry-run
                ;;
              yarn)
                yarn publish --dry-run
                ;;
              npm)
                npm publish --dry-run
                ;;
            esac
          else
            # Use custom publish command
            echo "Would run: $CUSTOM_PUBLISH_CMD --dry-run"
            $CUSTOM_PUBLISH_CMD --dry-run
          fi

      - name: Publish to NPM
        if: ${{ !inputs.dry-run }}
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CUSTOM_PUBLISH_CMD: ${{ inputs.publish-command }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          ENABLE_PROVENANCE: ${{ inputs.enable-provenance }}
        run: |
          echo "Publishing to NPM registry: $REGISTRY_URL"

          PUBLISH_ARGS=""
          if [ "$ENABLE_PROVENANCE" == "true" ]; then
            PUBLISH_ARGS="--provenance"
          fi

          if [ -z "$CUSTOM_PUBLISH_CMD" ]; then
            # Use default publish command based on package manager
            case "$PACKAGE_MANAGER" in
              pnpm)
                pnpm publish --no-git-checks --access public $PUBLISH_ARGS
                ;;
              bun)
                bun publish --access public
                ;;
              yarn)
                yarn publish --access public
                ;;
              npm)
                npm publish --access public $PUBLISH_ARGS
                ;;
            esac
          else
            # Use custom publish command
            $CUSTOM_PUBLISH_CMD
          fi

          echo "✓ Package published successfully"

      - name: Verify publication
        if: ${{ !inputs.dry-run }}
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION="${{ needs.pre-release-checks.outputs.version }}"

          echo "Verifying publication of $PACKAGE_NAME@$VERSION..."

          # Retry verification with exponential backoff
          MAX_ATTEMPTS=6
          ATTEMPT=1
          WAIT_TIME=5

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Verification attempt $ATTEMPT/$MAX_ATTEMPTS (waiting ${WAIT_TIME}s)..."
            sleep $WAIT_TIME

            if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
              echo "✓ Package verified on NPM registry"
              npm view "$PACKAGE_NAME@$VERSION" version
              exit 0
            fi

            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Package not yet available, retrying..."
              WAIT_TIME=$((WAIT_TIME * 2))  # Exponential backoff
              ATTEMPT=$((ATTEMPT + 1))
            else
              echo "::error::Package verification failed after $MAX_ATTEMPTS attempts"
              echo "::error::Package $PACKAGE_NAME@$VERSION not found on NPM registry"
              echo "::notice::The package may have been published but NPM registry is slow to update"
              exit 1
            fi
          done

  generate-sbom:
    name: Generate SBOM
    needs: [pre-release-checks, publish]
    if: inputs.enable-sbom && needs.pre-release-checks.outputs.should-publish == 'true' && !inputs.dry-run
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The composite action lives in this repo, but `uses: ./` in a reusable
      # workflow resolves against the caller's checkout — not against this
      # workflow's source repo. So we reference it absolutely and pin it to
      # the same rolling date-tag model used by consumers.
      - name: Generate npm SBOM
        id: sbom
        uses: sbaerlocher/.github/.github/actions/sbom-npm@2026-08-05
        with:
          package-manager: ${{ inputs.package-manager }}
          working-directory: ${{ inputs.working-directory }}
          node-version-file: ${{ inputs.node-version-file }}
          output-file: sbom-npm-package.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-npm-package
          path: ${{ steps.sbom.outputs.sbom-path }}
          retention-days: 90
          if-no-files-found: error

  github-release:
    name: Create Release
    needs: [pre-release-checks, publish]
    if: inputs.create-github-release && needs.pre-release-checks.outputs.should-publish == 'true' && !inputs.dry-run
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      release-url: ${{ steps.create-release.outputs.html_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Generate changelog
        if: inputs.generate-changelog
        id: changelog
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          RELEASE_VERSION: ${{ needs.pre-release-checks.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="v$RELEASE_VERSION"

          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Generating changelog from $PREVIOUS_TAG to $VERSION"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG..HEAD")
          else
            echo "No previous tag found, using all commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          fi

          # Resolved before the heredoc: the quoted delimiter below switches off
          # expansion inside the body, so a command substitution there would be
          # emitted literally rather than evaluated. path.resolve() keeps a
          # relative working-directory like `packages/foo` a path — bare
          # require() would treat it as a node_modules specifier.
          PACKAGE_NAME=$(node -p \
            "require(require('path').resolve(process.argv[1], 'package.json')).name" \
            "$WORKING_DIRECTORY")

          # Delimiters below are quoted ('EOF'), so the shell expands nothing in
          # the bodies — the static Markdown stays literal and the two dynamic
          # lines are emitted by printf instead.
          {
            cat << 'EOF'
          ## What's Changed

          EOF
            printf '%s\n' "$CHANGELOG"
            cat << 'EOF'

          ## Installation

          ```bash
          EOF
            printf 'npm install %s@%s\n' "$PACKAGE_NAME" "$RELEASE_VERSION"
            cat << 'EOF'
          ```

          EOF
            printf '**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$REPOSITORY" "$PREVIOUS_TAG" "$VERSION"
          } > /tmp/changelog.md

          echo "changelog_file=/tmp/changelog.md" >> "$GITHUB_OUTPUT"

      - name: Download SBOM artifact
        if: inputs.enable-sbom
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-npm-package
          path: ./sbom
        continue-on-error: true

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.pre-release-checks.outputs.version }}
          name: Release v${{ needs.pre-release-checks.outputs.version }}
          body_path: ${{ inputs.generate-changelog && steps.changelog.outputs.changelog_file || '' }}
          draft: false
          prerelease: false
          files: |
            sbom/*.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-summary:
    name: Create Summary
    runs-on: ${{ inputs.runner }}
    needs: [pre-release-checks, publish, github-release]
    if: always() && !cancelled()
    steps:
      - name: Generate Release Summary
        env:
          VERSION: ${{ needs.pre-release-checks.outputs.version }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          PROVENANCE: ${{ inputs.enable-provenance && 'Enabled' || 'Disabled' }}
          DRY_RUN: ${{ inputs.dry-run }}
          CHECKS_RESULT: ${{ needs.pre-release-checks.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RELEASE_RESULT: ${{ needs.github-release.result }}
          SKIPPED_NOTE: ${{ needs.pre-release-checks.outputs.should-publish == 'false' && '> Version already published — publish step skipped.' || '' }}
          DRY_RUN_NOTE: ${{ inputs.dry-run && '> Dry-run mode — package was NOT published.' || '' }}
        # Every value arrives via `env:` and both heredoc delimiters are quoted,
        # so nothing in the template bodies is expanded by the shell. The
        # dynamic lines are emitted with `printf` between the heredocs.
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          {
            cat << 'EOF'
          # Release — NPM Package

          EOF
            printf '**Timestamp:** %s\n' "$TIMESTAMP"
            # shellcheck disable=SC2016  # backticks are literal Markdown here
            printf '**Version:** `v%s`\n' "$VERSION"
            printf '**Registry:** %s\n' "$REGISTRY_URL"
            printf '**Provenance:** %s\n' "$PROVENANCE"
            printf '**Dry Run:** %s\n\n' "$DRY_RUN"
            cat << 'EOF'
          | Component | Status |
          | --- | --- |
          EOF
            printf '| Pre-Release Checks | %s |\n' "$CHECKS_RESULT"
            printf '| NPM Publish | %s |\n' "$PUBLISH_RESULT"
            printf '| GitHub Release | %s |\n\n' "$RELEASE_RESULT"
            printf '%s\n' "$SKIPPED_NOTE"
            printf '%s\n' "$DRY_RUN_NOTE"
          } >> "$GITHUB_STEP_SUMMARY"

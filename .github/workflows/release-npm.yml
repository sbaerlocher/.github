---
name: Release - NPM

on:
  workflow_call:
    inputs:
      package-manager:
        type: string
        default: 'pnpm'
        description: 'Package manager to use (npm, pnpm, yarn, bun)'
      node-version-file:
        type: string
        default: '.nvmrc'
        description: 'Node version file path'
      working-directory:
        type: string
        default: '.'
        description: 'Working directory (for monorepos)'
      registry-url:
        type: string
        default: 'https://registry.npmjs.org'
        description: 'NPM registry URL'
      publish-command:
        type: string
        default: ''
        description: 'Custom publish command (optional, uses default if empty)'
      run-build:
        type: boolean
        default: true
        description: 'Run build before publishing'
      run-tests:
        type: boolean
        default: true
        description: 'Run tests before publishing'
      create-github-release:
        type: boolean
        default: true
        description: 'Create GitHub release'
      generate-changelog:
        type: boolean
        default: true
        description: 'Generate changelog from commits'
      enable-provenance:
        type: boolean
        default: true
        description: 'Enable NPM provenance (requires npm 9.5.0+)'
      enable-sbom:
        type: boolean
        default: false
        description: 'Generate and attach SBOM to release'
      dry-run:
        type: boolean
        default: false
        description: 'Perform dry-run (no actual publish)'
    outputs:
      published-version:
        description: 'Published package version'
        value: ${{ jobs.publish.outputs.version }}
      release-url:
        description: 'GitHub release URL'
        value: ${{ jobs.github-release.outputs.release-url }}
    secrets:
      NPM_TOKEN:
        required: true
        description: 'NPM authentication token'

permissions:
  contents: write

jobs:
  pre-release-checks:
    name: Validate Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-publish: ${{ steps.check.outputs.should-publish }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: ${{ inputs.registry-url }}

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Get package version
        id: version
        working-directory: ${{ inputs.working-directory }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Check if version already published
        id: check
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION="${{ steps.version.outputs.version }}"

          echo "Checking if $PACKAGE_NAME@$VERSION is already published..."

          if npm view "$PACKAGE_NAME@$VERSION" version 2>/dev/null; then
            echo "::warning::Version $VERSION is already published to NPM"
            echo "should-publish=false" >> $GITHUB_OUTPUT
          else
            echo "✓ Version $VERSION not yet published"
            echo "should-publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate package.json
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "Validating package.json..."

          # Check required fields
          REQUIRED_FIELDS="name version"
          for field in $REQUIRED_FIELDS; do
            if ! node -p "require('./package.json').$field" 2>/dev/null; then
              echo "::error::Missing required field: $field"
              exit 1
            fi
          done

          # Check for publishConfig
          if node -p "require('./package.json').private" | grep -q "true"; then
            echo "::error::Package is marked as private in package.json"
            exit 1
          fi

          echo "✓ package.json validation passed"

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            bun)
              bun install --frozen-lockfile
              ;;
            yarn)
              yarn install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
          esac

      - name: Run tests
        if: inputs.run-tests
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm)
              pnpm test
              ;;
            bun)
              bun test
              ;;
            yarn)
              yarn test
              ;;
            npm)
              npm test
              ;;
          esac

      - name: Run build
        if: inputs.run-build
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm)
              pnpm build
              ;;
            bun)
              bun run build
              ;;
            yarn)
              yarn build
              ;;
            npm)
              npm run build
              ;;
          esac

  publish:
    name: Publish Package
    needs: [pre-release-checks]
    if: needs.pre-release-checks.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # Required for NPM provenance
      contents: read
    outputs:
      version: ${{ needs.pre-release-checks.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          registry-url: ${{ inputs.registry-url }}

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            bun)
              bun install --frozen-lockfile
              ;;
            yarn)
              yarn install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
          esac

      - name: Build package
        if: inputs.run-build
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm)
              pnpm build
              ;;
            bun)
              bun run build
              ;;
            yarn)
              yarn build
              ;;
            npm)
              npm run build
              ;;
          esac

      - name: Publish to NPM (Dry Run)
        if: inputs.dry-run
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CUSTOM_PUBLISH_CMD: ${{ inputs.publish-command }}
        run: |
          echo "🧪 Dry-run mode - not actually publishing"

          if [ -z "$CUSTOM_PUBLISH_CMD" ]; then
            # Use default publish command based on package manager
            case "${{ inputs.package-manager }}" in
              pnpm)
                pnpm publish --dry-run --no-git-checks
                ;;
              bun)
                bun publish --dry-run
                ;;
              yarn)
                yarn publish --dry-run
                ;;
              npm)
                npm publish --dry-run
                ;;
            esac
          else
            # Use custom publish command
            echo "Would run: $CUSTOM_PUBLISH_CMD --dry-run"
            $CUSTOM_PUBLISH_CMD --dry-run
          fi

      - name: Publish to NPM
        if: ${{ !inputs.dry-run }}
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CUSTOM_PUBLISH_CMD: ${{ inputs.publish-command }}
        run: |
          echo "Publishing to NPM registry: ${{ inputs.registry-url }}"

          PUBLISH_ARGS=""
          if [ "${{ inputs.enable-provenance }}" == "true" ]; then
            PUBLISH_ARGS="--provenance"
          fi

          if [ -z "$CUSTOM_PUBLISH_CMD" ]; then
            # Use default publish command based on package manager
            case "${{ inputs.package-manager }}" in
              pnpm)
                pnpm publish --no-git-checks --access public $PUBLISH_ARGS
                ;;
              bun)
                bun publish --access public
                ;;
              yarn)
                yarn publish --access public
                ;;
              npm)
                npm publish --access public $PUBLISH_ARGS
                ;;
            esac
          else
            # Use custom publish command
            $CUSTOM_PUBLISH_CMD
          fi

          echo "✓ Package published successfully"

      - name: Verify publication
        if: ${{ !inputs.dry-run }}
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION="${{ needs.pre-release-checks.outputs.version }}"

          echo "Verifying publication of $PACKAGE_NAME@$VERSION..."

          # Retry verification with exponential backoff
          MAX_ATTEMPTS=6
          ATTEMPT=1
          WAIT_TIME=5

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Verification attempt $ATTEMPT/$MAX_ATTEMPTS (waiting ${WAIT_TIME}s)..."
            sleep $WAIT_TIME

            if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
              echo "✓ Package verified on NPM registry"
              npm view "$PACKAGE_NAME@$VERSION" version
              exit 0
            fi

            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Package not yet available, retrying..."
              WAIT_TIME=$((WAIT_TIME * 2))  # Exponential backoff
              ATTEMPT=$((ATTEMPT + 1))
            else
              echo "::error::Package verification failed after $MAX_ATTEMPTS attempts"
              echo "::error::Package $PACKAGE_NAME@$VERSION not found on NPM registry"
              echo "::notice::The package may have been published but NPM registry is slow to update"
              exit 1
            fi
          done

  generate-sbom:
    name: Generate SBOM
    needs: [pre-release-checks, publish]
    if: inputs.enable-sbom && needs.pre-release-checks.outputs.should-publish == 'true' && !inputs.dry-run
    uses: ./.github/workflows/security-sbom.yml
    with:
      artifact-type: npm-package
      artifact-ref: ${{ inputs.working-directory }}
      sbom-format: cyclonedx-json

  github-release:
    name: Create Release
    needs: [pre-release-checks, publish]
    if: inputs.create-github-release && needs.pre-release-checks.outputs.should-publish == 'true' && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-url: ${{ steps.create-release.outputs.html_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Generate changelog
        if: inputs.generate-changelog
        id: changelog
        run: |
          VERSION="v${{ needs.pre-release-checks.outputs.version }}"

          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Generating changelog from $PREVIOUS_TAG to $VERSION"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD)
          else
            echo "No previous tag found, using all commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          fi

          # Save to file
          cat > /tmp/changelog.md << EOF
          ## What's Changed

          $CHANGELOG

          ## Installation

          \`\`\`bash
          npm install $(node -p "require('${{ inputs.working-directory }}/package.json').name")@${{ needs.pre-release-checks.outputs.version }}
          \`\`\`

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${VERSION}
          EOF

          echo "changelog_file=/tmp/changelog.md" >> $GITHUB_OUTPUT

      - name: Download SBOM artifact
        if: inputs.enable-sbom
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-npm-package
          path: ./sbom
        continue-on-error: true

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: v${{ needs.pre-release-checks.outputs.version }}
          name: Release v${{ needs.pre-release-checks.outputs.version }}
          body_path: ${{ inputs.generate-changelog && steps.changelog.outputs.changelog_file || '' }}
          draft: false
          prerelease: false
          files: |
            sbom/*.json
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-summary:
    name: Create Summary
    runs-on: ubuntu-latest
    needs: [pre-release-checks, publish, github-release]
    if: always() && !cancelled()
    steps:
      - name: Generate Release Summary
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          VERSION="${{ needs.pre-release-checks.outputs.version }}"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # Release — NPM Package

          **Timestamp:** $TIMESTAMP
          **Version:** \`v$VERSION\`
          **Registry:** ${{ inputs.registry-url }}
          **Provenance:** ${{ inputs.enable-provenance && 'Enabled' || 'Disabled' }}
          **Dry Run:** ${{ inputs.dry-run }}

          | Component | Status |
          | --- | --- |
          | Pre-Release Checks | ${{ needs.pre-release-checks.result }} |
          | NPM Publish | ${{ needs.publish.result }} |
          | GitHub Release | ${{ needs.github-release.result }} |

          ${{ needs.pre-release-checks.outputs.should-publish == 'false' && '> Version already published — publish step skipped.' || '' }}
          ${{ inputs.dry-run && '> Dry-run mode — package was NOT published.' || '' }}
          EOF

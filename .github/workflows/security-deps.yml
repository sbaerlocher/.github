---
name: Security - Dependencies

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: 'ubuntu-latest'
        description: >-
          Single runner label for all jobs in this workflow (e.g.
          `ubuntu-latest`, `self-hosted`). Runner groups and multi-label
          selectors are not supported.
      language:
        type: string
        required: true
        description: 'Project language (go, javascript, python, multi)'
      working-directory:
        type: string
        default: '.'
        description: 'Working directory for scans'
      # Dependency scanning options
      fail-on-severity:
        type: string
        default: 'moderate'
        description: 'Minimum severity to fail (low, moderate, high, critical)'
      # License checking options
      enable-license-check:
        type: boolean
        default: true
        description: 'Enable license compliance checking'
      allowed-licenses:
        type: string
        default: 'Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,0BSD,CC0-1.0,OFL-1.1'
        description: 'Comma-separated list of allowed licenses'
      denied-licenses:
        type: string
        default: 'GPL-2.0,GPL-3.0,AGPL-3.0'
        description: 'Comma-separated list of denied licenses'
      fail-on-license-violation:
        type: boolean
        default: false
        description: 'Fail workflow on license violations'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  # All audit jobs shared the same workflow-level permissions and differed only
  # by language/event `if:` guards, so they merge into one sequential-step job
  # (one checkout, one runner). Each former job is now a step group behind its
  # original `if:`; the report is the final always()-step reading step outcomes.
  dependency-scan:
    name: Scan Dependencies
    runs-on: ${{ inputs.runner }}
    # Union of the merged jobs' timeouts (review 10 + 3×15).
    timeout-minutes: 55
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        id: dependency-review
        if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          allow-licenses: ${{ inputs.allowed-licenses }}
          license-check: ${{ inputs.enable-license-check }}
          vulnerability-check: true
          comment-summary-in-pr: true

      # --- Go ---
      # continue-on-error on the setup steps: a failed setup counts as success
      # for the default `if: success()` gate of later steps, so a broken Go
      # setup can't skip the JS/Python setups + audits (they ran as independent
      # parallel jobs on origin/main).
      - name: Setup Go
        if: inputs.language == 'go' || inputs.language == 'multi'
        continue-on-error: true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Run govulncheck
        id: go-audit
        if: inputs.language == 'go' || inputs.language == 'multi'
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: 'v1.7.0'
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          # govulncheck exits 3 on findings; under the runner's `bash -eo pipefail`
          # the pipe would abort before we summarise, so disable -e for the run.
          set +e
          govulncheck -json ./... | tee govulncheck.json
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::govulncheck failed (exit $rc)"
            exit "$rc"
          fi
          if grep -q '"finding"' govulncheck.json; then
            echo "::warning::Vulnerabilities detected by govulncheck"
            jq -r '.finding // empty | .osv' govulncheck.json | sort -u | head -10
          else
            echo "::notice::No vulnerabilities found"
          fi

      - name: Check Go licenses
        if: (inputs.language == 'go' || inputs.language == 'multi') && inputs.enable-license-check
        working-directory: ${{ inputs.working-directory }}
        env:
          # renovate: datasource=go depName=github.com/google/go-licenses/v2
          GO_LICENSES_VERSION: 'v2.0.1'
          ALLOWED_LICENSES: ${{ inputs.allowed-licenses }}
        run: |
          go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"
          echo "Checking Go dependency licenses..."
          go-licenses check ./... --allowed_licenses="${ALLOWED_LICENSES}" 2>&1 | tee go-licenses.txt || true
          go-licenses csv ./... > go-licenses.csv 2>&1 || true

      - name: Upload Go audit results
        if: always() && (inputs.language == 'go' || inputs.language == 'multi')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-audit-results
          path: |
            ${{ inputs.working-directory }}/govulncheck.json
            ${{ inputs.working-directory }}/go-licenses.txt
            ${{ inputs.working-directory }}/go-licenses.csv
          retention-days: 30
          if-no-files-found: ignore

      # --- JavaScript ---
      - name: Setup Node.js
        if: inputs.language == 'javascript' || inputs.language == 'multi'
        continue-on-error: true
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Detect package manager
        id: detect-pm
        if: inputs.language == 'javascript' || inputs.language == 'multi'
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f "yarn.lock" ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f "bun.lockb" ]; then
            echo "pm=bun" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: |
          (inputs.language == 'javascript' || inputs.language == 'multi')
          && steps.detect-pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install JavaScript dependencies
        if: inputs.language == 'javascript' || inputs.language == 'multi'
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ steps.detect-pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
            npm) npm ci ;;
          esac

      - name: Run npm audit
        id: javascript-audit
        if: inputs.language == 'javascript' || inputs.language == 'multi'
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ steps.detect-pm.outputs.pm }}" in
            pnpm) pnpm audit --json > npm-audit.json || true ;;
            yarn) yarn audit --json > npm-audit.json || true ;;
            npm) npm audit --json > npm-audit.json || true ;;
            bun) echo "Bun audit not yet supported" > npm-audit.json ;;
          esac

      - name: Check JavaScript licenses
        if: (inputs.language == 'javascript' || inputs.language == 'multi') && inputs.enable-license-check
        working-directory: ${{ inputs.working-directory }}
        env:
          # license-checker (davglass) is unmaintained since 2019; the
          # rseidelsohn fork is the actively-maintained, feature-enhanced
          # superset of the original v25.0.1 and keeps the same CLI surface
          # (--json/--summary/--failOn). Note the binary is renamed to
          # `license-checker-rseidelsohn`.
          # renovate: datasource=npm depName=license-checker-rseidelsohn
          LICENSE_CHECKER_VERSION: '5.0.1'
          DENIED: ${{ inputs.denied-licenses }}
        run: |
          npm install -g "license-checker-rseidelsohn@${LICENSE_CHECKER_VERSION}"
          echo "Checking JavaScript dependency licenses..."
          license-checker-rseidelsohn --json > js-licenses.json 2>&1 || true
          license-checker-rseidelsohn --summary > js-licenses-summary.txt 2>&1 || true

          if [ -n "$DENIED" ]; then
            license-checker-rseidelsohn --failOn "$DENIED" 2>&1 | tee js-licenses-violations.txt || true
          fi

      - name: Upload JavaScript audit results
        if: always() && (inputs.language == 'javascript' || inputs.language == 'multi')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javascript-audit-results
          path: |
            ${{ inputs.working-directory }}/npm-audit.json
            ${{ inputs.working-directory }}/js-licenses.json
            ${{ inputs.working-directory }}/js-licenses-summary.txt
            ${{ inputs.working-directory }}/js-licenses-violations.txt
          retention-days: 30
          if-no-files-found: ignore

      # --- Python ---
      - name: Setup Python
        if: inputs.language == 'python' || inputs.language == 'multi'
        continue-on-error: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        if: inputs.language == 'python' || inputs.language == 'multi'
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install and run safety
        id: python-audit
        if: inputs.language == 'python' || inputs.language == 'multi'
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          # renovate: datasource=pypi depName=safety
          SAFETY_VERSION: '3.8.1'
        run: |
          pip install "safety==${SAFETY_VERSION}"
          if [ -f requirements.txt ]; then
            safety check --file requirements.txt --json > safety-results.json || true
          fi

      - name: Check Python licenses
        if: (inputs.language == 'python' || inputs.language == 'multi') && inputs.enable-license-check
        working-directory: ${{ inputs.working-directory }}
        env:
          # renovate: datasource=pypi depName=pip-licenses
          PIP_LICENSES_VERSION: '5.5.5'
        run: |
          pip install "pip-licenses==${PIP_LICENSES_VERSION}"
          echo "Checking Python dependency licenses..."
          pip-licenses --format=json > python-licenses.json 2>&1 || true
          pip-licenses --format=markdown > python-licenses.md 2>&1 || true

      - name: Upload Python audit results
        if: always() && (inputs.language == 'python' || inputs.language == 'multi')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-audit-results
          path: |
            ${{ inputs.working-directory }}/safety-results.json
            ${{ inputs.working-directory }}/python-licenses.json
            ${{ inputs.working-directory }}/python-licenses.md
          retention-days: 30
          if-no-files-found: ignore

      # Report folded from the old security-report job; step outcomes replace
      # needs.*.result (a disabled/skipped language step reports `skipped`).
      - name: Generate Security Report
        if: always()
        env:
          LANGUAGE: ${{ inputs.language }}
          LICENSE_CHECK: ${{ inputs.enable-license-check && 'Enabled' || 'Disabled' }}
          DEPENDENCY_REVIEW_OUTCOME: ${{ steps.dependency-review.outcome }}
          GO_AUDIT_OUTCOME: ${{ steps.go-audit.outcome }}
          JAVASCRIPT_AUDIT_OUTCOME: ${{ steps.javascript-audit.outcome }}
          PYTHON_AUDIT_OUTCOME: ${{ steps.python-audit.outcome }}
          ALLOWED_LICENSES: ${{ inputs.allowed-licenses }}
          DENIED_LICENSES: ${{ inputs.denied-licenses }}
          FAIL_ON_LICENSE_VIOLATION: ${{ inputs.fail-on-license-violation }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          # Values arrive via env: and are substituted by printf, not by the
          # shell parsing the body — a value containing $(...) is written
          # literally instead of being executed by the runner. The backticks in
          # the format strings are literal Markdown, hence single quotes.
          {
            printf '# Security — Dependencies & Licenses\n\n'
            printf '**Timestamp:** %s\n' "$TIMESTAMP"
            printf '**Language:** %s\n' "$LANGUAGE"
            printf '**License Check:** %s\n\n' "$LICENSE_CHECK"
            printf '| Component | Status |\n| --- | --- |\n'
            printf '| Dependency Review | %s |\n' "$DEPENDENCY_REVIEW_OUTCOME"
            printf '| Go Audit | %s |\n' "$GO_AUDIT_OUTCOME"
            printf '| JavaScript Audit | %s |\n' "$JAVASCRIPT_AUDIT_OUTCOME"
            printf '| Python Audit | %s |\n\n' "$PYTHON_AUDIT_OUTCOME"
            # shellcheck disable=SC2016  # backticks are literal Markdown here
            printf '**Allowed Licenses:** `%s`\n' "$ALLOWED_LICENSES"
            # shellcheck disable=SC2016  # backticks are literal Markdown here
            printf '**Denied Licenses:** `%s`\n' "$DENIED_LICENSES"
            printf '**Fail on Violation:** %s\n' "$FAIL_ON_LICENSE_VIOLATION"
          } >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error on dependency-review only lets the language audits run
      # afterwards; it must not swallow the fail-on-severity / denied-license
      # gate. On origin/main dependency-review had no continue-on-error, so a
      # finding failed the PR. Re-raise here. The go/js/python audits used
      # `|| true` on main and stay non-blocking.
      - name: Enforce dependency-review result
        if: always() && steps.dependency-review.outcome == 'failure'
        run: |
          echo "::error::dependency-review found vulnerabilities or denied licenses at/above the configured threshold"
          exit 1

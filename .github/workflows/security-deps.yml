---
name: Security - Dependencies

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
        description: 'Project language (go, javascript, python, multi)'
      working-directory:
        type: string
        default: '.'
        description: 'Working directory for scans'
      # Dependency scanning options
      fail-on-severity:
        type: string
        default: 'moderate'
        description: 'Minimum severity to fail (low, moderate, high, critical)'
      # License checking options
      enable-license-check:
        type: boolean
        default: true
        description: 'Enable license compliance checking'
      allowed-licenses:
        type: string
        default: 'Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT,0BSD,CC0-1.0'
        description: 'Comma-separated list of allowed licenses'
      denied-licenses:
        type: string
        default: 'GPL-2.0,GPL-3.0,AGPL-3.0'
        description: 'Comma-separated list of denied licenses'
      fail-on-license-violation:
        type: boolean
        default: false
        description: 'Fail workflow on license violations'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  dependency-review:
    name: Dependency Review (GitHub)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          allow-licenses: ${{ inputs.allowed-licenses }}
          license-check: ${{ inputs.enable-license-check }}
          vulnerability-check: true
          comment-summary-in-pr: true

  go-audit:
    name: Audit Go
    if: inputs.language == 'go' || inputs.language == 'multi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Vulnerability scanning
      - name: Run govulncheck
        working-directory: ${{ inputs.working-directory }}
        env:
          # renovate: datasource=go depName=golang.org/x/vuln
          GOVULNCHECK_VERSION: 'v1.4.0'
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          # govulncheck exits 3 on findings; under the runner's `bash -eo pipefail`
          # the pipe would abort before we summarise, so disable -e for the run.
          set +e
          govulncheck -json ./... | tee govulncheck.json
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::govulncheck failed (exit $rc)"
            exit "$rc"
          fi
          if grep -q '"finding"' govulncheck.json; then
            echo "::warning::Vulnerabilities detected by govulncheck"
            jq -r '.finding // empty | .osv' govulncheck.json | sort -u | head -10
          else
            echo "::notice::No vulnerabilities found"
          fi

      # License checking
      - name: Check Go licenses
        if: inputs.enable-license-check
        working-directory: ${{ inputs.working-directory }}
        env:
          # renovate: datasource=go depName=github.com/google/go-licenses/v2
          GO_LICENSES_VERSION: 'v2.0.1'
          ALLOWED_LICENSES: ${{ inputs.allowed-licenses }}
        run: |
          go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"
          echo "Checking Go dependency licenses..."
          go-licenses check ./... --allowed_licenses="${ALLOWED_LICENSES}" 2>&1 | tee go-licenses.txt || true
          go-licenses csv ./... > go-licenses.csv 2>&1 || true

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-audit-results
          path: |
            ${{ inputs.working-directory }}/govulncheck.json
            ${{ inputs.working-directory }}/go-licenses.txt
            ${{ inputs.working-directory }}/go-licenses.csv
          retention-days: 30
          if-no-files-found: ignore

  javascript-audit:
    name: Audit JavaScript
    if: inputs.language == 'javascript' || inputs.language == 'multi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Detect package manager
        id: detect-pm
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "pm=pnpm" >> $GITHUB_OUTPUT
          elif [ -f "yarn.lock" ]; then
            echo "pm=yarn" >> $GITHUB_OUTPUT
          elif [ -f "bun.lockb" ]; then
            echo "pm=bun" >> $GITHUB_OUTPUT
          else
            echo "pm=npm" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.detect-pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ steps.detect-pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
            npm) npm ci ;;
          esac

      # Vulnerability scanning
      - name: Run npm audit
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ steps.detect-pm.outputs.pm }}" in
            pnpm) pnpm audit --json > npm-audit.json || true ;;
            yarn) yarn audit --json > npm-audit.json || true ;;
            npm) npm audit --json > npm-audit.json || true ;;
            bun) echo "Bun audit not yet supported" > npm-audit.json ;;
          esac

      # License checking
      - name: Check JavaScript licenses
        if: inputs.enable-license-check
        working-directory: ${{ inputs.working-directory }}
        env:
          # license-checker (davglass) is unmaintained since 2019; the
          # rseidelsohn fork is the actively-maintained, feature-enhanced
          # superset of the original v25.0.1 and keeps the same CLI surface
          # (--json/--summary/--failOn). Note the binary is renamed to
          # `license-checker-rseidelsohn`.
          # renovate: datasource=npm depName=license-checker-rseidelsohn
          LICENSE_CHECKER_VERSION: '5.0.1'
          DENIED: ${{ inputs.denied-licenses }}
        run: |
          npm install -g "license-checker-rseidelsohn@${LICENSE_CHECKER_VERSION}"
          echo "Checking JavaScript dependency licenses..."
          license-checker-rseidelsohn --json > js-licenses.json 2>&1 || true
          license-checker-rseidelsohn --summary > js-licenses-summary.txt 2>&1 || true

          if [ -n "$DENIED" ]; then
            license-checker-rseidelsohn --failOn "$DENIED" 2>&1 | tee js-licenses-violations.txt || true
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: javascript-audit-results
          path: |
            ${{ inputs.working-directory }}/npm-audit.json
            ${{ inputs.working-directory }}/js-licenses.json
            ${{ inputs.working-directory }}/js-licenses-summary.txt
            ${{ inputs.working-directory }}/js-licenses-violations.txt
          retention-days: 30
          if-no-files-found: ignore

  python-audit:
    name: Audit Python
    if: inputs.language == 'python' || inputs.language == 'multi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # Vulnerability scanning
      - name: Install and run safety
        working-directory: ${{ inputs.working-directory }}
        env:
          # renovate: datasource=pypi depName=safety
          SAFETY_VERSION: '3.8.1'
        run: |
          pip install "safety==${SAFETY_VERSION}"
          if [ -f requirements.txt ]; then
            safety check --file requirements.txt --json > safety-results.json || true
          fi

      # License checking
      - name: Check Python licenses
        if: inputs.enable-license-check
        working-directory: ${{ inputs.working-directory }}
        env:
          # renovate: datasource=pypi depName=pip-licenses
          PIP_LICENSES_VERSION: '5.5.5'
        run: |
          pip install "pip-licenses==${PIP_LICENSES_VERSION}"
          echo "Checking Python dependency licenses..."
          pip-licenses --format=json > python-licenses.json 2>&1 || true
          pip-licenses --format=markdown > python-licenses.md 2>&1 || true

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-audit-results
          path: |
            ${{ inputs.working-directory }}/safety-results.json
            ${{ inputs.working-directory }}/python-licenses.json
            ${{ inputs.working-directory }}/python-licenses.md
          retention-days: 30
          if-no-files-found: ignore

  security-report:
    name: Create Report
    runs-on: ubuntu-latest
    needs: [dependency-review, go-audit, javascript-audit, python-audit]
    if: always() && !cancelled()
    steps:
      - name: Generate Security Report
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # Security — Dependencies & Licenses

          **Timestamp:** $TIMESTAMP
          **Language:** ${{ inputs.language }}
          **License Check:** ${{ inputs.enable-license-check && 'Enabled' || 'Disabled' }}

          | Component | Status |
          | --- | --- |
          | Dependency Review | ${{ needs.dependency-review.result }} |
          | Go Audit | ${{ needs.go-audit.result }} |
          | JavaScript Audit | ${{ needs.javascript-audit.result }} |
          | Python Audit | ${{ needs.python-audit.result }} |

          **Allowed Licenses:** \`${{ inputs.allowed-licenses }}\`
          **Denied Licenses:** \`${{ inputs.denied-licenses }}\`
          **Fail on Violation:** ${{ inputs.fail-on-license-violation }}
          EOF

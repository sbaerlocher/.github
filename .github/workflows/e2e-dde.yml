---
name: End-to-End - dde

on:
  workflow_call:
    inputs:
      # dde Configuration
      dde-version:
        type: string
        required: false
        default: 'latest'
        description: 'dde version to install (e.g. v2.0.0-alpha.5) or "latest"'
      project-directory:
        type: string
        required: false
        default: '.'
        description: 'Directory containing .dde/config.yml'
      wait-url:
        type: string
        required: false
        default: ''
        description: 'If set, poll this URL until 2xx/3xx before running tests (TLS errors ignored)'
      wait-timeout:
        type: number
        required: false
        default: 180
        description: 'Maximum seconds to wait for wait-url to respond'

      # Playwright Configuration
      node-version:
        type: string
        required: false
        default: '20'
        description: 'Node.js version for Playwright'
      package-manager:
        type: string
        required: false
        default: 'npm'
        description: 'Package manager (npm, pnpm, yarn, bun)'
      playwright-directory:
        type: string
        required: false
        default: './client'
        description: 'Directory containing Playwright tests'
      test-command:
        type: string
        required: false
        default: 'test:e2e'
        description: |
          Package-manager script name to run for Playwright tests.
          Ignored when `test-command-override` is set — that bypasses the
          PM wrapper and runs arbitrary bash instead.
      test-command-override:
        type: string
        required: false
        default: ''
        description: |
          Raw bash command(s) to run Playwright tests, bypassing the
          package-manager wrapper. When non-empty, this replaces the
          `<pm> run <test-command>` step entirely. Use for projects that
          drive Playwright through a dde plugin or other custom entrypoint
          (e.g. `dde project:e2e:test`). Runs in `playwright-directory`.
      playwright-browsers:
        type: string
        required: false
        default: 'chromium'
        description: 'Playwright browsers (chromium, firefox, webkit, all)'

      # E2E lifecycle hooks
      compose-profiles:
        type: string
        required: false
        default: ''
        description: |
          Value for the `COMPOSE_PROFILES` env var on the job. Set when
          the dde stack defines compose profiles that gate the E2E
          service set (e.g. `e2e` to bring up an `app-e2e` profile while
          leaving the dev profile dormant). Applies to every dde call in
          the job, including project:up and project:down.
      pre-test-commands:
        type: string
        required: false
        default: ''
        description: |
          Bash command(s) to run after `dde project:up` and dependency
          install, but before Playwright tests. Use for project-specific
          E2E setup (database reset, health-check waits, fixture seeding,
          ...). Runs in the project directory (`project-directory`), not
          `playwright-directory`.
      failure-logs-command:
        type: string
        required: false
        default: ''
        description: |
          Bash command(s) to capture diagnostics on test failure. When
          non-empty, replaces the default `dde project:logs` / `project:ps`
          capture. Output is appended to `$RUNNER_TEMP/dde-logs.txt`. Runs
          in the project directory. Useful for plugin-driven log helpers
          like `dde project:e2e:logs -- 200`.
      teardown-command:
        type: string
        required: false
        default: ''
        description: |
          Bash command(s) for the always-run teardown step. When non-empty,
          replaces the default `dde project:down`. Use to invoke a
          project-specific cleanup plugin (e.g. `dde project:e2e:down`,
          which also removes the e2e volumes). Runs in the project
          directory; failures are tolerated.

      # Artifact Configuration
      upload-artifacts:
        type: boolean
        required: false
        default: true
        description: 'Upload test artifacts and logs'
      artifact-retention-days:
        type: number
        required: false
        default: 30
        description: 'Artifact retention days'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  e2e-dde:
    name: E2E (dde)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      dde-version: ${{ steps.dde.outputs.version }}
    # COMPOSE_PROFILES is set at job scope so every dde invocation
    # (project:up, project:down, plugin commands, teardown) sees the same
    # compose-profile selection. Empty by default — Compose treats an
    # unset/empty value the same as "no profiles", which matches the
    # zero-config behavior of the previous reusable workflow.
    env:
      COMPOSE_PROFILES: ${{ inputs.compose-profiles }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Bring dde project up
        id: dde
        uses: sbaerlocher/.github/.github/actions/project@2026-05-16
        with:
          command: up
          version: ${{ inputs.dde-version }}
          working-directory: ${{ inputs.project-directory }}
          wait-url: ${{ inputs.wait-url }}
          wait-timeout: ${{ inputs.wait-timeout }}

      - name: Show running services
        working-directory: ${{ inputs.project-directory }}
        continue-on-error: true
        run: dde project:ps

      # ----- Playwright -----
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.playwright-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || inputs.package-manager == 'bun' && 'bun.lock' || 'package-lock.json' }}

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        working-directory: ${{ inputs.playwright-directory }}
        env:
          PM: ${{ inputs.package-manager }}
        run: |
          case "$PM" in
            pnpm) pnpm install --frozen-lockfile ;;
            bun) bun install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
          esac

      - name: Install Playwright browsers
        working-directory: ${{ inputs.playwright-directory }}
        env:
          BROWSERS: ${{ inputs.playwright-browsers }}
        run: |
          if [ "$BROWSERS" = "all" ]; then
            npx playwright install --with-deps
          else
            npx playwright install --with-deps "$BROWSERS"
          fi

      # Optional pre-test hook for project-specific setup (DB reset,
      # health-check waits, fixture seeding). Runs in the project
      # directory so callers can invoke `dde project:*` plugins
      # directly. Skipped when the input is empty.
      - name: Run pre-test commands
        if: inputs.pre-test-commands != ''
        working-directory: ${{ inputs.project-directory }}
        shell: bash
        run: ${{ inputs.pre-test-commands }}

      # Test runner: two mutually exclusive modes. When
      # `test-command-override` is set, run that bash verbatim and skip
      # the package-manager wrapper. Otherwise fall back to the
      # historical `<pm> run <test-command>` behavior. Splitting the step
      # via `if:` keeps each mode readable in step logs.
      - name: Run Playwright tests (override)
        if: inputs.test-command-override != ''
        working-directory: ${{ inputs.playwright-directory }}
        shell: bash
        run: ${{ inputs.test-command-override }}

      - name: Run Playwright tests
        if: inputs.test-command-override == ''
        working-directory: ${{ inputs.playwright-directory }}
        env:
          PM: ${{ inputs.package-manager }}
          TEST_CMD: ${{ inputs.test-command }}
        run: |
          case "$PM" in
            pnpm) pnpm "$TEST_CMD" ;;
            bun) bun run "$TEST_CMD" ;;
            yarn) yarn "$TEST_CMD" ;;
            npm) npm run "$TEST_CMD" ;;
          esac

      # ----- Failure diagnostics & teardown -----
      - name: Save dde logs
        if: failure() && inputs.upload-artifacts
        env:
          PROJECT_DIR: ${{ inputs.project-directory }}
          LOGS_OVERRIDE: ${{ inputs.failure-logs-command }}
        run: |
          if ! command -v dde >/dev/null 2>&1; then
            echo "dde was never installed — see 'Bring dde project up' step output" \
              | tee "$RUNNER_TEMP/dde-logs.txt" "$RUNNER_TEMP/dde-ps.txt"
            exit 0
          fi
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "project-directory '$PROJECT_DIR' does not exist" \
              | tee "$RUNNER_TEMP/dde-logs.txt" "$RUNNER_TEMP/dde-ps.txt"
            exit 0
          fi
          cd "$PROJECT_DIR"
          if [ -n "$LOGS_OVERRIDE" ]; then
            # Override mode: caller owns log collection (e.g. a
            # `dde project:e2e:logs -- 200` plugin). We still write
            # dde-ps.txt from the standard `project:ps` so the artifact
            # bundle stays useful even when the override only captures
            # service logs.
            bash -c "$LOGS_OVERRIDE" > "$RUNNER_TEMP/dde-logs.txt" 2>&1 || true
            dde project:ps           > "$RUNNER_TEMP/dde-ps.txt"   2>&1 || true
          else
            dde project:logs > "$RUNNER_TEMP/dde-logs.txt" 2>&1 || true
            dde project:ps   > "$RUNNER_TEMP/dde-ps.txt"   2>&1 || true
          fi

      - name: Upload Playwright report
        if: inputs.upload-artifacts && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: ${{ inputs.playwright-directory }}/playwright-report/
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore

      - name: Upload test results
        if: inputs.upload-artifacts && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: ${{ inputs.playwright-directory }}/test-results/
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore

      - name: Upload dde logs
        if: failure() && inputs.upload-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dde-logs
          path: |
            ${{ runner.temp }}/dde-logs.txt
            ${{ runner.temp }}/dde-ps.txt
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: ignore

      - name: Stop dde project
        if: always()
        env:
          PROJECT_DIR: ${{ inputs.project-directory }}
          TEARDOWN_OVERRIDE: ${{ inputs.teardown-command }}
        run: |
          if ! command -v dde >/dev/null 2>&1; then
            echo "dde was never installed — nothing to tear down"
            exit 0
          fi
          if [ ! -d "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/.dde/config.yml" ]; then
            echo "project-directory '$PROJECT_DIR' missing or not a dde project — skipping project:down"
            exit 0
          fi
          cd "$PROJECT_DIR"
          if [ -n "$TEARDOWN_OVERRIDE" ]; then
            # Caller-provided cleanup (e.g. `dde project:e2e:down`, which
            # also removes the e2e volumes). Tolerate failures so a
            # broken teardown doesn't mask the real test result.
            bash -c "$TEARDOWN_OVERRIDE" || true
          else
            dde project:down || true
          fi

  # PR comment runs as a separate job so the test job stays at
  # contents:read. pull-requests:write is scoped to this job only.
  # Skipped on fork PRs: GITHUB_TOKEN is read-only there, so createComment
  # would 403 and fail the job.
  comment:
    name: Comment PR
    needs: e2e-dde
    runs-on: ubuntu-latest
    if: >
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment PR with test results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROJECT_DIRECTORY: ${{ inputs.project-directory }}
          DDE_VERSION: ${{ needs.e2e-dde.outputs.dde-version }}
          JOB_STATUS: ${{ needs.e2e-dde.result }}
        with:
          script: |
            const projectDir = process.env.PROJECT_DIRECTORY;
            const ddeVersion = process.env.DDE_VERSION;
            const jobStatus = process.env.JOB_STATUS;

            let comment = '## 🎭 E2E Test Results (dde)\n\n';
            comment += `**Project**: \`${projectDir}\`\n`;
            comment += `**dde**: \`${ddeVersion}\`\n\n`;

            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;

            if (jobStatus === 'success') {
              comment += '✅ All tests passed!\n';
            } else if (jobStatus === 'failure') {
              comment += '❌ Tests failed!\n\n';
              comment += `View the [Playwright report](${runUrl}) for details.\n`;
            } else {
              comment += `⚠️ Tests completed with status: ${jobStatus}\n\n`;
              comment += `View the [test results](${runUrl}) for details.\n`;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

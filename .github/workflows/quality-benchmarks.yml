---
name: Quality - Benchmarks

on:
  workflow_call:
    inputs:
      language:
        type: string
        required: true
        description: 'Project language (go, javascript)'
      working-directory:
        type: string
        default: '.'
        description: 'Working directory'
      benchmark-command:
        type: string
        default: ''
        description: 'Custom benchmark command (optional)'
      compare-with-base:
        type: boolean
        default: true
        description: 'Compare benchmarks with base branch'
      fail-on-regression:
        type: boolean
        default: false
        description: 'Fail if performance regresses'
      regression-threshold:
        type: number
        default: 10
        description: 'Regression threshold in percentage'

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark-go:
    name: Benchmarks (Go)
    if: inputs.language == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run benchmarks (current)
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -n "${{ inputs.benchmark-command }}" ]; then
            ${{ inputs.benchmark-command }} | tee current-bench.txt
          else
            go test -bench=. -benchmem -run=^$ ./... | tee current-bench.txt
          fi

      - name: Checkout base branch
        if: inputs.compare-with-base && github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }}

      - name: Run benchmarks (base)
        if: inputs.compare-with-base && github.event_name == 'pull_request'
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -n "${{ inputs.benchmark-command }}" ]; then
            ${{ inputs.benchmark-command }} | tee base-bench.txt
          else
            go test -bench=. -benchmem -run=^$ ./... | tee base-bench.txt
          fi

      - name: Install benchstat
        if: inputs.compare-with-base && github.event_name == 'pull_request'
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Compare benchmarks
        if: inputs.compare-with-base && github.event_name == 'pull_request'
        working-directory: ${{ inputs.working-directory }}
        run: |
          benchstat base-bench.txt current-bench.txt | tee benchmark-comparison.txt

          # Check for regressions
          if grep -q "~" benchmark-comparison.txt; then
            echo "::notice::No significant performance changes"
          elif grep -E '\+[0-9]+\.[0-9]+%' benchmark-comparison.txt; then
            echo "::warning::Performance regressions detected"
            if [ "${{ inputs.fail-on-regression }}" == "true" ]; then
              exit 1
            fi
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: go-benchmark-results
          path: |
            ${{ inputs.working-directory }}/current-bench.txt
            ${{ inputs.working-directory }}/base-bench.txt
            ${{ inputs.working-directory }}/benchmark-comparison.txt
          retention-days: 90
          if-no-files-found: ignore

      - name: Comment PR with results
        if: inputs.compare-with-base && github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const comparisonPath = '${{ inputs.working-directory }}/benchmark-comparison.txt';

            if (fs.existsSync(comparisonPath)) {
              const comparison = fs.readFileSync(comparisonPath, 'utf8');

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ⚡ Performance Benchmark Results\n\n\`\`\`\n${comparison}\n\`\`\`\n\n*Benchmarks run on commit ${context.sha.substring(0, 7)}*`
              });
            }

  benchmark-javascript:
    name: Benchmarks (JavaScript)
    if: inputs.language == 'javascript'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'

      - name: Detect package manager
        id: detect-pm
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "pm=pnpm" >> $GITHUB_OUTPUT
          elif [ -f "yarn.lock" ]; then
            echo "pm=yarn" >> $GITHUB_OUTPUT
          else
            echo "pm=npm" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.detect-pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          case "${{ steps.detect-pm.outputs.pm }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm) npm ci ;;
          esac

      - name: Run benchmarks
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -n "${{ inputs.benchmark-command }}" ]; then
            ${{ inputs.benchmark-command }}
          elif [ -f "vitest.config.ts" ] || [ -f "vitest.config.js" ]; then
            case "${{ steps.detect-pm.outputs.pm }}" in
              pnpm) pnpm vitest bench ;;
              yarn) yarn vitest bench ;;
              npm) npm run vitest bench ;;
            esac
          else
            echo "::warning::No benchmark command specified and no vitest config found"
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: javascript-benchmark-results
          path: ${{ inputs.working-directory }}/benchmark-results.*
          retention-days: 90
          if-no-files-found: ignore

  benchmark-report:
    name: Benchmark Report
    runs-on: ubuntu-latest
    needs: [benchmark-go, benchmark-javascript]
    if: always() && !cancelled()
    steps:
      - name: Generate Benchmark Report
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # Performance Benchmark Report

          **Timestamp:** $TIMESTAMP
          **Language:** ${{ inputs.language }}

          ## Benchmark Status

          | Language | Status |
          |----------|--------|
          | Go | ${{ needs.benchmark-go.result }} |
          | JavaScript | ${{ needs.benchmark-javascript.result }} |

          ## Tools Used

          **Go:**
          - \`go test -bench\`: Native Go benchmarking
          - \`benchstat\`: Statistical comparison tool

          **JavaScript:**
          - **Vitest Bench**: Modern benchmarking with Vitest
          - **tinybench**: Lightweight benchmarking library

          ## What to Benchmark

          **Backend/API:**
          - Request/response times
          - Database query performance
          - Algorithm efficiency
          - Memory allocations

          **Frontend:**
          - Component render times
          - State update performance
          - Bundle size impact
          - First Contentful Paint (FCP)

          ## Best Practices

          - ✓ Run benchmarks on consistent hardware
          - ✓ Warm up before measuring
          - ✓ Run multiple iterations
          - ✓ Use statistical comparison (benchstat)
          - ✓ Track trends over time
          - ✓ Set regression thresholds

          ## Interpreting Results

          - **~**: No significant change (good!)
          - **-X%**: Performance improvement (faster)
          - **+X%**: Performance regression (slower)

          ---
          *Performance benchmarks completed*
          EOF

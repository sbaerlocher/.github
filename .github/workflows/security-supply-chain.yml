---
name: Security - Supply Chain

on:
  workflow_call:
    inputs:
      # General
      artifact-type:
        type: string
        required: true
        description: 'Artifact type (container, filesystem, go-binary, npm-package)'
      artifact-ref:
        type: string
        required: true
        description: 'Artifact reference (image name, directory path, or binary path)'
      working-directory:
        type: string
        default: '.'
        description: 'Working directory'
      # SBOM options
      enable-sbom:
        type: boolean
        default: true
        description: 'Generate SBOM'
      sbom-format:
        type: string
        default: 'cyclonedx-json'
        description: 'SBOM format (cyclonedx-json, spdx-json, syft-json)'
      # Signing options (for container images)
      enable-signing:
        type: boolean
        default: false
        description: 'Sign artifacts with Cosign (requires container artifact-type)'
      attach-sbom-to-image:
        type: boolean
        default: true
        description: 'Attach SBOM to container image (requires signing enabled)'

permissions:
  contents: write
  id-token: write  # Required for keyless signing

jobs:
  generate-sbom:
    name: Generate SBOM
    if: inputs.enable-sbom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sbom-file: ${{ steps.sbom-output.outputs.file }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Container Image SBOM
      - name: Generate SBOM for container image
        if: inputs.artifact-type == 'container'
        uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11 # v0.23.0
        with:
          image: ${{ inputs.artifact-ref }}
          format: ${{ inputs.sbom-format }}
          output-file: sbom-${{ inputs.artifact-type }}.json

      # Filesystem SBOM
      - name: Generate SBOM for filesystem
        if: inputs.artifact-type == 'filesystem'
        uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11 # v0.23.0
        with:
          path: ${{ inputs.artifact-ref }}
          format: ${{ inputs.sbom-format }}
          output-file: sbom-${{ inputs.artifact-type }}.json

      # Go Binary SBOM
      - name: Setup Go
        if: inputs.artifact-type == 'go-binary'
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Generate SBOM for Go binary
        if: inputs.artifact-type == 'go-binary'
        working-directory: ${{ inputs.working-directory }}
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod mod -json -output ../sbom-${{ inputs.artifact-type }}.json

      # NPM Package SBOM
      - name: Setup Node.js
        if: inputs.artifact-type == 'npm-package'
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'

      - name: Generate SBOM for NPM package
        if: inputs.artifact-type == 'npm-package'
        working-directory: ${{ inputs.working-directory }}
        run: |
          npm install -g @cyclonedx/cyclonedx-npm
          cyclonedx-npm --output-file ../sbom-${{ inputs.artifact-type }}.json

      # Validate and upload SBOM
      - name: Validate SBOM
        id: sbom-output
        run: |
          SBOM_FILE="sbom-${{ inputs.artifact-type }}.json"
          echo "file=$SBOM_FILE" >> $GITHUB_OUTPUT

          if [ -f "$SBOM_FILE" ]; then
            echo "✓ SBOM generated successfully: $SBOM_FILE"

            # Show component count
            COMPONENTS=$(jq '[.components[] // .packages[]] | length' "$SBOM_FILE" 2>/dev/null || echo "unknown")
            echo "Components/Packages: $COMPONENTS"
          else
            echo "::error::SBOM file not found: $SBOM_FILE"
            exit 1
          fi

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom-${{ inputs.artifact-type }}
          path: sbom-${{ inputs.artifact-type }}.json
          retention-days: 90

  sign-container:
    name: Sign Image
    if: inputs.enable-signing && inputs.artifact-type == 'container'
    needs: [generate-sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Download SBOM
        if: inputs.enable-sbom && inputs.attach-sbom-to-image
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: sbom-container
          path: ./sbom

      - name: Sign container image (keyless)
        env:
          IMAGE: ${{ inputs.artifact-ref }}
        run: |
          echo "Signing container image: $IMAGE"

          # Keyless signing with GitHub OIDC
          cosign sign --yes "$IMAGE"

          echo "✓ Image signed successfully"

      - name: Attach SBOM to image
        if: inputs.enable-sbom && inputs.attach-sbom-to-image
        env:
          IMAGE: ${{ inputs.artifact-ref }}
        run: |
          echo "Attaching SBOM to image..."

          cosign attach sbom --sbom sbom/sbom-container.json "$IMAGE"

          # Sign the SBOM attestation
          cosign sign --yes --attachment sbom "$IMAGE"

          echo "✓ SBOM attached and signed"

      - name: Verify signature
        env:
          IMAGE: ${{ inputs.artifact-ref }}
        run: |
          echo "Verifying image signature..."

          # Verify using GitHub OIDC issuer
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "$IMAGE"

          echo "✓ Signature verified successfully"

      - name: Generate attestation
        env:
          IMAGE: ${{ inputs.artifact-ref }}
        run: |
          # Create build provenance attestation
          cat > attestation.json << EOF
          {
            "buildType": "https://github.com/Attestations/GitHubActionsWorkflow@v1",
            "builder": {
              "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            },
            "invocation": {
              "configSource": {
                "uri": "${{ github.server_url }}/${{ github.repository }}",
                "digest": {
                  "sha1": "${{ github.sha }}"
                },
                "entryPoint": "${{ github.workflow }}"
              }
            },
            "metadata": {
              "buildStartedOn": "${{ github.event.repository.pushed_at }}",
              "buildFinishedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "completeness": {
                "parameters": true,
                "environment": true,
                "materials": true
              },
              "reproducible": false
            }
          }
          EOF

          cosign attest --yes --predicate attestation.json "$IMAGE"
          echo "✓ Build provenance attestation created"

  supply-chain-report:
    name: Create Report
    runs-on: ubuntu-latest
    needs: [generate-sbom, sign-container]
    if: always() && !cancelled()
    steps:
      - name: Download SBOM
        if: inputs.enable-sbom
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: sbom-${{ inputs.artifact-type }}
          path: ./sbom
        continue-on-error: true

      - name: Generate Supply Chain Report
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          # Count SBOM components
          if [ -f "./sbom/sbom-${{ inputs.artifact-type }}.json" ]; then
            COMPONENT_COUNT=$(jq '[.components[] // .packages[]] | length' "./sbom/sbom-${{ inputs.artifact-type }}.json" 2>/dev/null || echo "unknown")
          else
            COMPONENT_COUNT="N/A"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # 🔐 Supply Chain Security Report

          **Timestamp:** $TIMESTAMP
          **Artifact Type:** ${{ inputs.artifact-type }}
          **Artifact Reference:** \`${{ inputs.artifact-ref }}\`

          ## Security Measures

          | Component | Status |
          |-----------|--------|
          | SBOM Generation | ${{ inputs.enable-sbom && needs.generate-sbom.result || 'Disabled' }} |
          | Image Signing | ${{ inputs.enable-signing && needs.sign-container.result || 'Disabled' }} |
          | SBOM Attachment | ${{ inputs.enable-sbom && inputs.attach-sbom-to-image && '✓ Enabled' || 'Disabled' }} |

          ## SBOM Details

          **Format:** ${{ inputs.sbom-format }}
          **Components/Packages:** $COMPONENT_COUNT

          ## Supply Chain Coverage

          This workflow provides:

          - 📋 **SBOM Generation**: Complete bill of materials for transparency
          - ✍️  **Keyless Signing**: Cosign + Sigstore for artifact integrity
          - 🔗 **Provenance**: Build attestations linking artifacts to source
          - 🔒 **Verification**: Cryptographic proof of authenticity

          ## Verification

          **For container images:**
          \`\`\`bash
          # Verify signature
          cosign verify \\
            --certificate-identity-regexp="https://github.com/${{ github.repository }}.*" \\
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\
            ${{ inputs.artifact-ref }}

          # Download SBOM
          cosign download sbom ${{ inputs.artifact-ref }}
          \`\`\`

          ## Supply Chain Security Best Practices

          - ✓ Generate SBOMs for all release artifacts
          - ✓ Sign artifacts with keyless signing (Cosign)
          - ✓ Verify signatures before deployment
          - ✓ Use provenance attestations for audit trails
          - ✓ Scan dependencies for vulnerabilities
          - ✓ Keep signing tools and formats up-to-date

          ---
          *Supply chain security analysis completed*
          EOF

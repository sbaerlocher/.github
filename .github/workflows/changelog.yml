name: Changelog Check

# Own file rather than a job in pull-request.yml: the `edited` trigger (so a
# retitled PR is re-checked) would otherwise restart Claude review and code
# scanning on every title or body edit.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Rules live in scripts/check-changelog.sh (tested by
  # scripts/tests/test-check-changelog.sh); this job only feeds it the PR
  # title and the changed paths.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the base...head diff resolves.
          fetch-depth: 0
          persist-credentials: false

      - name: Require CHANGELOG.md entry
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA...$HEAD_SHA" | scripts/check-changelog.sh "$PR_TITLE"

name: Continuous Integration - GitOps

# Reusable workflow for GitOps repositories using Fleet, Helm, and Kubernetes.
# Validates YAML syntax, Fleet configuration, GitRepo paths, Helm charts, and
# Kubernetes manifests via kubeconform.

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version for yamllint'
        type: string
        required: false
        default: '3.14'
      helm-version:
        description: 'Helm version'
        type: string
        required: false
        default: '4.1.3'
      kubeconform-version:
        description: 'kubeconform version (without v prefix)'
        type: string
        required: false
        # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.+)$
        default: '0.8.0'
      enable-yaml-lint:
        description: 'Run YAML syntax validation'
        type: boolean
        required: false
        default: true
      enable-fleet-validation:
        description: 'Validate Fleet bundle configuration'
        type: boolean
        required: false
        default: true
      enable-gitrepo-validation:
        description: 'Validate GitRepo paths'
        type: boolean
        required: false
        default: true
      enable-helm-lint:
        description: 'Lint Helm charts'
        type: boolean
        required: false
        default: true
      enable-helm-template-validation:
        description: >-
          Render each Helm chart with `helm template` and validate the
          rendered manifests with kubeconform. Catches values/render errors
          that `helm lint` and static-manifest kubeconform miss.
        type: boolean
        required: false
        default: true
      enable-k8s-validation:
        description: 'Validate Kubernetes manifests with kubeconform'
        type: boolean
        required: false
        default: true
      yaml-lint-strict:
        description: 'Fail the job when yamllint reports any issue'
        type: boolean
        required: false
        default: true
      k8s-validation-strict:
        description: 'Fail the job when kubeconform reports invalid manifests'
        type: boolean
        required: false
        default: true
      enable-docs-check:
        description: 'Check for required documentation files'
        type: boolean
        required: false
        default: true
      fleet-paths:
        description: 'Space-separated paths to search for fleet.yaml files'
        type: string
        required: false
        default: 'platform applications'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

permissions:
  contents: read

jobs:
  validate-yaml:
    name: Validate YAML Syntax
    if: inputs.enable-yaml-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-yamllint
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate YAML files
        run: |
          set -euo pipefail
          if [ ! -f .yamllint.yml ]; then
            echo "::warning::.yamllint.yml not found - using default config"
          fi
          # -print0 / xargs -0 to survive paths with spaces
          if [ "${{ inputs.yaml-lint-strict }}" = "true" ]; then
            find . \( -name '*.yaml' -o -name '*.yml' \) -print0 \
              | xargs -0 yamllint ${{ hashFiles('.yamllint.yml') != '' && '-c .yamllint.yml' || '' }} -f parsable
          else
            find . \( -name '*.yaml' -o -name '*.yml' \) -print0 \
              | xargs -0 yamllint ${{ hashFiles('.yamllint.yml') != '' && '-c .yamllint.yml' || '' }} -f parsable || true
          fi

  validate-fleet-configs:
    name: Validate Fleet Configurations
    # Gate behind validate-yaml. The gate is conditional (enable-yaml-lint), so
    # the always()/!failure()/!cancelled() guard runs this job when the gate
    # succeeds OR is skipped, and blocks only on a gate failure.
    needs: [validate-yaml]
    if: >-
      always() && !failure() && !cancelled()
      && inputs.enable-fleet-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check fleet.yaml files exist
        run: |
          echo "Checking for fleet.yaml files in: ${{ inputs.fleet-paths }}"
          FLEET_FILES=$(find ${{ inputs.fleet-paths }} -name "fleet.yaml" 2>/dev/null | wc -l)
          echo "Found $FLEET_FILES fleet.yaml files"

          if [ "$FLEET_FILES" -eq 0 ]; then
            echo "ERROR: No fleet.yaml files found!"
            exit 1
          fi

      - name: Validate fleet.yaml structure
        run: |
          echo "Validating fleet.yaml files..."
          ERRORS=0

          for file in $(find ${{ inputs.fleet-paths }} -name "fleet.yaml" 2>/dev/null); do
            echo "Checking $file..."

            if ! grep -q "defaultNamespace:" "$file"; then
              echo "WARNING: $file missing defaultNamespace field"
            fi

            if grep -q "^helm:" "$file"; then
              if grep -q "  chart:" "$file"; then
                if ! grep -q "  version:" "$file"; then
                  echo "ERROR: $file has helm chart but missing version field"
                  ERRORS=$((ERRORS + 1))
                fi
                if ! grep -q "  repo:" "$file"; then
                  if ! grep -q "  chart: oci://" "$file"; then
                    echo "WARNING: $file has helm chart but missing repo field (unless using OCI)"
                  fi
                fi
              else
                echo "INFO: $file uses helm lifecycle options for plain manifests"
              fi
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS errors in fleet.yaml files"
            exit 1
          fi

          echo "All fleet.yaml files validated successfully!"

  validate-gitrepo:
    name: Validate GitRepo Configuration
    needs: [validate-yaml]
    if: >-
      always() && !failure() && !cancelled()
      && inputs.enable-gitrepo-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check GitRepo exists
        run: |
          if [ ! -f "gitrepos/production.yaml" ]; then
            echo "ERROR: gitrepos/production.yaml not found!"
            exit 1
          fi

      - name: Validate GitRepo paths
        run: |
          echo "Validating GitRepo paths..."
          ERRORS=0

          PATHS=$(grep -A 100 "paths:" gitrepos/production.yaml | grep "^    - " | sed 's/^    - //')

          for path in $PATHS; do
            if [ ! -d "$path" ]; then
              echo "WARNING: Path $path in GitRepo does not exist"
            elif [ ! -f "$path/fleet.yaml" ]; then
              echo "ERROR: Path $path in GitRepo missing fleet.yaml"
              ERRORS=$((ERRORS + 1))
            else
              echo "✓ $path"
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS errors in GitRepo configuration"
            exit 1
          fi

          echo "GitRepo configuration validated successfully!"

  validate-helm:
    name: Validate Helm Charts
    needs: [validate-yaml]
    if: >-
      always() && !failure() && !cancelled()
      && inputs.enable-helm-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v${{ inputs.helm-version }}

      - name: Cache Helm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/helm
          key: ${{ runner.os }}-helm-${{ hashFiles('**/Chart.yaml') }}
          restore-keys: |
            ${{ runner.os }}-helm-

      - name: Lint Helm Charts
        run: |
          echo "Linting Helm charts in: ${{ inputs.fleet-paths }}"
          ERRORS=0

          for dir in $(echo "${{ inputs.fleet-paths }}" | tr ' ' '\n' | while read p; do echo "$p"/*; done); do
            if [ -f "$dir/Chart.yaml" ]; then
              echo "Linting $dir..."
              if ! helm lint "$dir"; then
                echo "ERROR: Helm lint failed for $dir"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS Helm chart errors"
            exit 1
          fi

          echo "All Helm charts validated successfully!"

  validate-helm-template:
    name: Validate Rendered Helm Output
    needs: [validate-yaml]
    if: >-
      always() && !failure() && !cancelled()
      && inputs.enable-helm-template-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v${{ inputs.helm-version }}

      - name: Install kubeconform
        uses: sbaerlocher/.github/.github/actions/install-kubeconform@2026-07-19
        with:
          version: ${{ inputs.kubeconform-version }}

      - name: Render charts and validate with kubeconform
        env:
          FLEET_PATHS: ${{ inputs.fleet-paths }}
          STRICT: ${{ inputs.k8s-validation-strict }}
        run: |
          set -euo pipefail
          echo "Rendering Helm charts and validating with kubeconform..."
          ERRORS=0
          RENDERED=0

          for dir in $(echo "${FLEET_PATHS}" | tr ' ' '\n' | while read -r p; do echo "$p"/*; done); do
            [ -f "$dir/Chart.yaml" ] || continue
            RENDERED=$((RENDERED + 1))
            echo "Rendering $dir..."

            # Vendor declared chart dependencies first; `helm template`
            # hard-fails on missing dependencies, unlike `helm lint` which
            # only warns. Best-effort: charts without dependencies are a no-op.
            if grep -q "^dependencies:" "$dir/Chart.yaml" 2>/dev/null; then
              helm dependency build "$dir" || {
                echo "::warning::helm dependency build failed for $dir — render may be incomplete"
              }
            fi

            # Charts that `required`-guard secret values (e.g.
            # `database.existingSecret`) cannot render from values.yaml
            # defaults alone — the guard aborts the template. Honour a
            # conventional CI values file in the chart dir if present, so the
            # chart renders with placeholder secret names without weakening
            # the production guard. First match wins; absence is a no-op so
            # charts that render from defaults are unaffected.
            VALUES_ARGS=()
            for vf in values-test.yaml ci-values.yaml values-ci.yaml; do
              if [ -f "$dir/$vf" ]; then
                echo "Using values override $dir/$vf"
                VALUES_ARGS=(-f "$dir/$vf")
                break
              fi
            done

            # `helm template` resolves values + templates; kubeconform then
            # validates the *rendered* objects against the K8s schemas.
            # -ignore-missing-schemas tolerates CRDs without published schemas.
            if ! helm template "$dir" "${VALUES_ARGS[@]}" \
                | kubeconform -summary -strict -ignore-missing-schemas -output text; then
              echo "ERROR: rendered manifests from $dir failed kubeconform"
              ERRORS=$((ERRORS + 1))
            fi
          done

          echo "Rendered $RENDERED chart(s)."
          if [ "$STRICT" = "true" ] && [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS chart(s) with invalid rendered manifests"
            exit 1
          fi
          if [ $ERRORS -gt 0 ]; then
            echo "::warning::$ERRORS chart(s) had invalid rendered manifests (non-strict mode)"
          fi

  validate-kubernetes:
    name: Validate Kubernetes Manifests
    needs: [validate-yaml]
    if: >-
      always() && !failure() && !cancelled()
      && inputs.enable-k8s-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install kubeconform
        uses: sbaerlocher/.github/.github/actions/install-kubeconform@2026-07-19
        with:
          version: ${{ inputs.kubeconform-version }}

      - name: Validate Kubernetes manifests
        env:
          FLEET_PATHS: ${{ inputs.fleet-paths }}
          STRICT: ${{ inputs.k8s-validation-strict }}
        run: |
          set -euo pipefail
          echo "Validating Kubernetes manifests with kubeconform..."

          mapfile -t manifests < <(
            find ${FLEET_PATHS} \( -name '*.yaml' -o -name '*.yml' \) \
              ! -name 'fleet.yaml' \
              | grep -E '/(templates|manifests)/' \
              || true
          )

          if [ ${#manifests[@]} -eq 0 ]; then
            echo "::notice::No Kubernetes manifests found under: ${FLEET_PATHS}"
            exit 0
          fi

          if [ "$STRICT" = "true" ]; then
            kubeconform -summary -output json -ignore-missing-schemas "${manifests[@]}"
          else
            kubeconform -summary -output json -ignore-missing-schemas "${manifests[@]}" || true
          fi

  check-documentation:
    name: Check Documentation
    needs: [validate-yaml]
    if: >-
      always() && !failure() && !cancelled()
      && inputs.enable-docs-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check required documentation
        run: |
          ERRORS=0

          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md not found!"
            ERRORS=$((ERRORS + 1))
          fi

          if [ ! -f "DEPLOYMENT.md" ]; then
            echo "ERROR: DEPLOYMENT.md not found!"
            ERRORS=$((ERRORS + 1))
          fi

          if [ $ERRORS -gt 0 ]; then
            echo "Missing required documentation files"
            exit 1
          fi

          echo "All required documentation files present!"

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        validate-yaml,
        validate-fleet-configs,
        validate-gitrepo,
        validate-helm,
        validate-helm-template,
        validate-kubernetes,
        check-documentation,
      ]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## GitOps Validation Summary"
          echo ""
          echo "All validation checks completed!"
          echo ""
          echo "Please review any warnings above before merging."

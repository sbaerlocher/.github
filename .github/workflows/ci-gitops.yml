name: Continuous Integration - GitOps

# Reusable workflow for GitOps repositories using Fleet, Helm, and Kubernetes.
# Validates YAML syntax, Fleet configuration, GitRepo paths, Helm charts, and
# Kubernetes manifests via kubeconform.

on:
  workflow_call:
    inputs:
      python-version:
        description: |
          Python version used by both `validate-yaml` (yamllint) and
          `validate-python` (pytest). Shared deliberately — one interpreter per
          repo — so bumping it moves the test runner too.
        type: string
        required: false
        default: '3.14'
      helm-version:
        description: 'Helm version'
        type: string
        required: false
        default: '4.1.3'
      kubeconform-version:
        description: 'kubeconform version (without v prefix)'
        type: string
        required: false
        # renovate: datasource=github-releases depName=yannh/kubeconform extractVersion=^v(?<version>.+)$
        default: '0.8.0'
      enable-yaml-lint:
        description: 'Run YAML syntax validation'
        type: boolean
        required: false
        default: true
      enable-fleet-validation:
        description: 'Validate Fleet bundle configuration'
        type: boolean
        required: false
        default: true
      enable-gitrepo-validation:
        description: 'Validate GitRepo paths'
        type: boolean
        required: false
        default: true
      gitrepo-file:
        description: |
          Path to the Fleet GitRepo manifest whose `paths:` are validated.
          Used in the step conditions and the grep, so the location is stated
          once instead of being repeated per call site.

          A single literal path — globs are not supported. `hashFiles()` reads
          the value as a pattern while `grep` reads it as a filename, so a
          wildcard would pass the existence gate and then fail in the shell.
          The value is also echoed into a `::notice::`, so pass static caller
          configuration only, never event-controlled data.
        type: string
        required: false
        default: 'gitrepos/production.yaml'
      require-gitrepo-file:
        description: |
          Fail the job when `gitrepo-file` is absent. Default `false` treats a
          missing manifest as "nothing to validate", which is correct for repos
          whose GitRepo resources are provisioned elsewhere. Set to `true` in
          repos whose Fleet deployment hangs off the manifest, so renaming or
          deleting it turns the job red instead of passing with a notice.

          Enforced by a step inside `validate-gitrepo`, so it requires
          `enable-gitrepo-validation: true` — with the job disabled this input
          is inert and a missing manifest still reports green.
        type: boolean
        required: false
        default: false
      enable-helm-lint:
        description: 'Lint Helm charts'
        type: boolean
        required: false
        default: true
      enable-helm-template-validation:
        description: >-
          Render each Helm chart with `helm template` and validate the
          rendered manifests with kubeconform. Catches values/render errors
          that `helm lint` and static-manifest kubeconform miss.
        type: boolean
        required: false
        default: true
      enable-k8s-validation:
        description: 'Validate Kubernetes manifests with kubeconform'
        type: boolean
        required: false
        default: true
      yaml-lint-strict:
        description: 'Fail the job when yamllint reports any issue'
        type: boolean
        required: false
        default: true
      k8s-validation-strict:
        description: 'Fail the job when kubeconform reports invalid manifests'
        type: boolean
        required: false
        default: true
      enable-docs-check:
        description: 'Check for required documentation files'
        type: boolean
        required: false
        default: true
      enable-python-tests:
        description: |
          Run the repository's pytest suite.

          Defaults to `false`, unlike the other `enable-*` inputs here: the job
          was added after the fact, so enabling it by default would hand every
          existing caller a job it never asked for, and a repo without Python
          tests would go red on nothing but the upgrade. Opt in per caller.
        type: boolean
        required: false
        default: false
      python-test-paths:
        description: |
          Space-separated paths to search for tests.
          Expanded unquoted so the separate paths survive word splitting —
          pass static caller configuration only, never event-controlled data.
        type: string
        required: false
        default: 'scripts'
      python-test-requirements:
        description: |
          Space-separated pip requirements installed before the tests run.
          Expanded unquoted so the separate requirements survive word splitting —
          pass static caller configuration only, never event-controlled data.

          A plain list rather than a requirements file: the consumers have no
          `pyproject.toml`, `requirements*.txt` or `pytest.ini` to point at.
        type: string
        required: false
        default: 'pytest pyyaml'
      allow-no-python-tests:
        description: |
          Treat "no tests collected" (pytest exit 5) as success instead of a
          failure. Default `false`: a caller that sets `enable-python-tests`
          asserts the suite exists, so an empty collection is a configuration
          error — a renamed test file or a broken `conftest.py` would otherwise
          report green, which is the silent pass this job exists to close.

          Same "nothing to validate" question as `require-gitrepo-file`, and
          resolved the same way: strict by default, tolerance is opt-in.
        type: boolean
        required: false
        default: false
      fleet-paths:
        description: |
          Space-separated paths to search for fleet.yaml files.
          Expanded unquoted so the separate paths survive word splitting —
          pass static caller configuration only, never event-controlled data.
        type: string
        required: false
        default: 'platform applications'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

permissions:
  contents: read

jobs:
  validate-yaml:
    name: Validate YAML Syntax
    if: inputs.enable-yaml-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-yamllint
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate YAML files
        env:
          STRICT: ${{ inputs.yaml-lint-strict }}
          # Unquoted at the call sites below so `-c <file>` splits into two
          # argv words; keep it that way. Value is a build-time constant.
          YAMLLINT_CONFIG_ARG: ${{ hashFiles('.yamllint.yml') != '' && '-c .yamllint.yml' || '' }}
        run: |
          set -euo pipefail
          if [ ! -f .yamllint.yml ]; then
            echo "::warning::.yamllint.yml not found - using default config"
          fi
          # -print0 / xargs -0 to survive paths with spaces
          if [ "$STRICT" = "true" ]; then
            # shellcheck disable=SC2086  # must split into `-c <file>`; see env: above
            find . \( -name '*.yaml' -o -name '*.yml' \) -print0 \
              | xargs -0 yamllint ${YAMLLINT_CONFIG_ARG} -f parsable
          else
            # shellcheck disable=SC2086  # must split into `-c <file>`; see env: above
            find . \( -name '*.yaml' -o -name '*.yml' \) -print0 \
              | xargs -0 yamllint ${YAMLLINT_CONFIG_ARG} -f parsable || true
          fi

  validate-fleet-configs:
    name: Validate Fleet Configurations
    # Gate behind validate-yaml. The gate is conditional (enable-yaml-lint), so
    # the always()/!failure()/!cancelled() guard runs this job when the gate
    # succeeds OR is skipped, and blocks only on a gate failure.
    needs: [validate-yaml]
    if: >-
      always() && !failure() && !cancelled()
      && inputs.enable-fleet-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check fleet.yaml files exist
        env:
          FLEET_PATHS: ${{ inputs.fleet-paths }}
        run: |
          echo "Checking for fleet.yaml files in: ${FLEET_PATHS}"
          # shellcheck disable=SC2086  # fleet-paths is a space-separated list and
          # must split into several find arguments.
          FLEET_FILES=$(find ${FLEET_PATHS} -name "fleet.yaml" 2>/dev/null | wc -l)
          echo "Found $FLEET_FILES fleet.yaml files"

          if [ "$FLEET_FILES" -eq 0 ]; then
            echo "ERROR: No fleet.yaml files found!"
            exit 1
          fi

      - name: Validate fleet.yaml structure
        env:
          FLEET_PATHS: ${{ inputs.fleet-paths }}
        run: |
          echo "Validating fleet.yaml files..."
          ERRORS=0

          # `while read` over `find -print0` instead of `for file in $(find ...)`:
          # word-splitting breaks on paths containing spaces. Process substitution
          # rather than a pipe so the ERRORS increments stay in this shell.
          while IFS= read -r -d '' file; do
            echo "Checking $file..."

            if ! grep -q "defaultNamespace:" "$file"; then
              echo "WARNING: $file missing defaultNamespace field"
            fi

            if grep -q "^helm:" "$file"; then
              if grep -q "  chart:" "$file"; then
                if ! grep -q "  version:" "$file"; then
                  echo "ERROR: $file has helm chart but missing version field"
                  ERRORS=$((ERRORS + 1))
                fi
                if ! grep -q "  repo:" "$file"; then
                  if ! grep -q "  chart: oci://" "$file"; then
                    echo "WARNING: $file has helm chart but missing repo field (unless using OCI)"
                  fi
                fi
              else
                echo "INFO: $file uses helm lifecycle options for plain manifests"
              fi
            fi
          done < <(
            # shellcheck disable=SC2086  # fleet-paths is a space-separated list
            # and must split into several find arguments.
            find ${FLEET_PATHS} -name "fleet.yaml" -print0 2>/dev/null
          )

          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS errors in fleet.yaml files"
            exit 1
          fi

          echo "All fleet.yaml files validated successfully!"

  validate-gitrepo:
    name: Validate GitRepo Configuration
    needs: [validate-yaml]
    if: >-
      always() && !failure() && !cancelled()
      && inputs.enable-gitrepo-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require GitRepo configuration
        if: inputs.require-gitrepo-file && hashFiles(inputs.gitrepo-file) == ''
        env:
          GITREPO_FILE: ${{ inputs.gitrepo-file }}
        run: |
          # First line only, same reasoning as the notice step below.
          echo "ERROR: ${GITREPO_FILE%%$'\n'*} not found, but require-gitrepo-file is true"
          exit 1

      - name: Report missing GitRepo configuration
        if: >-
          !inputs.require-gitrepo-file
          && hashFiles(inputs.gitrepo-file) == ''
        env:
          GITREPO_FILE: ${{ inputs.gitrepo-file }}
        run: |
          # First line only: the runner parses any stdout line starting with
          # `::` as a workflow command, so a newline in the value could smuggle
          # a second one into this notice.
          echo "::notice::${GITREPO_FILE%%$'\n'*} not found - skipping GitRepo validation"

      - name: Validate GitRepo paths
        if: hashFiles(inputs.gitrepo-file) != ''
        env:
          GITREPO_FILE: ${{ inputs.gitrepo-file }}
        run: |
          set -euo pipefail
          echo "Validating GitRepo paths..."
          ERRORS=0

          # hashFiles() above matched a pattern; grep below needs a real file.
          # A glob or an unreadable path would otherwise die mid-pipeline with
          # a bare "No such file or directory".
          if [ ! -f "${GITREPO_FILE}" ]; then
            echo "ERROR: ${GITREPO_FILE%%$'\n'*} is not a readable file"
            echo "gitrepo-file takes a single literal path, not a glob"
            exit 1
          fi

          # Line heuristic, not a YAML parser: it reads at most 100 lines after
          # the first `paths:`. Any indentation is accepted, because a YAML
          # sequence may sit at its parent's level — `paths:` followed by
          # `  - platform` is what Rancher's own GitRepo examples use, and
          # anchoring on four spaces would silently skip it. `|| true` keeps a
          # non-match from tripping `pipefail`, so an empty result is judged
          # below instead of aborting the step without a message.
          PATHS=$(grep -A 100 "paths:" "${GITREPO_FILE}" | grep -E "^ +- " | sed -E 's/^ +- //' || true)

          # No paths is not an error: `spec.paths` is optional in Fleet, and
          # omitting it means "scan the repository root". Warn instead, so the
          # case stays visible without failing manifests that rely on it.
          if [ -z "${PATHS}" ]; then
            echo "::warning::No paths parsed from ${GITREPO_FILE%%$'\n'*}"
            echo "Either the manifest declares no 'paths:' (Fleet then scans the"
            echo "repository root), or its entries sit beyond the 100-line window."
          fi

          # Read loop instead of `mapfile -t`, which is a bash-4 builtin: the
          # runner is bash 5, but the neighbouring loops in this file avoid it
          # for portability and this one stays consistent with them. Quoting
          # the expansion is the load-bearing part — it keeps a path containing
          # spaces one entry instead of splitting it into phantom ones.
          # `${paths[@]+…}` guards the empty-array case, which `set -u` rejects
          # on bash < 4.4.
          paths=()
          if [ -n "${PATHS}" ]; then
            while IFS= read -r path; do
              paths+=("$path")
            done <<< "${PATHS}"
          fi

          for path in ${paths[@]+"${paths[@]}"}; do
            if [ ! -d "$path" ]; then
              echo "WARNING: Path $path in GitRepo does not exist"
            elif [ ! -f "$path/fleet.yaml" ]; then
              echo "ERROR: Path $path in GitRepo missing fleet.yaml"
              ERRORS=$((ERRORS + 1))
            else
              echo "✓ $path"
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS errors in GitRepo configuration"
            exit 1
          fi

          echo "GitRepo configuration validated successfully!"

  validate-helm:
    name: Validate Helm Charts
    needs: [validate-yaml]
    if: >-
      always() && !failure() && !cancelled()
      && inputs.enable-helm-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v${{ inputs.helm-version }}

      - name: Cache Helm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/helm
          key: ${{ runner.os }}-helm-${{ hashFiles('**/Chart.yaml') }}
          restore-keys: |
            ${{ runner.os }}-helm-

      - name: Lint Helm Charts
        env:
          FLEET_PATHS: ${{ inputs.fleet-paths }}
        run: |
          echo "Linting Helm charts in: ${FLEET_PATHS}"
          ERRORS=0

          # `read -a` + quoted nested glob instead of `$(… | tr | while read)`:
          # the old form pushed the glob result back through unquoted command
          # substitution, so a chart directory whose name contains a space was
          # split into bogus entries and silently skipped. fleet-paths itself
          # stays space-separated, hence `read -a` rather than a quoted expansion.
          read -r -a FLEET_DIRS <<<"${FLEET_PATHS}"
          for base in "${FLEET_DIRS[@]}"; do
            for dir in "$base"/*; do
              if [ -f "$dir/Chart.yaml" ]; then
                echo "Linting $dir..."
                if ! helm lint "$dir"; then
                  echo "ERROR: Helm lint failed for $dir"
                  ERRORS=$((ERRORS + 1))
                fi
              fi
            done
          done

          if [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS Helm chart errors"
            exit 1
          fi

          echo "All Helm charts validated successfully!"

  validate-helm-template:
    name: Validate Rendered Helm Output
    needs: [validate-yaml]
    if: >-
      always() && !failure() && !cancelled()
      && inputs.enable-helm-template-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v${{ inputs.helm-version }}

      - name: Install kubeconform
        uses: sbaerlocher/.github/.github/actions/install-kubeconform@2026-08-02
        with:
          version: ${{ inputs.kubeconform-version }}

      - name: Render charts and validate with kubeconform
        env:
          FLEET_PATHS: ${{ inputs.fleet-paths }}
          STRICT: ${{ inputs.k8s-validation-strict }}
        run: |
          set -euo pipefail
          echo "Rendering Helm charts and validating with kubeconform..."
          ERRORS=0
          RENDERED=0

          # Same shape as the helm lint loop above: `read -a` + nested glob so a
          # chart directory containing a space is not split into bogus entries.
          read -r -a FLEET_DIRS <<<"${FLEET_PATHS}"
          for base in "${FLEET_DIRS[@]}"; do
            for dir in "$base"/*; do
              [ -f "$dir/Chart.yaml" ] || continue
              RENDERED=$((RENDERED + 1))
              echo "Rendering $dir..."

              # Vendor declared chart dependencies first; `helm template`
              # hard-fails on missing dependencies, unlike `helm lint` which
              # only warns. Best-effort: charts without dependencies are a no-op.
              if grep -q "^dependencies:" "$dir/Chart.yaml" 2>/dev/null; then
                helm dependency build "$dir" || {
                  echo "::warning::helm dependency build failed for $dir — render may be incomplete"
                }
              fi

              # Charts that `required`-guard secret values (e.g.
              # `database.existingSecret`) cannot render from values.yaml
              # defaults alone — the guard aborts the template. Honour a
              # conventional CI values file in the chart dir if present, so the
              # chart renders with placeholder secret names without weakening
              # the production guard. First match wins; absence is a no-op so
              # charts that render from defaults are unaffected.
              VALUES_ARGS=()
              for vf in values-test.yaml ci-values.yaml values-ci.yaml; do
                if [ -f "$dir/$vf" ]; then
                  echo "Using values override $dir/$vf"
                  VALUES_ARGS=(-f "$dir/$vf")
                  break
                fi
              done

              # `helm template` resolves values + templates; kubeconform then
              # validates the *rendered* objects against the K8s schemas.
              # -ignore-missing-schemas tolerates CRDs without published schemas.
              if ! helm template "$dir" "${VALUES_ARGS[@]}" \
                  | kubeconform -summary -strict -ignore-missing-schemas -output text; then
                echo "ERROR: rendered manifests from $dir failed kubeconform"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done

          echo "Rendered $RENDERED chart(s)."
          if [ "$STRICT" = "true" ] && [ $ERRORS -gt 0 ]; then
            echo "Found $ERRORS chart(s) with invalid rendered manifests"
            exit 1
          fi
          if [ $ERRORS -gt 0 ]; then
            echo "::warning::$ERRORS chart(s) had invalid rendered manifests (non-strict mode)"
          fi

  validate-kubernetes:
    name: Validate Kubernetes Manifests
    needs: [validate-yaml]
    if: >-
      always() && !failure() && !cancelled()
      && inputs.enable-k8s-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kubeconform
        uses: sbaerlocher/.github/.github/actions/install-kubeconform@2026-08-02
        with:
          version: ${{ inputs.kubeconform-version }}

      - name: Validate Kubernetes manifests
        env:
          FLEET_PATHS: ${{ inputs.fleet-paths }}
          STRICT: ${{ inputs.k8s-validation-strict }}
        run: |
          set -euo pipefail
          echo "Validating Kubernetes manifests with kubeconform..."

          # Read loop instead of `mapfile -t`: mapfile is a bash-4 builtin and
          # macOS still ships bash 3.2 as /bin/bash, so the block would break
          # the moment it runs outside ubuntu-latest. The explicit `manifests=()`
          # also keeps `${#manifests[@]}` defined under `set -u` when the find
          # produces no output.
          # Newline-delimited rather than the `-print0` form used for fleet.yaml
          # above: the path segment filter is a `grep -E`, which would need
          # `grep -zE` to stay NUL-clean. Manifest paths come from the repo tree,
          # so only a newline in a filename would break this — spaces are safe.
          manifests=()
          while IFS= read -r manifest; do
            manifests+=("$manifest")
          done < <(
            # shellcheck disable=SC2086  # fleet-paths is a space-separated list
            # and must split into several find arguments.
            find ${FLEET_PATHS} \( -name '*.yaml' -o -name '*.yml' \) \
              ! -name 'fleet.yaml' \
              | grep -E '/(templates|manifests)/' \
              || true
          )

          if [ ${#manifests[@]} -eq 0 ]; then
            echo "::notice::No Kubernetes manifests found under: ${FLEET_PATHS}"
            exit 0
          fi

          if [ "$STRICT" = "true" ]; then
            kubeconform -summary -output json -ignore-missing-schemas "${manifests[@]}"
          else
            kubeconform -summary -output json -ignore-missing-schemas "${manifests[@]}" || true
          fi

  check-documentation:
    name: Check Documentation
    needs: [validate-yaml]
    if: >-
      always() && !failure() && !cancelled()
      && inputs.enable-docs-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check required documentation
        run: |
          ERRORS=0

          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md not found!"
            ERRORS=$((ERRORS + 1))
          fi

          if [ ! -f "DEPLOYMENT.md" ]; then
            echo "ERROR: DEPLOYMENT.md not found!"
            ERRORS=$((ERRORS + 1))
          fi

          if [ $ERRORS -gt 0 ]; then
            echo "Missing required documentation files"
            exit 1
          fi

          echo "All required documentation files present!"

  validate-python:
    name: Validate Python Tests
    # Gate behind validate-yaml, like the other post-YAML jobs: the gate is
    # conditional, so always()/!failure()/!cancelled() runs this job when the
    # gate succeeds OR is skipped, and blocks only on a gate failure.
    needs: [validate-yaml]
    if: >-
      always() && !failure() && !cancelled()
      && inputs.enable-python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          # The requirements list is part of the key: the target repos have no
          # requirements file, so a hashFiles()-only key would collapse to one
          # constant for every caller — and cache entries are immutable, so the
          # first run's entry would be pinned forever while two callers with
          # different requirements shared it.
          key: >-
            ${{ runner.os }}-pip-pytest-${{
              hashFiles('**/requirements*.txt', '**/pyproject.toml')
            }}-${{ inputs.python-test-requirements }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install test requirements
        env:
          # Unquoted at the call site below so the separate requirements split
          # into argv words; see the input description.
          REQUIREMENTS: ${{ inputs.python-test-requirements }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # must split into one word per requirement
          pip install ${REQUIREMENTS}

      - name: Run pytest
        env:
          # Same word-splitting contract as above.
          TEST_PATHS: ${{ inputs.python-test-paths }}
          ALLOW_NO_TESTS: ${{ inputs.allow-no-python-tests }}
          # `-q` keeps the log readable; failures print in full regardless.
          PYTEST_ADDOPTS: '-q'
        run: |
          set -euo pipefail
          # Empty or whitespace-only word-splits to nothing, which would leave a
          # bare `pytest` collecting the whole checkout instead of the given
          # paths. `set -u` does not catch it — empty is not unset.
          if [ -z "${TEST_PATHS//[[:space:]]/}" ]; then
            echo "::error::python-test-paths is empty; pass at least one path"
            exit 1
          fi
          # A path that does not exist is a caller configuration error, not
          # "nothing to test" — pytest would exit 4 with a usage error that
          # reads like an infrastructure fault. Say so plainly instead.
          # `${path}` needs no newline guard below: it comes out of default-IFS
          # word splitting, which cannot leave a newline inside it.
          for path in ${TEST_PATHS}; do
            if [ ! -e "$path" ]; then
              echo "::error::python-test-paths entry not found: ${path}"
              exit 1
            fi
          done
          set +e
          # shellcheck disable=SC2086  # must split into one word per path
          python3 -m pytest ${TEST_PATHS}
          status=$?
          set -e
          # Collecting nothing exits 5. Strict by default: the paths above all
          # exist, so an empty collection means the tests stopped being found
          # (renamed file, broken conftest.py), not that there are none.
          if [ "$status" -eq 5 ]; then
            if [ "$ALLOW_NO_TESTS" = "true" ]; then
              # Unsplit value reaching a `::` sink: strip at the first newline
              # so it cannot smuggle a second workflow command, as the
              # gitrepo-file notices in this file do.
              echo "::notice::No tests collected under: ${TEST_PATHS%%$'\n'*}"
              exit 0
            fi
            echo "::error::No tests collected under: ${TEST_PATHS%%$'\n'*}"
            echo "::error::Set allow-no-python-tests to treat this as success."
            exit 1
          fi
          exit "$status"

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        validate-yaml,
        validate-fleet-configs,
        validate-gitrepo,
        validate-helm,
        validate-helm-template,
        validate-kubernetes,
        check-documentation,
        validate-python,
      ]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## GitOps Validation Summary"
          echo ""
          echo "All validation checks completed!"
          echo ""
          echo "Please review any warnings above before merging."

---
name: Release - Go

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        required: false
        default: '1.25'
        description: 'Go version to use'
      goreleaser-version:
        type: string
        required: false
        default: '~> v2'
        description: 'GoReleaser version'
      goreleaser-args:
        type: string
        required: false
        default: 'release --clean'
        description: 'GoReleaser arguments'
      working-directory:
        type: string
        required: false
        default: '.'
        description: 'Working directory'
      pre-build-commands:
        type: string
        required: false
        default: ''
        description: 'Commands to run before GoReleaser (e.g. code generation)'
      extra-env:
        type: string
        required: false
        default: ''
        description: 'Additional environment variables (multiline, KEY=VALUE format)'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Cache Go build artifacts
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Run pre-build commands
        if: inputs.pre-build-commands != ''
        run: ${{ inputs.pre-build-commands }}

      - name: Parse extra environment variables
        if: inputs.extra-env != ''
        env:
          EXTRA_ENV: ${{ inputs.extra-env }}
        run: |
          echo "$EXTRA_ENV" >> "$GITHUB_ENV"

      - name: Create release with GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7
        with:
          distribution: goreleaser
          version: ${{ inputs.goreleaser-version }}
          args: ${{ inputs.goreleaser-args }}
          workdir: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        continue-on-error: false

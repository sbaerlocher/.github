---
name: Release - Go

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        required: false
        default: '1.25'
        description: 'Go version to use'
      goreleaser-version:
        type: string
        required: false
        default: '~> v2'
        description: 'GoReleaser version'
      goreleaser-args:
        type: string
        required: false
        default: 'release --clean'
        description: 'GoReleaser arguments'
      working-directory:
        type: string
        required: false
        default: '.'
        description: 'Working directory'
      extra-env:
        type: string
        required: false
        default: ''
        description: 'Additional environment variables (multiline, KEY=VALUE format)'
      cancel-in-progress:
        type: boolean
        required: false
        default: false
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  contents: write
  packages: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  goreleaser:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Cache Go build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Parse extra environment variables
        if: inputs.extra-env != ''
        env:
          EXTRA_ENV: ${{ inputs.extra-env }}
        run: |
          set -euo pipefail
          # $GITHUB_ENV is line-based, and `extra-env` is a multi-line list,
          # so its own newlines are legitimate separators rather than
          # injection. What is checked is the shape of each line: a line that
          # is neither a `KEY=VALUE` assignment nor part of a `NAME<<DELIM`
          # block is not an entry the caller could have declared, and a CR
          # splits the entry on the runner's .NET-side line reader.
          #
          # The delimiter form documented for $GITHUB_ENV is accepted, since
          # it is how a caller passes a multi-line ldflags block or a JSON
          # blob. Inside such a block the body is opaque by definition and is
          # not validated — only the terminator is required, and a body line
          # equal to the delimiter closes the block, exactly as the runner
          # reads it.
          delim=''
          while IFS= read -r line; do
            if [ "$line" != "${line//$'\r'/}" ]; then
              echo "Error: extra-env lines must not contain a CR byte" >&2
              exit 1
            fi
            if [ -n "$delim" ]; then
              [ "$line" = "$delim" ] && delim=''
              continue
            fi
            [ -z "$line" ] && continue
            case "$line" in
            [A-Za-z_]*'<<'* | [A-Za-z_]*=*)
              # Both `=` and `<<` may appear in one line; whichever comes first
              # decides the form, the way the runner's own reader resolves it.
              # Letting arm order decide instead would send an assignment whose
              # value contains `<<` (`CGO_CFLAGS=-DSHIFT=1<<3`) down the
              # delimiter path. `${line%%<<*}` is the text before the delimiter,
              # so an `=` in it means the assignment came first.
              case "${line%%<<*}" in
              "$line" | *=*)
                name=${line%%=*}
                ;;
              *)
                name=${line%%<<*}
                delim=${line#*<<}
                if [ -z "$delim" ]; then
                  echo "Error: extra-env delimiter block has an empty delimiter" >&2
                  exit 1
                fi
                ;;
              esac
              if [ "$name" != "${name//[^A-Za-z0-9_]/}" ]; then
                echo "Error: extra-env name is not a valid identifier: $name" >&2
                exit 1
              fi
              ;;
            *)
              echo "Error: extra-env lines must be KEY=VALUE assignments" >&2
              exit 1
              ;;
            esac
          done <<< "$EXTRA_ENV"
          if [ -n "$delim" ]; then
            echo "Error: extra-env has an unterminated $delim block" >&2
            exit 1
          fi
          echo "$EXTRA_ENV" >> "$GITHUB_ENV"

      - name: Create release with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ inputs.goreleaser-version }}
          args: ${{ inputs.goreleaser-args }}
          workdir: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        continue-on-error: false

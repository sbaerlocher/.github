---
name: Release - Go

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        required: false
        default: '1.25'
        description: 'Go version to use'
      goreleaser-version:
        type: string
        required: false
        default: '~> v2'
        description: 'GoReleaser version'
      goreleaser-args:
        type: string
        required: false
        default: 'release --clean'
        description: 'GoReleaser arguments'
      working-directory:
        type: string
        required: false
        default: '.'
        description: 'Working directory'
      pre-build-commands:
        type: string
        required: false
        default: ''
        description: 'Commands to run before GoReleaser (e.g. code generation)'
      extra-env:
        type: string
        required: false
        default: ''
        description: 'Additional environment variables (multiline, KEY=VALUE format)'
      cancel-in-progress:
        type: boolean
        required: false
        default: false
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  contents: write
  packages: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  goreleaser:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Cache Go build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Run pre-build commands
        if: inputs.pre-build-commands != ''
        run: ${{ inputs.pre-build-commands }}

      - name: Parse extra environment variables
        if: inputs.extra-env != ''
        env:
          EXTRA_ENV: ${{ inputs.extra-env }}
        run: |
          set -euo pipefail
          # $GITHUB_ENV is line-based, and `extra-env` is a multi-line
          # KEY=VALUE list, so its own newlines are legitimate separators
          # rather than injection. What has to be rejected is a line that is
          # not a KEY=VALUE assignment: a value carrying a CR splits the
          # entry on the runner's .NET-side line reader, and a line without a
          # `=` or with a name that is not a shell identifier is not an
          # assignment the caller could have meant. Either way the entry
          # reaching every following step is not the one that was declared.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if [ "$line" != "${line//$'\r'/}" ]; then
              echo "Error: extra-env lines must not contain a CR byte" >&2
              exit 1
            fi
            case "$line" in
            [A-Za-z_]*=*)
              name=${line%%=*}
              if [ "$name" != "${name//[^A-Za-z0-9_]/}" ]; then
                echo "Error: extra-env name is not a valid identifier: $name" >&2
                exit 1
              fi
              ;;
            *)
              echo "Error: extra-env lines must be KEY=VALUE assignments" >&2
              exit 1
              ;;
            esac
          done <<< "$EXTRA_ENV"
          echo "$EXTRA_ENV" >> "$GITHUB_ENV"

      - name: Create release with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ inputs.goreleaser-version }}
          args: ${{ inputs.goreleaser-args }}
          workdir: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        continue-on-error: false

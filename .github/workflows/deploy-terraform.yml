---
name: Deploy - Terraform

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: 'ubuntu-latest'
        description: >-
          Single runner label for all jobs in this workflow (e.g.
          `ubuntu-latest`, `self-hosted`). Runner groups and multi-label
          selectors are not supported.
      mode:
        type: string
        required: false
        default: 'deploy'
        description: 'Operation mode: deploy (plan+apply) or drift (plan only)'
      terraform-version:
        type: string
        required: false
        default: '1.14.3'
        description: 'Terraform version to use'
      environment:
        type: string
        required: true
        description: 'Terraform workspace and var-file name (e.g. nuvulus)'
      project-name:
        type: string
        required: true
        description: 'Project identifier for concurrency group and deployment ID'
      parallelism:
        type: number
        required: false
        default: 10
        description: 'Terraform plan/apply parallelism'
      working-directory:
        type: string
        required: false
        default: '.'
        description: 'Directory containing Terraform configuration'
      bw-secrets:
        type: string
        required: true
        description: |
          Bitwarden secrets in sm-action format (one per line).
          Must include R2_ACCESS_KEY and R2_SECRET_KEY for backend.
          Example:
            a283f534-bda6-4ac2-972a-b3c201812348 > R2_ACCESS_KEY
            0bf3fadc-9d2f-4246-be0d-b3c201812711 > R2_SECRET_KEY
      env-mapping:
        type: string
        required: false
        default: ''
        description: |
          Maps Bitwarden env vars to Terraform/runtime variables.
          Format: SOURCE_VAR > TARGET_VAR (one per line)
          Example:
            AUTHENTIK_TOKEN > TF_VAR_authentik_token
            GRAFANA_TOKEN > TF_VAR_grafana_token
      init-flag:
        type: string
        required: false
        default: '-upgrade'
        description: 'Terraform init migration flag: -upgrade or -reconfigure'
      timeout-minutes:
        type: number
        required: false
        default: 45
        description: 'Job-level timeout in minutes'
      apply-timeout-minutes:
        type: number
        required: false
        default: 25
        description: 'Timeout for terraform apply in minutes'
      apply-retries:
        type: number
        required: false
        default: 1
        description: 'Number of attempts for init and apply'
      should-apply:
        type: string
        required: false
        default: 'true'
        description: 'DEPRECATED: Use mode instead. Whether to run terraform apply (true/false)'
      pre-script:
        type: string
        required: false
        default: ''
        description: |
          Optional trusted bash script to run before Terraform init.
          Useful for generating dynamic credentials (e.g., Tailscale API key from OAuth).
          This input executes as shell code and must only be set by trusted
          caller workflows, never from PR-controlled data.
          Script has access to all env vars from bw-secrets and env-mapping.
          Export vars as: echo "VAR_NAME=value" >> "$GITHUB_ENV"
      cancel-in-progress:
        type: boolean
        required: false
        default: false
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default `false` matches deploy semantics. Set `true` for drift /
          scan use-cases where the latest invocation supersedes the previous.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group, e.g. "drift",
          to separate concurrency from the deploy path while sharing the same
          project-name + environment scope. Empty default preserves the
          original group name for backward compatibility.
    outputs:
      plan_outcome:
        description: 'Plan result: no-changes, has-changes, or error'
        value: ${{ jobs.deploy.outputs.plan_outcome }}
      apply_outcome:
        description: 'Apply result: success, failed, or skipped'
        value: ${{ jobs.deploy.outputs.apply_outcome }}
      drift_detected:
        description: 'Whether drift was detected (drift mode only): true, false, or error'
        value: ${{ jobs.deploy.outputs.drift_detected }}
      drift_summary:
        description: |
          Value-free drift summary (drift mode only): one "<action> <address>"
          line per drifting resource, capped. Never contains attribute values.
          Empty string if no drift, not drift mode, or extraction failed.
        value: ${{ jobs.deploy.outputs.drift_summary }}
    secrets:
      BW_ACCESS_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: >-
        ${{ inputs.project-name }}-terraform-${{ inputs.environment }}${{
          inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
        }}
      cancel-in-progress: ${{ inputs.cancel-in-progress }}
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_CLI_ARGS: '-no-color'
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/${{ inputs.working-directory }}/.terraform
    outputs:
      plan_outcome: ${{ steps.plan.outputs.outcome }}
      apply_outcome: ${{ steps.apply.outputs.outcome }}
      drift_detected: ${{ steps.plan.outputs.drift_detected }}
      drift_summary: ${{ steps.drift_summary.outputs.summary }}

    steps:
      # Fork guard — fail fast BEFORE any checkout or Bitwarden retrieval.
      # This reusable pulls R2 + Authentik/Grafana secrets from Bitwarden. On
      # a `pull_request` from a forked repository, a malicious .tf change (or
      # provider/external hook) could exfiltrate those secrets during the plan
      # before a human reviews the diff. Same-repo PRs, push, schedule and
      # workflow_dispatch are unaffected (the condition is only ever true for
      # a fork-originated pull_request). The fork flag is consumed via env to
      # avoid interpolating event data directly into the shell.
      - name: 'Fork Guard'
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          echo "::error::deploy-terraform.yml refuses to run on a pull_request" \
               "from a fork ($HEAD_REPO): it would load R2/Authentik secrets" \
               "from Bitwarden before the diff is reviewed. Run plan/apply from" \
               "a branch in the base repository instead."
          exit 1

      - name: 'Repository Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Terraform Toolchain Setup'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: 'Terraform Cache Management'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ inputs.working-directory }}/.terraform/
          key: terraform-${{ runner.os }}-${{ inputs.terraform-version }}-${{ inputs.environment }}-${{ hashFiles('**/*.tf', '**/*.hcl', '.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-${{ inputs.terraform-version }}-${{ inputs.environment }}-
            terraform-${{ runner.os }}-${{ inputs.terraform-version }}-

      - name: 'Credential Retrieval'
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: ${{ inputs.bw-secrets }}

      - name: 'Environment Configuration'
        env:
          ENV_MAPPING: ${{ inputs.env-mapping }}
          BW_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}
        run: |
          # R2 backend credentials (always required). The token passes through
          # the environment rather than being interpolated, so a `$(...)` in it
          # is written as text instead of being evaluated here. That alone does
          # not make $GITHUB_ENV safe: the file is line-based, so a line break
          # inside a value would inject additional environment entries for
          # every following step. CR is rejected alongside LF, the same way as
          # in ci-go.yml — the runner reads the file on the .NET side, whose
          # line readers treat a lone CR as a terminator too.
          for value in "$R2_ACCESS_KEY" "$R2_SECRET_KEY" "$BW_TOKEN"; do
            if [ "$value" != "${value//[$'\n\r']/}" ]; then
              echo "Error: multi-line R2 or Bitwarden credentials are not supported" >&2
              exit 1
            fi
          done
          {
            echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY"
            echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_KEY"
            echo "BW_ACCESS_TOKEN=$BW_TOKEN"
          } >> "$GITHUB_ENV"

          # Map Bitwarden secrets to Terraform/runtime variables
          if [ -n "$ENV_MAPPING" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              src=$(echo "$line" | awk -F'>' '{print $1}' | xargs)
              dst=$(echo "$line" | awk -F'>' '{print $2}' | xargs)
              # Both names are checked before `${!src}` runs. `xargs` strips
              # whitespace but does not expand, so a name survives it intact —
              # and bash evaluates an array subscript inside `${!name}` as an
              # arithmetic expression, which performs command substitution. A
              # `src` of `x[$(...)]` would therefore execute in a step that has
              # already loaded the R2 keys and the Bitwarden token. Validating
              # after the expansion would be too late, so this runs first.
              # Stated as what is rejected, so a one-character name like `X`
              # stays valid — an "identifier" glob spelled as first-char plus
              # rest silently requires two characters.
              for name in "$src" "$dst"; do
                case "$name" in
                '' | [0-9]* | *[!A-Za-z0-9_]*)
                  echo "Error: env-mapping name is not a valid identifier" >&2
                  exit 1
                  ;;
                esac
              done
              value="${!src}"
              # Same line-based sink as above: the mapped value comes from a
              # Bitwarden secret, so a newline in it would inject entries for
              # every following step.
              if [ "$value" != "${value//[$'\n\r']/}" ]; then
                echo "Error: multi-line value for $dst is not supported" >&2
                exit 1
              fi
              [ -n "$value" ] && echo "$dst=$value" >> "$GITHUB_ENV"
            done <<< "$ENV_MAPPING"
            echo "Environment variable mapping complete"
          fi

      - name: 'Pre-Script Execution'
        if: inputs.pre-script != ''
        env:
          PRE_SCRIPT: ${{ inputs.pre-script }}
        run: |
          echo "Executing pre-script..."
          bash -Eeo pipefail -c "$PRE_SCRIPT"
          echo "Pre-script execution complete"

      - name: 'Terraform Initialization'
        working-directory: ${{ inputs.working-directory }}
        env:
          APPLY_RETRIES: ${{ inputs.apply-retries }}
          INIT_FLAG: ${{ inputs.init-flag }}
        run: |
          # Clean up cached workspace selection to prevent stale workspace errors
          if [ -f .terraform/environment ]; then
            echo "Removing cached workspace selection: $(cat .terraform/environment)"
            rm -f .terraform/environment
          fi

          max_attempts="$APPLY_RETRIES"
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Init attempt $attempt of $max_attempts..."

            # init-flag may carry several flags and must split into separate
            # terraform arguments; see env: above. Keep the directive on the
            # line directly above the command it applies to.
            # shellcheck disable=SC2086
            if terraform init \
              -backend-config="access_key=$R2_ACCESS_KEY" \
              -backend-config="secret_key=$R2_SECRET_KEY" \
              ${INIT_FLAG} \
              -input=false; then
              echo "Terraform initialization successful"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "All initialization attempts failed"
              exit 1
            fi
            sleep 5
            attempt=$((attempt + 1))
          done

      - name: 'Workspace Management'
        working-directory: ${{ inputs.working-directory }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          WORKSPACE="$ENVIRONMENT"
          if terraform workspace list | grep -q "\b$WORKSPACE\b"; then
            terraform workspace select "$WORKSPACE"
          else
            terraform workspace new "$WORKSPACE"
          fi

      - name: 'Infrastructure Planning'
        id: plan
        working-directory: ${{ inputs.working-directory }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PARALLELISM: ${{ inputs.parallelism }}
          MODE: ${{ inputs.mode }}
        run: |
          set +e

          PLAN_FILE="${ENVIRONMENT}.tfplan"
          VAR_FILE="environments/${ENVIRONMENT}.tfvars"

          terraform plan \
            -var-file="$VAR_FILE" \
            -out="$PLAN_FILE" \
            -detailed-exitcode \
            -input=false \
            -parallelism="$PARALLELISM"

          PLAN_EXIT_CODE=$?

          case $PLAN_EXIT_CODE in
            0) echo "outcome=no-changes" >> "$GITHUB_OUTPUT" ;;
            2) echo "outcome=has-changes" >> "$GITHUB_OUTPUT" ;;
            *) echo "outcome=error" >> "$GITHUB_OUTPUT"; exit $PLAN_EXIT_CODE ;;
          esac

          # Set drift_detected output for drift mode
          if [ "$MODE" = "drift" ]; then
            case $PLAN_EXIT_CODE in
              0) echo "drift_detected=false" >> "$GITHUB_OUTPUT" ;;
              2) echo "drift_detected=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "drift_detected=error" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      # Extract the drift summary from the fresh plan — this position is
      # MANDATORY: the .tfplan is still on disk (Security Cleanup removes it at
      # the end of the job) and Terraform is initialised against R2, so no
      # second setup or artifact is needed.
      #
      # LEVEL-A BOUNDARY (value freedom): the jq query reads .address and
      # .change.actions exclusively and NEVER touches .change.before/.after. It
      # is an exact duplicate of the query in scripts/drift-summary.sh — this
      # workflow checks out the consumer repo, so the script is not on disk at
      # runtime, hence the inline copy. When one changes, the other must follow;
      # scripts/tests/test-drift-summary-parity.sh enforces that equality by
      # extracting the jq query from this YAML and running it against the
      # script. No longer by hand (scripts/tests/test-drift-summary.sh remains
      # the anchor of value freedom). Drift mode only (YAGNI). A broken summary
      # must never suppress the drift report -> on error the string stays empty
      # and the step is never fatal.
      - name: 'Drift Summary Extraction'
        id: drift_summary
        if: ${{ inputs.mode == 'drift' && steps.plan.outputs.drift_detected == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set +e
          PLAN_FILE="${ENVIRONMENT}.tfplan"
          CAP=50

          LINES="$(terraform show -json "$PLAN_FILE" 2>/dev/null | jq -r '
            .resource_changes // []
            | map(select((.change.actions // []) != ["no-op"] and (.change.actions // []) != ["read"]))
            | .[]
            | "\(.change.actions | join("+")) \(.address)"
          ' 2>/dev/null)"

          SUMMARY=""
          if [ -n "$LINES" ]; then
            TOTAL="$(printf '%s\n' "$LINES" | wc -l)"
            if [ "$TOTAL" -gt "$CAP" ]; then
              SUMMARY="$(printf '%s\n' "$LINES" | head -n "$CAP")"
              SUMMARY="$SUMMARY"$'\n'"… $((TOTAL - CAP)) more (truncated)"
            else
              SUMMARY="$LINES"
            fi
          fi

          DELIM="drift_$(openssl rand -hex 8 2>/dev/null || echo RANDOM$$)"
          {
            echo "summary<<${DELIM}"
            printf '%s\n' "$SUMMARY"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: 'Plan Artifact Storage'
        if: steps.plan.outputs.outcome != 'error'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan-${{ inputs.project-name }}-${{ inputs.environment }}
          path: '${{ inputs.working-directory }}/*.tfplan'
          retention-days: 30
          if-no-files-found: warn

      - name: 'Configuration Deployment'
        id: apply
        if: |
          inputs.mode == 'deploy' &&
          inputs.should-apply == 'true' &&
          (steps.plan.outputs.outcome == 'has-changes' ||
           steps.plan.outputs.outcome == 'no-changes')
        working-directory: ${{ inputs.working-directory }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          APPLY_RETRIES: ${{ inputs.apply-retries }}
          APPLY_TIMEOUT_MINUTES: ${{ inputs.apply-timeout-minutes }}
          PARALLELISM: ${{ inputs.parallelism }}
        run: |
          PLAN_FILE="${ENVIRONMENT}.tfplan"
          max_attempts="$APPLY_RETRIES"
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Apply attempt $attempt of $max_attempts..."

            if timeout "${APPLY_TIMEOUT_MINUTES}m" terraform apply \
              -auto-approve=true \
              -input=false \
              -parallelism="$PARALLELISM" \
              "$PLAN_FILE"; then
              echo "outcome=success" >> "$GITHUB_OUTPUT"
              terraform state list > /dev/null
              echo "Terraform apply completed successfully"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "outcome=failed" >> "$GITHUB_OUTPUT"
              echo "All apply attempts failed"
              terraform state list | head -10 || true
              exit 1
            fi
            echo "Retrying in 10 seconds..."
            sleep 10
            attempt=$((attempt + 1))
          done

      - name: 'Security Cleanup'
        if: always()
        working-directory: ${{ inputs.working-directory }}
        run: |
          find . -name "*.tfplan" -type f -delete 2>/dev/null || true
          find . -name "*.tfstate*" -type f -delete 2>/dev/null || true

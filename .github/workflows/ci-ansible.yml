---
name: Continuous Integration - Ansible

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: false
        default: 'ubuntu-latest'
        description: >-
          Single runner label for all jobs in this workflow (e.g.
          `ubuntu-latest`, `self-hosted`). Runner groups and multi-label
          selectors are not supported.
      ansible-version:
        type: string
        default: '8.5.0'
        description: 'Ansible version to install'
      python-version:
        type: string
        default: '3.12'
        description: 'Python version to use'
      working-directory:
        type: string
        default: '.'
        description: 'Directory containing Ansible playbooks'
      playbook-file:
        type: string
        default: 'site.yml'
        description: 'Main playbook file for syntax check'
      requirements-file:
        type: string
        default: 'requirements.yml'
        description: 'Ansible Galaxy requirements file'
      enable-ansible-lint:
        type: boolean
        default: true
        description: 'Run ansible-lint on playbooks'
      enable-yamllint:
        type: boolean
        default: false
        description: 'Run yamllint on YAML files'
      yamllint-strict:
        type: boolean
        default: true
        description: 'Fail the job when yamllint reports any issue'
      ansible-lint-strict:
        type: boolean
        default: false
        description: 'Fail on ansible-lint warnings'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  # One job, not three. `validation`, `lint` and `yamllint` each took their own
  # runner, and Actions bills every job rounded up to a full minute — three
  # billed minutes for work measured at 63s, 41s and 5s across 327 runs in
  # `sbaerlocher/infrastructure` (July and August 2026). Worse than the
  # round-up: `validation` and `lint` each ran their own `pip install ansible`,
  # so the same multi-hundred-megabyte download happened twice per run. Merged,
  # it happens once.
  #
  # `needs: validation` on the other two was fail-fast only (see the comments
  # this replaces), never an ordering requirement, so nothing depended on the
  # fan-out.
  #
  # The job keeps the name `Validate`: consumers list `<caller-job> / Validate`
  # in their rulesets. `Lint` and `YAML Lint` disappear as checks — see
  # CHANGELOG.md for the migration.
  #
  # Independence is preserved by `continue-on-error` on every check step: a
  # failing syntax check no longer hides the lint findings after it, and the
  # linters install separately from Ansible so a resolver conflict there cannot
  # take the syntax check down. The enforce step at the end turns any recorded
  # failure back into a red job.
  validation:
    name: Validate
    runs-on: ${{ inputs.runner }}
    # Sum of the three former budgets (15 + 15 + 10), not the largest: the steps
    # now run serially under one cap. A tighter cap would also kill the
    # always() enforce step, the one that says which check was in flight.
    timeout-minutes: 30

    steps:
      - name: Repository Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          # Note: cache disabled because not all projects have requirements.txt

      - name: Cache Ansible Collections
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v6.2.0
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ansible-collections-${{ runner.os }}-${{ hashFiles(format('{0}/{1}', inputs.working-directory, inputs.requirements-file)) }}
          restore-keys: |
            ansible-collections-${{ runner.os }}-

      # One `pip install` for all three former jobs. `validation` and `lint`
      # each installed the same ansible distribution on their own runner; the
      # linters are appended here rather than installed again later. Both are
      # conditional on their input so a caller that disabled a linter does not
      # pay for its wheel.
      - name: Install Ansible
        id: install
        env:
          ANSIBLE_VERSION: ${{ inputs.ansible-version }}
          ENABLE_ANSIBLE_LINT: ${{ inputs.enable-ansible-lint }}
          ENABLE_YAMLLINT: ${{ inputs.enable-yamllint }}
        run: |
          set -euo pipefail
          echo "::group::Install Ansible $ANSIBLE_VERSION"
          pip install "ansible==$ANSIBLE_VERSION" requests
          ansible --version
          echo "::endgroup::"

      # Separate from the Ansible install above, and not fatal: the linters
      # resolve against ansible-core, and a version conflict there (ansible 8.x
      # pins core 2.15 while current ansible-lint wants >= 2.16) must not take
      # the syntax check down with it. Its outcome gates only the lint steps.
      - name: Install Linters
        id: linters
        if: >-
          steps.install.outcome == 'success'
          && (inputs.enable-ansible-lint || inputs.enable-yamllint)
        continue-on-error: true
        env:
          ENABLE_ANSIBLE_LINT: ${{ inputs.enable-ansible-lint }}
          ENABLE_YAMLLINT: ${{ inputs.enable-yamllint }}
        run: |
          set -euo pipefail
          echo "::group::Install Linters"
          PACKAGES=()
          if [ "$ENABLE_ANSIBLE_LINT" = "true" ]; then
            PACKAGES+=(ansible-lint)
          fi
          if [ "$ENABLE_YAMLLINT" = "true" ]; then
            PACKAGES+=(yamllint)
          fi
          pip install "${PACKAGES[@]}"
          if [ "$ENABLE_ANSIBLE_LINT" = "true" ]; then
            ansible-lint --version
          fi
          if [ "$ENABLE_YAMLLINT" = "true" ]; then
            yamllint --version
          fi
          echo "::endgroup::"

      - name: Install Ansible Collections
        id: collections
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: |
          set -euo pipefail
          echo "::group::Install Ansible Collections"
          if [ -f "$REQUIREMENTS_FILE" ]; then
            echo "Installing collections from $REQUIREMENTS_FILE..."
            # `-p` rather than the ansible.cfg default: a workspace-relative
            # `collections_path` would drop third-party YAML into the tree that
            # `Run yamllint` walks below, and this is the path the cache step
            # already declares.
            ansible-galaxy collection install -r "$REQUIREMENTS_FILE" \
              -p ~/.ansible/collections
          else
            echo "::warning::No requirements file found at $REQUIREMENTS_FILE"
          fi
          echo "::endgroup::"

      - name: Ansible Syntax Check
        id: syntax
        if: steps.collections.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          # Unquoted at the call site below so a glob like `playbooks/*.yml`
          # still expands into one argv word per playbook; keep it that way.
          PLAYBOOK_FILE: ${{ inputs.playbook-file }}
        run: |
          set -euo pipefail
          echo "::group::Ansible Syntax Check"
          echo "Checking syntax of $PLAYBOOK_FILE..."
          # shellcheck disable=SC2086 # intentional: see env comment above
          ansible-playbook --syntax-check $PLAYBOOK_FILE
          echo "::notice::Ansible syntax check passed ✅"
          echo "::endgroup::"

      # Former `lint` job. Its job-level `if: inputs.enable-ansible-lint` is now
      # a step-level `if`, and its `needs: validation` fail-fast is the syntax
      # outcome test — same semantics, no second runner and no second
      # `pip install ansible`. `!= 'failure'` rather than `== 'success'`: the
      # gate is fail-fast, and a syntax check that was itself skipped must not
      # suppress the lint. The collection install is a real dependency, so that
      # one is tested for success.
      - name: Run ansible-lint
        id: ansible-lint
        if: >-
          inputs.enable-ansible-lint
          && steps.collections.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          # Unquoted at the call sites below so a glob like `playbooks/*.yml`
          # still expands into one argv word per playbook; keep it that way.
          PLAYBOOK_FILE: ${{ inputs.playbook-file }}
          STRICT: ${{ inputs.ansible-lint-strict }}
        run: |
          set -euo pipefail
          echo "::group::Run ansible-lint"
          echo "Linting $PLAYBOOK_FILE..."
          if [ "$STRICT" = "true" ]; then
            # shellcheck disable=SC2086 # intentional: see env comment above
            ansible-lint $PLAYBOOK_FILE
          else
            # Non-strict: findings are tolerated, but `|| true` alone would make
            # them invisible in a green job. Record the status and surface it as
            # a warning so the run still says the lint was unhappy.
            # shellcheck disable=SC2086 # intentional: see env comment above
            ansible-lint $PLAYBOOK_FILE || STATUS=$?
            if [ "${STATUS:-0}" -ne 0 ]; then
              echo "::warning::ansible-lint reported issues (exit ${STATUS}); \
          tolerated because ansible-lint-strict is false"
            fi
          fi
          echo "::endgroup::"

      # Former `yamllint` job. Same treatment: job-level `if` becomes
      # step-level, `needs: validation` becomes the syntax outcome test. It does
      # not depend on the collection install — yamllint parses files, it does
      # not resolve Ansible content — so that one is not in its gate.
      - name: Run yamllint
        id: yamllint
        if: >-
          inputs.enable-yamllint
          && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}
        env:
          STRICT: ${{ inputs.yamllint-strict }}
        run: |
          set -euo pipefail
          echo "::group::Run yamllint"
          # $PWD is the step's working-directory, set above
          echo "Linting YAML files in $PWD..."
          if [ "$STRICT" = "true" ]; then
            yamllint -f parsable .
          else
            # Non-strict: see the ansible-lint step above for why the exit
            # status is surfaced rather than swallowed by a bare `|| true`.
            yamllint -f parsable . || STATUS=$?
            if [ "${STATUS:-0}" -ne 0 ]; then
              echo "::warning::yamllint reported issues (exit ${STATUS}); \
          tolerated because yamllint-strict is false"
            fi
          fi
          echo "::endgroup::"

      # `continue-on-error` above keeps a failing check from masking the ones
      # after it, which also means the job would end green on its own. This step
      # is what turns any recorded failure back into a red job. Every step
      # carrying `continue-on-error` appears here — one that does not would be a
      # silent-green hole.
      - name: Enforce validation results
        if: always()
        env:
          LINTERS_RESULT: ${{ steps.linters.outcome || 'skipped' }}
          COLLECTIONS_RESULT: ${{ steps.collections.outcome || 'skipped' }}
          SYNTAX_RESULT: ${{ steps.syntax.outcome || 'skipped' }}
          ANSIBLE_LINT_RESULT: ${{ steps.ansible-lint.outcome || 'skipped' }}
          YAMLLINT_RESULT: ${{ steps.yamllint.outcome || 'skipped' }}
        run: |
          set -euo pipefail
          FAILED=0
          for pair in \
            "Install Linters:${LINTERS_RESULT}" \
            "Install Ansible Collections:${COLLECTIONS_RESULT}" \
            "Ansible Syntax Check:${SYNTAX_RESULT}" \
            "Run ansible-lint:${ANSIBLE_LINT_RESULT}" \
            "Run yamllint:${YAMLLINT_RESULT}"; do
            name="${pair%:*}"
            result="${pair##*:}"
            if [ "$result" = "failure" ]; then
              echo "::error::${name} failed"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "${FAILED} validation(s) failed"
            exit 1
          fi

          echo "All enabled validations passed"

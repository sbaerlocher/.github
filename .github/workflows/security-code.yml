---
name: Security - Code

on:
  workflow_call:
    inputs:
      languages:
        type: string
        default: '["javascript-typescript"]'
        description: 'Languages to analyze (JSON array: javascript-typescript, go, python, java, etc.)'
      queries:
        type: string
        default: 'security-extended,security-and-quality'
        description: 'Query suites to run'
      node-version-file:
        type: string
        default: '.nvmrc'
        description: 'Node version file (for JS/TS projects)'
      go-version:
        type: string
        default: '1.25'
        description: 'Go version (for Go projects)'
      python-version:
        type: string
        default: '3.12'
        description: 'Python version (for Python projects)'
      package-manager:
        type: string
        default: ''
        description: 'Package manager override (npm, pnpm, yarn). Auto-detected from lock files if empty.'
      build-command:
        type: string
        default: ''
        description: 'Custom build command (optional, autobuild if empty)'
      paths-ignore:
        type: string
        default: 'node_modules,dist,coverage,**/*.spec.ts,**/*.test.ts'
        description: 'Comma-separated list of paths to ignore'
      enable-sarif-upload:
        type: boolean
        default: true
        description: 'Upload SARIF results to GitHub Security tab (requires public repo or GHAS)'
      cancel-in-progress:
        type: boolean
        required: false
        default: true
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  analyze:
    name: Analyze Code (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}

    env:
      # Let Go fetch the toolchain pinned in go.mod instead of failing when the
      # Go on PATH is older (GOTOOLCHAIN defaults to local). Applies to the
      # extractor, autobuild and analyze steps alike. No-op for non-Go
      # languages.
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare CodeQL config
        id: codeql-config
        env:
          PATHS_IGNORE: ${{ inputs.paths-ignore }}
        run: |
          set -euo pipefail
          {
            echo "yaml<<CODEQL_CONFIG_EOF"
            echo "paths-ignore:"
            IFS=',' read -ra PATHS <<< "$PATHS_IGNORE"
            for path in "${PATHS[@]}"; do
              echo "  - '$path'"
            done
            echo "CODEQL_CONFIG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Must run before codeql-action/init: the Go extractor is configured at
      # init time and otherwise picks up the Go bundled with the CodeQL
      # release, which can be older than the version go.mod requires.
      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          queries: ${{ inputs.queries }}
          config: ${{ steps.codeql-config.outputs.yaml }}

      # Detect package manager (explicit input takes precedence over lock file detection)
      - name: Detect package manager
        if: matrix.language == 'javascript-typescript'
        id: detect-pm
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          if [ -n "$PACKAGE_MANAGER" ]; then
            printf 'manager=%s\n' "$PACKAGE_MANAGER" >> "$GITHUB_OUTPUT"
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          fi

      # Setup language-specific environments
      - name: Install pnpm
        if: matrix.language == 'javascript-typescript' && steps.detect-pm.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: ${{ steps.detect-pm.outputs.manager }}

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      # Build steps - JavaScript/TypeScript
      - name: Install dependencies (npm)
        if: matrix.language == 'javascript-typescript' && inputs.build-command == '' && steps.detect-pm.outputs.manager == 'npm'
        run: npm ci --prefer-offline --no-audit

      - name: Install dependencies (pnpm)
        if: matrix.language == 'javascript-typescript' && inputs.build-command == '' && steps.detect-pm.outputs.manager == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (yarn)
        if: matrix.language == 'javascript-typescript' && inputs.build-command == '' && steps.detect-pm.outputs.manager == 'yarn'
        run: yarn install --frozen-lockfile

      - name: Build project (JavaScript/TypeScript)
        if: matrix.language == 'javascript-typescript' && inputs.build-command == ''
        run: ${{ steps.detect-pm.outputs.manager }} run build

      # Build steps - Python
      - name: Install dependencies (Python)
        if: matrix.language == 'python' && inputs.build-command == ''
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Custom build command
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: Autobuild
        if: inputs.build-command == '' && matrix.language != 'javascript-typescript' && matrix.language != 'python'
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: '/language:${{ matrix.language }}'
          upload: ${{ inputs.enable-sarif-upload && 'always' || 'never' }}
          output: codeql-results

      - name: Upload SARIF as artifact
        if: ${{ !inputs.enable-sarif-upload }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results/*.sarif
          retention-days: 30

      - name: Generate Summary
        if: always()
        env:
          ENABLE_SARIF_UPLOAD: ${{ inputs.enable-sarif-upload }}
          LANGUAGE: ${{ matrix.language }}
          JOB_STATUS: ${{ job.status }}
          QUERIES: ${{ inputs.queries }}
          DETECTED_PM: ${{ steps.detect-pm.outputs.manager || 'N/A' }}
          PATHS_IGNORE: ${{ inputs.paths-ignore }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          if [ "$ENABLE_SARIF_UPLOAD" = "true" ]; then
            RESULTS_INFO="Results available in the GitHub Security tab"
          else
            RESULTS_INFO="Results uploaded as workflow artifact (SARIF)"
          fi

          # Values arrive via env: and are substituted by printf, not by the
          # shell parsing the body — a value containing $(...) is written
          # literally instead of being executed by the runner.
          {
            printf '# Security — Code Analysis (SAST)\n\n'
            printf '**Language:** %s\n' "$LANGUAGE"
            printf '**Status:** %s\n' "$JOB_STATUS"
            printf '**Timestamp:** %s\n\n' "$TIMESTAMP"
            printf '**Query Suite:** %s\n' "$QUERIES"
            printf '**Package Manager:** %s\n' "$DETECTED_PM"
            printf '**Paths Ignored:** %s\n' "$PATHS_IGNORE"
            printf '**Results:** %s\n' "$RESULTS_INFO"
          } >> "$GITHUB_STEP_SUMMARY"

---
name: Release - Helm

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
        description: 'Runner label or group for all jobs in this workflow'
      chart-path:
        type: string
        required: false
        default: 'deploy/helm'
        description: 'Path to Helm chart directory'
      chart-name:
        type: string
        required: true
        description: 'Helm chart name'
      helm-version:
        type: string
        required: false
        default: 'v3.14.0'
        description: 'Helm version to use'
      registry:
        type: string
        required: false
        default: 'ghcr.io'
        description: 'OCI registry for Helm charts'
      registry-path:
        type: string
        required: true
        description: 'Registry path (e.g. github.repository_owner/charts)'
      version:
        type: string
        required: true
        description: 'Version to release (will be stripped of v prefix)'
      image-digest:
        type: string
        required: false
        default: ''
        description: 'Docker image digest (optional, e.g. sha256:abc123...)'
      cancel-in-progress:
        type: boolean
        required: false
        default: false
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).
    secrets:
      registry-token:
        required: true
      registry-username:
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  helm-release:
    name: Package & Publish
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Update Chart version and appVersion
        env:
          # Inputs via environment instead of `${{ }}` in the script body: that
          # way bash parses the values as data, not as shell source.
          CHART_PATH: ${{ inputs.chart-path }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"  # Remove 'v' prefix if present

          # Guard ahead of the `sed` calls below: `$VERSION` ends up inside the
          # s-expression itself. A `/` terminates it early, `&` and `\` are
          # metacharacters in the replacement half, and a newline aborts the
          # script with "unterminated s command". Allowlist rather than denylist
          # so the class is closed. Git tag names may carry slashes and the
          # callers' `v*` filter does not exclude them.
          # This step runs without an `if:` and before the package step, so an
          # `exit 1` aborts the job before the second, independent
          # `VERSION="${INPUT_VERSION#v}"` there is evaluated.
          # The rejected value goes to the log via `printf %q`, not into the
          # `::error::` annotation: a newline in there would otherwise be parsed
          # as a new workflow command.
          case "$VERSION" in
            *[!A-Za-z0-9._+-]*)
              echo "::error::version must match [A-Za-z0-9._+-]+ — rejected, see log"
              printf 'rejected version: %q\n' "$VERSION"
              exit 1
              ;;
          esac

          # Temp file plus `mv` instead of `sed -i "…"`: the suffixless `-i` form
          # is GNU-only. BSD sed (macOS) reads the script as a backup suffix and
          # aborts with "invalid command code" without changing the file.
          # Temp file under $RUNNER_TEMP so a sed error leaves no `.tmp` in the
          # chart directory that `helm package` would bundle along.
          CHART="$CHART_PATH/Chart.yaml"
          TMP="$RUNNER_TEMP/Chart.yaml"
          sed "s/^version:.*/version: $VERSION/" "$CHART" > "$TMP" && mv "$TMP" "$CHART"
          sed "s/^appVersion:.*/appVersion: \"$VERSION\"/" "$CHART" > "$TMP" && mv "$TMP" "$CHART"

          echo "Updated Chart.yaml:"
          grep -E "(version|appVersion):" "$CHART"

      - name: Update values.yaml with image digest
        if: inputs.image-digest != ''
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
        run: |
          # Same guard as in the version step, here for the `|` delimiter:
          # `docker/build-push-action` always yields `sha256:<hex>`, but a
          # foreign caller can set the input freely. The empty case is already
          # excluded by `if: inputs.image-digest != ''`.
          case "$IMAGE_DIGEST" in
            *[!A-Za-z0-9:]*)
              echo "::error::image-digest must match [A-Za-z0-9:]+ — rejected, see log"
              printf 'rejected image-digest: %q\n' "$IMAGE_DIGEST"
              exit 1
              ;;
          esac

          # Update values.yaml: clear tag and set digest
          # Temp file plus `mv` instead of `sed -i "…"` — GNU-only, see the
          # comment in the "Update Chart version and appVersion" step.
          VALUES="$CHART_PATH/values.yaml"
          TMP="$RUNNER_TEMP/values.yaml"
          sed 's/^  tag:.*/  tag: ""/' "$VALUES" > "$TMP" && mv "$TMP" "$VALUES"
          sed "s|^  digest:.*|  digest: \"$IMAGE_DIGEST\"|" "$VALUES" > "$TMP" && mv "$TMP" "$VALUES"

          echo "Updated values.yaml:"
          grep -A 3 "^image:" "$VALUES"

      - name: Package and publish Helm chart
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          CHART_NAME: ${{ inputs.chart-name }}
          INPUT_VERSION: ${{ inputs.version }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_PATH: ${{ inputs.registry-path }}
          REGISTRY_TOKEN: ${{ secrets.registry-token }}
          REGISTRY_USERNAME: ${{ secrets.registry-username || github.actor }}
        run: |
          # Package chart
          helm package "$CHART_PATH" --destination .

          # Login to registry
          echo "$REGISTRY_TOKEN" | helm registry login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin

          # Push chart
          VERSION="${INPUT_VERSION#v}"
          helm push "$CHART_NAME-$VERSION.tgz" "oci://$REGISTRY/$REGISTRY_PATH"

          echo "✅ Helm chart published successfully"

---
name: Release - Helm

on:
  workflow_call:
    inputs:
      chart-path:
        type: string
        required: false
        default: 'deploy/helm'
        description: 'Path to Helm chart directory'
      chart-name:
        type: string
        required: true
        description: 'Helm chart name'
      helm-version:
        type: string
        required: false
        default: 'v3.14.0'
        description: 'Helm version to use'
      registry:
        type: string
        required: false
        default: 'ghcr.io'
        description: 'OCI registry for Helm charts'
      registry-path:
        type: string
        required: true
        description: 'Registry path (e.g. github.repository_owner/charts)'
      version:
        type: string
        required: true
        description: 'Version to release (will be stripped of v prefix)'
      image-digest:
        type: string
        required: false
        default: ''
        description: 'Docker image digest (optional, e.g. sha256:abc123...)'
      cancel-in-progress:
        type: boolean
        required: false
        default: false
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).
    secrets:
      registry-token:
        required: true
      registry-username:
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  helm-release:
    name: Package & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Update Chart version and appVersion
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix if present

          # Temp-Datei plus `mv` statt `sed -i "…"`: die suffixlose `-i`-Form ist
          # GNU-only. BSD-sed (macOS) liest das Script als Backup-Suffix und
          # bricht mit "invalid command code" ab, ohne die Datei zu ändern.
          CHART="${{ inputs.chart-path }}/Chart.yaml"
          sed "s/^version:.*/version: $VERSION/" "$CHART" > "$CHART.tmp" && mv "$CHART.tmp" "$CHART"
          sed "s/^appVersion:.*/appVersion: \"$VERSION\"/" "$CHART" > "$CHART.tmp" && mv "$CHART.tmp" "$CHART"

          echo "Updated Chart.yaml:"
          grep -E "(version|appVersion):" ${{ inputs.chart-path }}/Chart.yaml

      - name: Update values.yaml with image digest
        if: inputs.image-digest != ''
        run: |
          DIGEST="${{ inputs.image-digest }}"

          # Update values.yaml: clear tag and set digest
          # Temp-Datei plus `mv` statt `sed -i "…"` — GNU-only, siehe Kommentar
          # im Schritt "Update Chart version and appVersion".
          VALUES="${{ inputs.chart-path }}/values.yaml"
          sed 's/^  tag:.*/  tag: ""/' "$VALUES" > "$VALUES.tmp" && mv "$VALUES.tmp" "$VALUES"
          sed "s|^  digest:.*|  digest: \"$DIGEST\"|" "$VALUES" > "$VALUES.tmp" && mv "$VALUES.tmp" "$VALUES"

          echo "Updated values.yaml:"
          grep -A 3 "^image:" ${{ inputs.chart-path }}/values.yaml

      - name: Package and publish Helm chart
        run: |
          # Package chart
          helm package ${{ inputs.chart-path }} --destination .

          # Login to registry
          echo "${{ secrets.registry-token }}" | helm registry login "${{ inputs.registry }}" --username "${{ secrets.registry-username || github.actor }}" --password-stdin

          # Push chart
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          helm push "${{ inputs.chart-name }}-$VERSION.tgz" "oci://${{ inputs.registry }}/${{ inputs.registry-path }}"

          echo "✅ Helm chart published successfully"

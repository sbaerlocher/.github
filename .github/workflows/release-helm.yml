---
name: Release - Helm

on:
  workflow_call:
    inputs:
      chart-path:
        type: string
        required: false
        default: 'deploy/helm'
        description: 'Path to Helm chart directory'
      chart-name:
        type: string
        required: true
        description: 'Helm chart name'
      helm-version:
        type: string
        required: false
        default: 'v3.14.0'
        description: 'Helm version to use'
      registry:
        type: string
        required: false
        default: 'ghcr.io'
        description: 'OCI registry for Helm charts'
      registry-path:
        type: string
        required: true
        description: 'Registry path (e.g. github.repository_owner/charts)'
      version:
        type: string
        required: true
        description: 'Version to release (will be stripped of v prefix)'
      image-digest:
        type: string
        required: false
        default: ''
        description: 'Docker image digest (optional, e.g. sha256:abc123...)'
      cancel-in-progress:
        type: boolean
        required: false
        default: false
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).
    secrets:
      registry-token:
        required: true
      registry-username:
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  helm-release:
    name: Package & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Update Chart version and appVersion
        env:
          # Inputs als Environment statt via `${{ }}` in den Script-Body: so
          # parst bash die Werte als Daten, nicht als Shell-Quelltext.
          CHART_PATH: ${{ inputs.chart-path }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"  # Remove 'v' prefix if present

          # Guard vor den `sed`-Aufrufen unten: `$VERSION` landet im
          # s-Ausdruck selbst. `/` beendet ihn vorzeitig, `&` und `\` sind in
          # der Replacement-Hälfte Metazeichen, ein Newline bricht das Script
          # mit "unterminated s command" ab. Allowlist statt Denylist, damit
          # die Klasse geschlossen ist. Git-Tag-Namen dürfen Slashes tragen
          # und das `v*`-Filter der Caller schliesst sie nicht aus.
          # Dieser Step läuft ohne `if:` und vor dem Package-Step, ein
          # `exit 1` bricht also den Job ab, bevor das zweite, unabhängige
          # `VERSION="${INPUT_VERSION#v}"` dort ausgewertet wird.
          # Der abgelehnte Wert geht per `printf %q` ins Log, nicht in die
          # `::error::`-Annotation: ein Newline darin würde sonst als neues
          # Workflow-Kommando geparst.
          case "$VERSION" in
            *[!A-Za-z0-9._+-]*)
              echo "::error::version must match [A-Za-z0-9._+-]+ — rejected, see log"
              printf 'rejected version: %q\n' "$VERSION"
              exit 1
              ;;
          esac

          # Temp-Datei plus `mv` statt `sed -i "…"`: die suffixlose `-i`-Form ist
          # GNU-only. BSD-sed (macOS) liest das Script als Backup-Suffix und
          # bricht mit "invalid command code" ab, ohne die Datei zu ändern.
          # Temp-Datei unter $RUNNER_TEMP, damit ein sed-Fehler keine `.tmp`
          # im Chart-Verzeichnis liegen lässt, die `helm package` mitpackt.
          CHART="$CHART_PATH/Chart.yaml"
          TMP="$RUNNER_TEMP/Chart.yaml"
          sed "s/^version:.*/version: $VERSION/" "$CHART" > "$TMP" && mv "$TMP" "$CHART"
          sed "s/^appVersion:.*/appVersion: \"$VERSION\"/" "$CHART" > "$TMP" && mv "$TMP" "$CHART"

          echo "Updated Chart.yaml:"
          grep -E "(version|appVersion):" "$CHART"

      - name: Update values.yaml with image digest
        if: inputs.image-digest != ''
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
        run: |
          # Gleicher Guard wie beim Version-Step, hier für den `|`-Delimiter:
          # `docker/build-push-action` liefert immer `sha256:<hex>`, ein
          # fremder Caller kann den Input aber frei setzen. Der leere Fall
          # ist durch `if: inputs.image-digest != ''` schon ausgeschlossen.
          case "$IMAGE_DIGEST" in
            *[!A-Za-z0-9:]*)
              echo "::error::image-digest must match [A-Za-z0-9:]+ — rejected, see log"
              printf 'rejected image-digest: %q\n' "$IMAGE_DIGEST"
              exit 1
              ;;
          esac

          # Update values.yaml: clear tag and set digest
          # Temp-Datei plus `mv` statt `sed -i "…"` — GNU-only, siehe Kommentar
          # im Schritt "Update Chart version and appVersion".
          VALUES="$CHART_PATH/values.yaml"
          TMP="$RUNNER_TEMP/values.yaml"
          sed 's/^  tag:.*/  tag: ""/' "$VALUES" > "$TMP" && mv "$TMP" "$VALUES"
          sed "s|^  digest:.*|  digest: \"$IMAGE_DIGEST\"|" "$VALUES" > "$TMP" && mv "$TMP" "$VALUES"

          echo "Updated values.yaml:"
          grep -A 3 "^image:" "$VALUES"

      - name: Package and publish Helm chart
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          CHART_NAME: ${{ inputs.chart-name }}
          INPUT_VERSION: ${{ inputs.version }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_PATH: ${{ inputs.registry-path }}
          REGISTRY_TOKEN: ${{ secrets.registry-token }}
          REGISTRY_USERNAME: ${{ secrets.registry-username || github.actor }}
        run: |
          # Package chart
          helm package "$CHART_PATH" --destination .

          # Login to registry
          echo "$REGISTRY_TOKEN" | helm registry login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin

          # Push chart
          VERSION="${INPUT_VERSION#v}"
          helm push "$CHART_NAME-$VERSION.tgz" "oci://$REGISTRY/$REGISTRY_PATH"

          echo "✅ Helm chart published successfully"

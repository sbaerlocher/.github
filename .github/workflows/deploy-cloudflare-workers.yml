---
name: Deploy - Cloudflare Workers

on:
  workflow_call:
    inputs:
      workers:
        type: string
        required: true
        description: 'JSON array of worker names to deploy (e.g., ["worker1", "worker2"])'
      package-manager:
        type: string
        default: 'pnpm'
        description: 'Package manager to use (npm, pnpm, bun)'
      node-version-file:
        type: string
        default: '.nvmrc'
        description: 'Node version file path'
      wrangler-version:
        type: string
        default: '4.56.0'
        description: 'Wrangler version to use'
      working-directory-prefix:
        type: string
        default: 'src'
        description: 'Prefix for worker directories'
      apply-patches:
        type: boolean
        default: false
        description: 'Apply patches before deployment'
      run-scripts:
        type: boolean
        default: true
        description: 'Run package.json scripts during setup'
      cancel-in-progress:
        type: boolean
        required: false
        default: false
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).
    secrets:
      BW_ACCESS_TOKEN:
        required: true
        description: 'Bitwarden access token for credentials'

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  deploy:
    name: Deploy Worker (${{ matrix.worker }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(inputs.workers) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          submodules: recursive

      - name: Apply patches
        if: inputs.apply-patches
        run: |
          for patch in patches/*.patch; do
            [ -f "$patch" ] && patch -p0 -N < "$patch" || true
          done

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Get cache directory
        id: cache-dir
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm)
              echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT
              ;;
            bun)
              echo "dir=$HOME/.bun/install/cache" >> $GITHUB_OUTPUT
              ;;
            npm)
              echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          key: ${{ runner.os }}-${{ inputs.package-manager }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.package-manager }}-

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory-prefix }}/${{ matrix.worker }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            bun)
              bun install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
          esac

      - name: Run build scripts
        if: inputs.run-scripts
        working-directory: ${{ inputs.working-directory-prefix }}/${{ matrix.worker }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm)
              if ! pnpm build; then
                echo "::warning::Build script failed or not found for ${{ matrix.worker }}"
              fi
              ;;
            bun)
              if ! bun run build; then
                echo "::warning::Build script failed or not found for ${{ matrix.worker }}"
              fi
              ;;
            npm)
              if ! npm run build; then
                echo "::warning::Build script failed or not found for ${{ matrix.worker }}"
              fi
              ;;
          esac

      - name: Load Cloudflare Credentials
        uses: bitwarden/sm-action@27c0c9dcab679d7250dbab91227c85b49ffa5e0f # v3.0.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            29f6ff1b-0c2e-4a12-bcef-b3cc010c8e96 > CLOUDFLARE_API_TOKEN
            29d36e20-c80e-4bd1-88d4-b3cc010ca23a > CLOUDFLARE_ACCOUNT_ID

      - name: Deploy ${{ matrix.worker }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          wranglerVersion: ${{ inputs.wrangler-version }}
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory-prefix }}/${{ matrix.worker }}
          command: deploy
          packageManager: ${{ inputs.package-manager }}

      - name: Deployment Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## Deploy — Cloudflare Worker: ${{ matrix.worker }}

          **Status:** ${{ job.status }}
          **Package Manager:** ${{ inputs.package-manager }}
          **Wrangler Version:** ${{ inputs.wrangler-version }}
          EOF

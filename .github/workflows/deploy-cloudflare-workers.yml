---
name: Deploy - Cloudflare Workers

on:
  workflow_call:
    inputs:
      workers:
        type: string
        required: true
        description: 'JSON array of worker names to deploy (e.g., ["worker1", "worker2"])'
      package-manager:
        type: string
        default: 'pnpm'
        description: 'Package manager to use (npm, pnpm, bun)'
      node-version-file:
        type: string
        default: '.nvmrc'
        description: 'Node version file path'
      wrangler-version:
        type: string
        default: '4.56.0'
        description: 'Wrangler version to use'
      working-directory-prefix:
        type: string
        default: 'src'
        description: 'Prefix for worker directories'
      apply-patches:
        type: boolean
        default: false
        description: 'Apply patches before deployment'
      run-scripts:
        type: boolean
        default: true
        description: 'Run package.json scripts during setup'
    secrets:
      BW_ACCESS_TOKEN:
        required: true
        description: 'Bitwarden access token for credentials'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker (${{ matrix.worker }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(inputs.workers) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Apply patches
        if: inputs.apply-patches
        run: |
          for patch in patches/*.patch; do
            [ -f "$patch" ] && patch -p0 -N < "$patch" || true
          done

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Get cache directory
        id: cache-dir
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm)
              echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT
              ;;
            bun)
              echo "dir=$HOME/.bun/install/cache" >> $GITHUB_OUTPUT
              ;;
            npm)
              echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Cache dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          key: ${{ runner.os }}-${{ inputs.package-manager }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.package-manager }}-

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory-prefix }}/${{ matrix.worker }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            bun)
              bun install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
          esac

      - name: Run build scripts
        if: inputs.run-scripts
        working-directory: ${{ inputs.working-directory-prefix }}/${{ matrix.worker }}
        run: |
          case "${{ inputs.package-manager }}" in
            pnpm)
              if ! pnpm build; then
                echo "::warning::Build script failed or not found for ${{ matrix.worker }}"
              fi
              ;;
            bun)
              if ! bun run build; then
                echo "::warning::Build script failed or not found for ${{ matrix.worker }}"
              fi
              ;;
            npm)
              if ! npm run build; then
                echo "::warning::Build script failed or not found for ${{ matrix.worker }}"
              fi
              ;;
          esac

      - name: Load Cloudflare Credentials
        uses: bitwarden/sm-action@f1de238fc00c738c56140796018be9084c2b5d21 # v2
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            29f6ff1b-0c2e-4a12-bcef-b3cc010c8e96 > CLOUDFLARE_API_TOKEN
            29d36e20-c80e-4bd1-88d4-b3cc010ca23a > CLOUDFLARE_ACCOUNT_ID

      - name: Deploy ${{ matrix.worker }}
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          wranglerVersion: ${{ inputs.wrangler-version }}
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory-prefix }}/${{ matrix.worker }}
          command: deploy
          packageManager: ${{ inputs.package-manager }}

      - name: Deployment Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## Worker Deployment: ${{ matrix.worker }}

          **Status**: ${{ job.status }}
          **Package Manager**: ${{ inputs.package-manager }}
          **Wrangler Version**: ${{ inputs.wrangler-version }}

          ---
          *Deployed to Cloudflare Workers*
          EOF

---
name: Deploy - Cloudflare Workers

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: 'ubuntu-latest'
        description: 'Runner label or group for all jobs in this workflow'
      workers:
        type: string
        required: true
        description: 'JSON array of worker names to deploy (e.g., ["worker1", "worker2"])'
      package-manager:
        type: string
        default: 'pnpm'
        description: 'Package manager to use (npm, pnpm, bun)'
      node-version-file:
        type: string
        default: '.nvmrc'
        description: 'Node version file path'
      wrangler-version:
        type: string
        default: '4.56.0'
        description: 'Wrangler version to use'
      working-directory-prefix:
        type: string
        default: 'src'
        description: 'Prefix for worker directories'
      apply-patches:
        type: boolean
        default: false
        description: 'Apply patches before deployment'
      run-scripts:
        type: boolean
        default: true
        description: 'Run package.json scripts during setup'
      cancel-in-progress:
        type: boolean
        required: false
        default: false
        description: |
          Whether to cancel in-progress runs in the same concurrency group.
          Default matches this workflow's intended semantics; override only
          for matrix or fan-out invocations that need different semantics
          than the single-call default.
      concurrency-suffix:
        type: string
        required: false
        default: ''
        description: |
          Optional suffix appended to the concurrency group as `-<suffix>`.
          Empty default preserves the original group name; set to separate
          parallel invocations of this reusable from the same caller (e.g.
          per-matrix-leg or per-mode).
    secrets:
      BW_ACCESS_TOKEN:
        required: true
        description: 'Bitwarden access token for credentials'

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      inputs.concurrency-suffix != '' && format('-{0}', inputs.concurrency-suffix) || ''
    }}
  cancel-in-progress: ${{ inputs.cancel-in-progress }}

jobs:
  deploy:
    name: Deploy Worker (${{ matrix.worker }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(inputs.workers) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Apply patches
        if: inputs.apply-patches
        run: |
          for patch in patches/*.patch; do
            [ -f "$patch" ] && patch -p0 -N < "$patch" || true
          done

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Bun
        if: inputs.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Get cache directory
        id: cache-dir
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
              ;;
            bun)
              echo "dir=$HOME/.bun/install/cache" >> "$GITHUB_OUTPUT"
              ;;
            npm)
              echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          key: ${{ runner.os }}-${{ inputs.package-manager }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.package-manager }}-

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory-prefix }}/${{ matrix.worker }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              pnpm install --frozen-lockfile
              ;;
            bun)
              bun install --frozen-lockfile
              ;;
            npm)
              npm ci
              ;;
          esac

      - name: Run build scripts
        if: inputs.run-scripts
        working-directory: ${{ inputs.working-directory-prefix }}/${{ matrix.worker }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          WORKER: ${{ matrix.worker }}
        run: |
          case "$PACKAGE_MANAGER" in
            pnpm)
              if ! pnpm build; then
                echo "::warning::Build script failed or not found for $WORKER"
              fi
              ;;
            bun)
              if ! bun run build; then
                echo "::warning::Build script failed or not found for $WORKER"
              fi
              ;;
            npm)
              if ! npm run build; then
                echo "::warning::Build script failed or not found for $WORKER"
              fi
              ;;
          esac

      - name: Load Cloudflare Credentials
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            29f6ff1b-0c2e-4a12-bcef-b3cc010c8e96 > CLOUDFLARE_API_TOKEN
            29d36e20-c80e-4bd1-88d4-b3cc010ca23a > CLOUDFLARE_ACCOUNT_ID

      - name: Deploy ${{ matrix.worker }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          wranglerVersion: ${{ inputs.wrangler-version }}
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory-prefix }}/${{ matrix.worker }}
          command: deploy
          packageManager: ${{ inputs.package-manager }}

      - name: Deployment Summary
        if: always()
        env:
          WORKER: ${{ matrix.worker }}
          JOB_STATUS: ${{ job.status }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          WRANGLER_VERSION: ${{ inputs.wrangler-version }}
        # Every value arrives via `env:` and is written with `printf`. A quoted
        # heredoc delimiter alone would not be enough: `${{ }}` is substituted
        # into the script text before the shell sees it, so a value carrying a
        # newline followed by the delimiter would end the heredoc early.
        run: |
          {
            printf '## Deploy — Cloudflare Worker: %s\n\n' "$WORKER"
            printf '**Status:** %s\n' "$JOB_STATUS"
            printf '**Package Manager:** %s\n' "$PACKAGE_MANAGER"
            printf '**Wrangler Version:** %s\n' "$WRANGLER_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
